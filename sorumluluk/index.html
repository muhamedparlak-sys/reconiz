<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RecOniz · Sualtı Mirasına Sahip Çıkmak: Ortak Bir Sorumluluk</title>
<meta name="description" content="Sualtı mirasına sahip çıkmak ortak bir sorumluluktur: Uluburun batığını bildiren sünger dalgıcının hikâyesi, eseri almanın neden kimseye bir şey kazandırmadığı ve kanunun gösterdiği yol; canlandırmalarla.">
<meta name="theme-color" content="#17495A">
<link rel="canonical" href="https://reconiz.org/sorumluluk/">
<meta name="apple-mobile-web-app-title" content="Sorumluluk">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Heritage Rejoiner: RecOniz ana sayfasıyla aynı tokenlar ve düzen (tek sütun, 720px, kutusuz bölümler, aynı başlık ve fotoğraf kartı) */
/* Düzen: tek sütun, 720px okuma genişliği; çekim kartı en üstte, katalog bir "tip levhası" ızgarası.
   Kimlik: deniz mavisi (sea) + pişmiş toprak (clay); tek yazı ailesi: Instrument Sans (başlık 600, metin 400). */
:root{
  --bg:#F6F7F5; --ink:#152021; --muted:#5B6664; --faint:#8C9795; --line:#DCE2E0; --soft:#ECF0EE; --raised:#FFFFFF;
  --sea:#17495A; --sea-soft:#DCE8EB; --on-sea:#FFFFFF; --clay:#9C5B38; --clay-soft:#F1E3D6;
  --z-rim:#2F6DB3; --z-handle:#8A4BC4; --z-body:#2E8554; --z-base:#C9620C;
  --paper:#FFFFFF; --paper-ink:#111111; --well-a:#EDF2F3; --well-b:#DCE6E8; --chartfill:#E9C9A0;
  --bar:#CCD5D3; --map-sea:#CFE0E6; --map-land:#EFE8DC; --map-coast:#9A8F80; --map-ink:#3A2A20; --map-ink2:#1D3A4C; --map-pin:#A0461E; --map-pin-a:rgba(160,70,30,.45); --map-reg:#285A78; --map-reg-a:rgba(40,90,120,.18); --map-sel:#17495A; --map-sel-a:rgba(23,73,90,.75);
  --shadow:0 1px 2px rgba(21,32,33,.06),0 8px 24px -12px rgba(21,32,33,.18);
  --sans:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
    --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
    --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
    --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
    --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
  --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
  --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
  --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
  --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:12px 56px;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--sans);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(21px,4.6vw,25px);line-height:1.2}
p{margin:0}
a{color:var(--sea);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{color:var(--muted);font-size:15px;max-width:66ch}
.lab,.dlab,.citeLabel,.tagline,.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.center{text-align:center}

/* araçlar menüsü */
.bar{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:min(340px,100%);background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.35);padding:12px;display:flex;flex-direction:column;gap:6px}
.menu .lab{padding:4px 8px 6px}
.menu a,.menu .soon{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink);position:relative}
.menu a:hover{background:var(--soft)}
.menu a[aria-current="page"]{background:var(--sea-soft)}
.menu b{font-size:15.5px;font-weight:600;padding-right:72px}
.menu span{font-size:13.5px;color:var(--muted);line-height:1.4}
.menu i{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.menu .soon{opacity:.55}
@media (max-width:420px){ .tools .lang button{padding:4px 6px} .tools{gap:4px} .tools .themebtn{width:32px;height:32px} }
/* başlık */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
.wm{margin:0;line-height:0;color:var(--ink)}
.wm svg{display:block;height:34px;width:auto}
.mark{flex:none;width:34px;height:48px;color:var(--sea)}
.bar h1{font-size:32px;line-height:1}
h1 .on{color:var(--sea);font-style:italic}
.tagline{margin-top:5px;letter-spacing:.14em;white-space:nowrap;font-size:10.5px}

.tools{display:flex;align-items:center;gap:8px;flex:none}
.themebtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.themebtn:hover{border-color:var(--faint)}
.themebtn svg{width:18px;height:18px}
.themebtn .i-sun{display:none}
:root[data-theme="dark"] .themebtn .i-sun{display:block}:root[data-theme="dark"] .themebtn .i-moon{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .themebtn .i-sun{display:block} :root:not([data-theme="light"]) .themebtn .i-moon{display:none} }
@media (max-width:420px){ .wm svg{height:29px} .tagline{letter-spacing:.1em;font-size:9.5px;white-space:normal;max-width:16.5em;line-height:1.35} .lang button{padding:4px 8px;min-height:30px} .tools{gap:6px} .themebtn{width:34px;height:34px} }
/* segment düğmeleri */
.seg{display:inline-flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--raised)}
.seg button{border:0;background:none;padding:6px 14px;min-height:34px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button{padding:4px 11px;font-size:13px;min-height:30px;letter-spacing:.04em}

/* çekim kartı */
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px;border-radius:20px;background:var(--raised);box-shadow:var(--shadow);border:1px solid var(--line)}
.guide{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:4px 2px 8px}
.guide svg{flex:none;width:64px;height:84px;color:var(--sea)}
.guide .sub{font-size:14.5px}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--sea);color:var(--on-sea);font-weight:600;padding:12px 18px;cursor:pointer;overflow:hidden;border:0;transition:transform .12s ease,filter .12s ease}
.pick:hover{filter:brightness(1.08)}
.pick:active{transform:scale(.985)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pick:focus-within{outline:2px solid var(--sea);outline-offset:3px}
.pick.alt{background:var(--sea-soft);color:var(--sea)}
.pick.big{min-height:54px;font-size:16px;width:100%}
.pick svg{width:20px;height:20px;flex:none}
.scanbtn{grid-column:1/-1;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:700px){ .capture{grid-template-columns:repeat(3,1fr);padding:22px 24px} .scanbtn{grid-column:auto} }

/* hakkında */
.about{gap:14px}
.about{gap:18px}
.about p{color:var(--muted);font-size:15px;max-width:66ch}
.about .lead1{color:var(--ink);font-size:18px;line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:52ch}
.ab{display:flex;flex-direction:column;gap:10px}
.ab h3.lab{margin:0}
ol.steps.sm{gap:10px}
ol.steps.sm li{grid-template-columns:24px 1fr;gap:12px;font-size:15px;color:var(--ink);padding-top:0}
ol.steps.sm li::before{width:24px;height:24px;line-height:24px;font-size:12.5px;background:var(--sea-soft);color:var(--sea)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;line-height:1.5;padding-top:2px}
ol.steps li::before{content:counter(s);font-weight:600;font-size:15px;line-height:28px;width:28px;height:28px;border-radius:50%;text-align:center;background:var(--sea);color:var(--on-sea)}
/* kaynaklar, künye */
.usenotes{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.usenotes p{font-size:15px;max-width:66ch}
.usenotes p:first-child{font-weight:600}
.rights{margin-top:14px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.refs li{padding-left:2em;text-indent:-2em;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.credits p,.use p{max-width:66ch}
.cite-tool{font-size:14.5px;overflow-wrap:anywhere;padding:12px 16px 12px calc(16px + 1.4em);text-indent:-1.4em;background:var(--raised);border:1px solid var(--line);border-radius:12px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:20px}
footer a{color:var(--muted)}

/* Heritage Rejoiner: masa, kaplar, adaylar */
:root{--g1:#2F6DB3;--g2:#C9620C;--g3:#2E8554;--g4:#8A4BC4;--g5:#B23A48;--g6:#6B7A1E;--g7:#0E7C86;--g8:#A0527A;--hit:#E0A030}
.capture .demo{grid-column:1/-1}
@media (min-width:700px){ .capture .demo{grid-column:auto} }
.work{display:flex;flex-direction:column;gap:12px}
.status{font-size:15px;color:var(--ink);min-height:1.5em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--sea);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.th{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.th canvas{max-width:100%;height:56px;width:auto;border-radius:6px}
.th figcaption{font-size:12px;font-weight:600;color:var(--muted)}
#results{display:flex;flex-direction:column;gap:44px}
#results:empty{display:none}
.tzoom{overflow:auto;border-radius:16px;border:1px solid var(--line);cursor:zoom-in;-webkit-overflow-scrolling:touch}
.tzoom.big{cursor:zoom-out}
.tablecv{width:100%;height:auto;display:block}
.tzoom.big .tablecv{width:260%;max-width:none}
.jn{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plates{display:grid;grid-template-columns:1fr;gap:16px}
.plates.part{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.plate{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--raised);box-shadow:var(--shadow);display:flex;flex-direction:column}
.plate canvas{width:100%;height:auto;display:block;background:var(--soft)}
.pmeta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--gc)}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.pdot{width:24px;height:24px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-size:12.5px}
.pct{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gc);color:#fff;font-variant-numeric:tabular-nums}
.pct.part{background:var(--soft);color:var(--muted)}
.porder{font-size:13.5px;color:var(--muted);line-height:1.6}
.mini{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{align-self:flex-start}
.second .plate{box-shadow:none}
.loose{display:flex;flex-wrap:wrap;gap:10px}
.loose canvas{border-radius:6px}
details.all{border:1px solid var(--line);border-radius:14px;padding:0 16px;background:var(--raised)}
details.all summary{padding:14px 0;font-weight:600;font-size:15px;cursor:pointer}
details.all[open]{padding-bottom:16px}
details.all .sub{margin-bottom:12px}
.joins{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.join{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.join canvas{display:block;align-self:center;background:repeating-conic-gradient(var(--soft) 0 25%,var(--bg) 0 50%) 0 0/16px 16px}
.jmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--gc)}
.jt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.lvl.strong{background:var(--sea);color:var(--on-sea)}.lvl.medium{background:var(--sea-soft);color:var(--sea)}.lvl.weak{background:var(--soft);color:var(--muted)}
.jacts{display:flex;gap:8px}
.family{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:16px;background:var(--sea-soft);color:var(--sea);text-decoration:none;font-weight:600}
.family span{font-weight:400;color:var(--muted);font-size:14px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* adımlar ve önizleme rehberi */
h2 .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sea);color:var(--on-sea);font-size:15px;margin-right:10px;vertical-align:3px;letter-spacing:0}
[id^="st-"],.capture,.plate{scroll-margin-top:16px}
.nextstep{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--sea);cursor:pointer;margin-top:4px}
.nextstep:hover{border-color:var(--sea)}
.coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(688px,calc(100% - 24px));z-index:40;background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.45);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.coach p{font-size:15.5px;line-height:1.5}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cx{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;cursor:pointer}
.cbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cbtns .pick{min-height:46px;padding:10px 14px}
.cbtns .pick:disabled{opacity:.45;cursor:default;filter:none}
.hl{outline:3px solid var(--sea);outline-offset:6px;border-radius:18px}
.capture.hl{outline-offset:4px}
body.touring{padding-bottom:240px}

</style>
<style>
/* Herkes için Sualtı Mirası, 1. bölüm (Teredo navalis): tek bir geminin hikâyesi; sahne kaydırdıkça değişir */
:root{ --wood:#C9A27A; --wood-d:#A9825A; --grain:#B58E63; --cavity:#4A3120; --tube:#F4EFE3; --tube-l:#CFC6B2; --flesh:#E6B4A0; --sand:#E3D5B8; --sand-d:#CDBB97; --water-a:#D6E8EF; --water-b:#B9D3DF; --sky:#F1F5F4; --pot:#B8683E; --pot2:#8C8472; --sail:#F7F3EA; --cu:#C7773F; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#0E2028; --sky:#141C1E; --pot:#C97A50; --pot2:#A39A86; --sail:#CFC9BC; --cu:#D38A52; } }
:root[data-theme="dark"]{ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#0E2028; --sky:#141C1E; --pot:#C97A50; --pot2:#A39A86; --sail:#CFC9BC; --cu:#D38A52; }
.hero h2{font-size:clamp(28px,7vw,38px);line-height:1.1}
.hero h2 i,.step i,.txt i,.wc i{font-style:italic}
.lead1{font-size:18px;line-height:1.5;max-width:60ch}
.story{gap:0}
.stick{position:sticky;top:8px;z-index:5;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--bg);box-shadow:0 10px 26px -18px rgba(0,0,0,.45)}
.stick svg{display:block;width:100%;height:auto}
.dots{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--ink);opacity:.18;transition:opacity .25s,transform .25s}
.dots i.on{opacity:.75;transform:scale(1.25)}
.steps2{display:flex;flex-direction:column}
.step{min-height:78vh;display:flex;align-items:flex-start}
.step:first-child{min-height:60vh}
.step:last-child{min-height:70vh}
.step p{position:sticky;top:calc(var(--stb,300px) + 22px);font-size:clamp(19px,4.9vw,22px);line-height:1.42;max-width:30em;opacity:0;transition:opacity .3s;padding-bottom:22px}
.step.on p{opacity:1}
.step.near p{opacity:.22}
.step sup,.txt sup,.wc sup,.sub sup,.limits sup,section>p sup{font-size:.62em;line-height:0;color:var(--sea);font-weight:600;margin-left:1px}
sup a{color:inherit;text-decoration:none}
.where{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){ .where{grid-template-columns:1fr} }
.wc{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--raised);display:flex;flex-direction:column;gap:6px}

.wc.yes .tag{background:var(--clay-soft);color:var(--clay)}

.limits{display:flex;flex-wrap:wrap;gap:8px}
.limits span{border-radius:12px;background:var(--soft);border:1px solid var(--line);padding:8px 12px;font-size:14.5px}

.txt{display:flex;flex-direction:column;gap:10px}
.txt p{max-width:66ch}
.kick{margin:2px 0 8px;font-size:19px;font-weight:600;color:var(--sea)}
.chap{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.chap a{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--raised)}

.hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:999px;padding:9px 13px 9px 16px;font:600 14.5px var(--sans);cursor:pointer;box-shadow:0 8px 22px -14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.hint.show{opacity:1;pointer-events:auto}
.scrim{position:fixed;left:0;right:0;bottom:0;height:104px;z-index:5;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 58%);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.hint.mini{padding:9px;opacity:0}
.hint.mini.show{opacity:.82}
.hint.mini span{display:none}
.hint svg{width:18px;height:18px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}

.callout{padding:18px 20px;border-radius:18px;background:var(--sea-soft)}

.notes{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.wig{animation:wig 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wig{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}

tr:{title:"Sualtı Mirasına Sahip Çıkmak: Ortak Bir Sorumluluk",
 h1:"Sualtı Mirasına Sahip Çıkmak: Ortak Bir Sorumluluk",
 lede:"1982’de bir sünger dalgıcı, dipte gördüğünü yerinde bıraktı ve haber verdi. O haberden, bilinen en eski batıklardan birinin hikâyesi çıktı.",
 S:[`1982 yazı. Mehmet Çakır bir sünger dalgıcıdır; o yaz da Kaş yakınlarında, Uluburun’un önünde süngere dalar.${n(1)}`,
  `Sünger dalgıçlarıyla o yıllarda arkeologlar sık sık konuşur; onlara, süngere dalarken eski bir batığın nasıl tanınacağını anlatırlar.${n(1)}`,
  `Çakır bir dalışında, dik bir yamacın üzerinde, ne olduğunu bilmediği şeyler görür: dört köşesi kulak gibi uzamış, yassı maden parçaları.${n(1)}`,
  `Yukarı çıkınca gördüğünü çizer: “kulaklı madenî bisküviler”. Çizimi kaptanına gösterir. Kaptan bu biçimi arkeologların anlattıklarından tanır ve Çakır’a, gördüğünü Bodrum’daki arkeologlara bildirmesini söyler.${n(1)}`,
  `Çakır bildirir. Bodrum Sualtı Arkeoloji Müzesi’nin müdürü Oğuz Alpözen, müzenin ve Sualtı Arkeoloji Enstitüsü’nün (INA) arkeologlarını yollar; batık o dik yamaçta, 44–51 metre derinde bulunur.${n(2)}`,
  `O derinlikte çalışmak kolay değildir. Yamaç dik ve kayalıktır; geminin yükü yamaçtan aşağıya, 61 metreye kadar saçılmıştır.${n(3)}`,
  `Bu yamaca on bir sezon boyunca inilir: kazı 1984’te açılır, 1994’te biter; arkeologlar 22.000’den fazla dalış yapar.${n(3)}`,
  `İş dalışla bitmez; dipten çıkanı yaşatmak da ayrı bir iştir. Denizden çıkan bir kap tuzla doludur: tatlı suda bekletilir, suyu on beş günde bir değiştirilir, tuzu her seferinde ölçülür; üstündeki sert kekamoz laboratuvarda temizlenir, kuruması bile denetlenir.${n(4)}`,
  `Bu emeğin karşılığı önce Çakır’ın çizdiği parçalarda görünür. Kulaklı parçalar bakır külçelerdir: 354 tane. Yanlarında kalay vardır; ikisi, tunç yapmak için gereken oranda, ona bir yüklenmiştir.${n(5)}`,
  `Bakırla kalayın çevresinden uzak kıyılar çıkar: cam külçeler, fil dişleri, altın takılar, reçine dolu amforalar ve Mısır kraliçesi Nefertiti’nin adını taşıyan altın bir skarabe.${n(5)}`,
  `Böylece tek bir yük, MÖ 14. yüzyılın sonunda Akdeniz kıyılarını birbirine bağlayan ticareti gösterir. Bunu gösterebilmesi, külçelerin yerinde kalmış ve haber verilmiş olmasındandır.${n(3)}`,
  `Bir dalgıcın duyarlılığı ve ardından gelen ortak çaba, uygarlık tarihinin pek çok sorusuna Türkiye’de cevap bulunmasını sağlamıştır. Bu cevaplar bugün Bodrum Sualtı Arkeoloji Müzesi’nden bütün dünyaya anlatılır.${n(3)}`,
  `Sualtındaki eser onu bulanın değildir; ama hikâyesi, onu bildirenin adıyla başlar. Uluburun’un hikâyesi de 1982 yazında süngere dalan bir dalgıcın adıyla başlar: Mehmet Çakır.`],
 L:{sk:"“kulaklı madenî bisküviler”",home:"ev",need:["tuzdan arındırma","suyun değiştirilmesi","kekamozun temizlenmesi","denetimli kurutma"],d1:"laboratuvarda",d2:"evde",mz:"Bodrum Sualtı Arkeoloji Müzesi",dives:"dalış",bz:"tunç",
   cg:["bakır","kalay","cam","fildişi","altın","skarabe"],alone:"evde: tek bir külçe",ctx:"yerinde: bir çağ",name:"Mehmet Çakır"},
 eH:"İyi niyet neden yetmez?",
 eP:`Dipten bir eser almak suçtur. Üstelik yerinden koparılan tek bir parça, ne olduğunu bile söyleyemeyen bir nesneden ibarettir. İyi niyetle alınsa bile evde korunamaz: tuzdan arındırma, kekamozun temizlenmesi ve denetimli kurutma yapılmayınca, havayla temas eden tabaka sertleşir, seramiğin yüzeyini parçalar, üzerindeki mührü ve yazıyı siler. Esere sahip çıkmanın yolu onu almak değil, yerini bildirmektir.${n(6)}`,
 iH:"Dalışta bir eser görürseniz",
 i1:"Dokunmayın, yerinden oynatmayın. Eserin yeri de eserin kendisi kadar bilgidir.",
 i2:"Yerini kaydedin ve fotoğraflayın.",
 i3:"En geç üç gün içinde en yakın müze müdürlüğüne, köy muhtarına ya da mülki idare amirine bildirin.",
 i4:"Yerini başkalarıyla paylaşmayın.",
 dH:"Kanun ne diyor?",
 dP:`2863 sayılı Kültür ve Tabiat Varlıklarını Koruma Kanunu’na göre bulunan kültür varlıkları devlet malıdır. Bulan kişi bunu en geç üç gün içinde bildirmekle yükümlüdür (md. 4); bildirene, eserin değeri üzerinden ikramiye ödenir (md. 64). Bildirim yükümlülüğüne aykırı davranana altı aydan üç yıla kadar, kültür varlığını yurt dışına çıkarana beş yıldan on iki yıla kadar hapis cezası verilir (md. 67, 68).${n(7)}`,
 gH:"Aynı seçimi karada kim yaptı?",
 gP:`Çakır’ın denizde yaptığını karada bir çiftçi ailesi yapmıştır. 1980’lerin ortasında Şanlıurfa’da Yıldız ailesi, tarlasını sürerken bulduğu heykeli müzeye götürür; yıllar sonra o heykelin izini süren arkeologlar aynı tarlada Göbeklitepe’yi kazmaya başlar. Tarlanın eski sahibi bugün oranın bekçisidir.${n(8)}`,
 cH:"Neden ortak sorumluluk?",
 cP:`Çünkü bu hikâyede tek bir kahraman yoktur. Dalgıç gördüğünü çizer, kaptan tanır, arkeolog yıllarca dalar, koruma uzmanı laboratuvarda çalışır, müze sergiler. Zincirin ilk halkası ise her zaman aynıdır: gören kişinin, gördüğünü yerinde bırakıp haber vermesi.`,
 N:["Bass (1986, s. 269).","Bass (1986, s. 270).","Rijksdienst voor het Cultureel Erfgoed (t.y.).","Öniz (2023, s. 9).","Bass (1986, s. 273–274); Institute of Nautical Archaeology (t.y.).","Öniz (2023, s. 9, 12); Kültür ve Tabiat Varlıklarını Koruma Kanunu (1983, md. 5, 74).","Kültür ve Tabiat Varlıklarını Koruma Kanunu (1983, md. 4, 64, 67, 68).","Habertürk (2018)."],

en:{title:"Standing Up for Underwater Heritage: A Shared Responsibility",
 h1:"Standing Up for Underwater Heritage: A Shared Responsibility",
 lede:"In 1982 a sponge diver left what he saw on the seabed where it lay, and reported it. Out of that report came the story of one of the oldest known shipwrecks.",
 S:[`The summer of 1982. Mehmet Çakır is a sponge diver; that summer too he dives for sponges off Uluburun, near Kaş.${n(1)}`,
  `In those years archaeologists often talk with the sponge divers; they explain to them how to recognise an ancient wreck while diving for sponges.${n(1)}`,
  `On one of his dives, on a steep slope, Çakır sees things he cannot name: flat pieces of metal whose four corners stretch out like ears.${n(1)}`,
  `Back on the surface he draws what he saw: “metal biscuits with ears”. He shows the drawing to his captain. The captain recognises the shape from what the archaeologists have explained, and tells Çakır to report it to the archaeologists in Bodrum.${n(1)}`,
  `Çakır reports it. Oğuz Alpözen, director of the Bodrum Museum of Underwater Archaeology, sends archaeologists from the museum and from the Institute of Nautical Archaeology (INA); the wreck is found on that steep slope, 44–51 metres deep.${n(2)}`,
  `Working at that depth is not easy. The slope is steep and rocky, and the ship’s cargo has spilled down it as far as 61 metres.${n(3)}`,
  `They go down that slope for eleven seasons: the excavation opens in 1984 and ends in 1994, and the archaeologists make more than 22,000 dives.${n(3)}`,
  `The work does not end with the dive; keeping alive what comes up from the seabed is a task of its own. A vessel taken from the sea is full of salt: it is kept in fresh water, the water is changed every fifteen days and the salt measured each time; the hard concretion on it is cleaned in a laboratory, and even its drying is controlled.${n(4)}`,
  `What this labour brings back shows first in the pieces Çakır drew. The eared pieces are copper ingots: 354 of them. Beside them lies tin; the two were loaded ten to one, the proportion needed to make bronze.${n(5)}`,
  `Around the copper and the tin, distant shores come to light: glass ingots, elephant tusks, gold jewellery, amphorae full of resin, and a gold scarab bearing the name of the Egyptian queen Nefertiti.${n(5)}`,
  `A single cargo thus shows the trade that linked the shores of the Mediterranean at the end of the 14th century BC. It can show this because the ingots stayed in their place and were reported.${n(3)}`,
  `One diver’s sense of responsibility, and the shared effort that followed, made it possible for many questions in the history of civilisation to be answered in Türkiye. Today those answers are told to the whole world from the Bodrum Museum of Underwater Archaeology.${n(3)}`,
  `An object under water does not belong to whoever finds it; but its story begins with the name of whoever reports it. The story of Uluburun, too, begins with the name of a diver who went down for sponges in the summer of 1982: Mehmet Çakır.`],
 L:{sk:"“metal biscuits with ears”",home:"home",need:["desalination","changing the water","removing the concretion","controlled drying"],d1:"in the laboratory",d2:"at home",mz:"Bodrum Museum of Underwater Archaeology",dives:"dives",bz:"bronze",
   cg:["copper","tin","glass","ivory","gold","scarab"],alone:"at home: a single ingot",ctx:"in place: an age",name:"Mehmet Çakır"},
 eH:"Why are good intentions not enough?",
 eP:`Taking an ancient object from the seabed is a crime. A single piece torn from its place is, besides, no more than a thing that cannot even say what it is. Even when taken with good intentions it cannot be looked after at home: without desalination, removal of the concretion and controlled drying, the layer that meets the air hardens, breaks up the surface of the ceramic and wipes out the stamp and the writing on it. The way to stand up for an object is not to take it but to report where it is.${n(6)}`,
 iH:"If you see an object while diving",
 i1:"Do not touch it or move it. Where the object lies is information, as much as the object itself.",
 i2:"Record the position and photograph it.",
 i3:"Report it within three days at the latest to the nearest museum directorate, the village headman or the local administrative authority.",
 i4:"Do not share the position with others.",
 dH:"What does the law say?",
 dP:`Under Law no. 2863 of Türkiye on the Conservation of Cultural and Natural Property, cultural property that is found belongs to the state. The finder must report it within three days at the latest (art. 4); whoever reports is paid a reward based on the value of the object (art. 64). Failing to report is punished with six months to three years in prison, and taking cultural property out of the country with five to twelve years (arts. 67, 68).${n(7)}`,
 gH:"Who made the same choice on land?",
 gP:`What Çakır did at sea, a farming family did on land. In the mid-1980s, in Şanlıurfa, the Yıldız family take to the museum a statue they found while ploughing their field; years later, archaeologists who trace that statue begin to excavate Göbeklitepe in the same field. The former owner of the field is its guard today.${n(8)}`,
 cH:"Why a shared responsibility?",
 cP:`Because this story has no single hero. The diver draws what he saw, the captain recognises it, the archaeologist dives for years, the conservator works in the laboratory, the museum puts it on display. But the first link of the chain is always the same: the person who sees something leaves it where it is and reports it.`,
 N:["Bass (1986, p. 269).","Bass (1986, p. 270).","Rijksdienst voor het Cultureel Erfgoed (n.d.).","Öniz (2023, p. 9).","Bass (1986, pp. 273–274); Institute of Nautical Archaeology (n.d.).","Öniz (2023, pp. 9, 12); Kültür ve Tabiat Varlıklarını Koruma Kanunu (1983, arts. 5, 74).","Kültür ve Tabiat Varlıklarını Koruma Kanunu (1983, arts. 4, 64, 67, 68).","Habertürk (2018)."],

es:{title:"Hacerse cargo del patrimonio subacuático: una responsabilidad compartida",
 h1:"Hacerse cargo del patrimonio subacuático: una responsabilidad compartida",
 lede:"En 1982 un pescador de esponjas dejó en su sitio lo que vio en el fondo y dio aviso. De ese aviso salió la historia de uno de los pecios más antiguos que se conocen.",
 S:[`Verano de 1982. Mehmet Çakır es pescador de esponjas; también ese verano baja a buscarlas frente a Uluburun, cerca de Kaş.${n(1)}`,
  `En esos años los arqueólogos hablan a menudo con los pescadores de esponjas; les explican cómo reconocer un pecio antiguo mientras bucean.${n(1)}`,
  `En una de sus inmersiones, sobre una pendiente pronunciada, Çakır ve cosas que no sabe nombrar: piezas planas de metal cuyas cuatro esquinas se alargan como orejas.${n(1)}`,
  `Al subir dibuja lo que ha visto: «galletas de metal con orejas». Enseña el dibujo a su capitán. El capitán reconoce la forma por lo que han explicado los arqueólogos, y le dice a Çakır que lo comunique a los arqueólogos de Bodrum.${n(1)}`,
  `Çakır lo comunica. Oğuz Alpözen, director del Museo de Arqueología Subacuática de Bodrum, envía a arqueólogos del museo y del Instituto de Arqueología Náutica (INA); el pecio aparece en esa pendiente pronunciada, a 44–51 metros de profundidad.${n(2)}`,
  `Trabajar a esa profundidad no es fácil. La pendiente es empinada y rocosa, y el cargamento del barco se ha esparcido por ella hasta los 61 metros.${n(3)}`,
  `Por esa pendiente se baja durante once campañas: la excavación se abre en 1984 y termina en 1994, y los arqueólogos hacen más de 22 000 inmersiones.${n(3)}`,
  `El trabajo no acaba con la inmersión; mantener con vida lo que sale del fondo es otra tarea. Una vasija sacada del mar está llena de sal: se mantiene en agua dulce, el agua se cambia cada quince días y la sal se mide cada vez; la concreción dura que la cubre se limpia en un laboratorio, y hasta su secado se controla.${n(4)}`,
  `Lo que este esfuerzo devuelve se ve primero en las piezas que dibujó Çakır. Las piezas con orejas son lingotes de cobre: 354. Junto a ellos hay estaño; los dos se cargaron en proporción de diez a uno, la necesaria para hacer bronce.${n(5)}`,
  `Alrededor del cobre y el estaño aparecen costas lejanas: lingotes de vidrio, colmillos de elefante, joyas de oro, ánforas llenas de resina y un escarabeo de oro con el nombre de la reina egipcia Nefertiti.${n(5)}`,
  `Así, un solo cargamento muestra el comercio que unía las costas del Mediterráneo a finales del siglo XIV a. C. Puede mostrarlo porque los lingotes se quedaron en su sitio y se dio aviso.${n(3)}`,
  `La sensibilidad de un buceador y el esfuerzo compartido que vino después hicieron posible que muchas preguntas de la historia de la civilización encontraran respuesta en Türkiye. Hoy esas respuestas se cuentan al mundo entero desde el Museo de Arqueología Subacuática de Bodrum.${n(3)}`,
  `Un objeto bajo el agua no pertenece a quien lo encuentra; pero su historia empieza con el nombre de quien lo comunica. La historia de Uluburun empieza también con el nombre de un buceador que bajó a por esponjas en el verano de 1982: Mehmet Çakır.`],
 L:{sk:"«galletas de metal con orejas»",home:"casa",need:["desalación","cambio del agua","retirada de la concreción","secado controlado"],d1:"en el laboratorio",d2:"en casa",mz:"Museo de Arqueología Subacuática de Bodrum",dives:"inmersiones",bz:"bronce",
   cg:["cobre","estaño","vidrio","marfil","oro","escarabeo"],alone:"en casa: un solo lingote",ctx:"en su sitio: una época",name:"Mehmet Çakır"},
 eH:"¿Por qué no basta la buena intención?",
 eP:`Llevarse un objeto antiguo del fondo es un delito. Además, una sola pieza arrancada de su sitio no es más que algo que ni siquiera puede decir qué es. Aunque se tome con buena intención, en casa no puede cuidarse: sin desalación, sin retirar la concreción y sin un secado controlado, la capa que entra en contacto con el aire se endurece, rompe la superficie de la cerámica y borra el sello y la escritura que lleva. La manera de hacerse cargo de un objeto no es llevárselo, sino comunicar dónde está.${n(6)}`,
 iH:"Si ve un objeto durante una inmersión",
 i1:"No lo toque ni lo mueva. El lugar donde está el objeto es información, tanto como el propio objeto.",
 i2:"Anote la posición y fotografíelo.",
 i3:"Comuníquelo en un plazo máximo de tres días a la dirección del museo más cercano, al alcalde pedáneo o a la autoridad administrativa local.",
 i4:"No comparta la posición con otras personas.",
 dH:"¿Qué dice la ley?",
 dP:`Según la Ley n.º 2863 de Türkiye, de Conservación de Bienes Culturales y Naturales, los bienes culturales hallados son propiedad del Estado. Quien los encuentra debe comunicarlo en un plazo máximo de tres días (art. 4); a quien lo comunica se le paga una recompensa calculada sobre el valor del objeto (art. 64). No comunicarlo se castiga con prisión de seis meses a tres años, y sacar un bien cultural del país con prisión de cinco a doce años (arts. 67, 68).${n(7)}`,
 gH:"¿Quién tomó la misma decisión en tierra?",
 gP:`Lo que Çakır hizo en el mar, lo hizo en tierra una familia de agricultores. A mediados de la década de 1980, en Şanlıurfa, la familia Yıldız lleva al museo una estatua que encontró al arar su campo; años después, los arqueólogos que siguen el rastro de esa estatua empiezan a excavar Göbeklitepe en el mismo campo. El antiguo dueño del campo es hoy su guarda.${n(8)}`,
 cH:"¿Por qué una responsabilidad compartida?",
 cP:`Porque esta historia no tiene un solo héroe. El buceador dibuja lo que vio, el capitán lo reconoce, el arqueólogo bucea durante años, el conservador trabaja en el laboratorio, el museo lo expone. Pero el primer eslabón de la cadena es siempre el mismo: quien ve algo lo deja donde está y lo comunica.`,
 N:["Bass (1986, p. 269).","Bass (1986, p. 270).","Rijksdienst voor het Cultureel Erfgoed (s. f.).","Öniz (2023, p. 9).","Bass (1986, pp. 273–274); Institute of Nautical Archaeology (s. f.).","Öniz (2023, pp. 9, 12); Kültür ve Tabiat Varlıklarını Koruma Kanunu (1983, arts. 5, 74).","Kültür ve Tabiat Varlıklarını Koruma Kanunu (1983, arts. 4, 64, 67, 68).","Habertürk (2018)."],
