<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RecOniz · Sualtı Mirasının Korunmaya Başlanması</title>
<meta name="description" content="Sualtı mirasının korunmaya başlanması: dünyada eski eserleri koruyan ilk kurallar, kazı izinleri ve suistimaller, sudaki eserler için ilk hükmü koyan 1884 nizamnamesi ve bugünkü ilkeler; canlandırmalarla.">
<meta name="theme-color" content="#17495A">
<link rel="canonical" href="https://reconiz.org/koruma/">
<meta name="apple-mobile-web-app-title" content="Koruma">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Heritage Rejoiner: RecOniz ana sayfasıyla aynı tokenlar ve düzen (tek sütun, 720px, kutusuz bölümler, aynı başlık ve fotoğraf kartı) */
/* Düzen: tek sütun, 720px okuma genişliği; çekim kartı en üstte, katalog bir "tip levhası" ızgarası.
   Kimlik: deniz mavisi (sea) + pişmiş toprak (clay); tek yazı ailesi: Instrument Sans (başlık 600, metin 400). */
:root{
  --bg:#F6F7F5; --ink:#152021; --muted:#5B6664; --faint:#8C9795; --line:#DCE2E0; --soft:#ECF0EE; --raised:#FFFFFF;
  --sea:#17495A; --sea-soft:#DCE8EB; --on-sea:#FFFFFF; --clay:#9C5B38; --clay-soft:#F1E3D6;
  --z-rim:#2F6DB3; --z-handle:#8A4BC4; --z-body:#2E8554; --z-base:#C9620C;
  --paper:#FFFFFF; --paper-ink:#111111; --well-a:#EDF2F3; --well-b:#DCE6E8; --chartfill:#E9C9A0;
  --bar:#CCD5D3; --map-sea:#CFE0E6; --map-land:#EFE8DC; --map-coast:#9A8F80; --map-ink:#3A2A20; --map-ink2:#1D3A4C; --map-pin:#A0461E; --map-pin-a:rgba(160,70,30,.45); --map-reg:#285A78; --map-reg-a:rgba(40,90,120,.18); --map-sel:#17495A; --map-sel-a:rgba(23,73,90,.75);
  --shadow:0 1px 2px rgba(21,32,33,.06),0 8px 24px -12px rgba(21,32,33,.18);
  --sans:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
    --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
    --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
    --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
    --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
  --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
  --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
  --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
  --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:12px 56px;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--sans);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(21px,4.6vw,25px);line-height:1.2}
p{margin:0}
a{color:var(--sea);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{color:var(--muted);font-size:15px;max-width:66ch}
.lab,.dlab,.citeLabel,.tagline,.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.center{text-align:center}

/* araçlar menüsü */
.bar{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:min(340px,100%);background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.35);padding:12px;display:flex;flex-direction:column;gap:6px}
.menu .lab{padding:4px 8px 6px}
.menu a,.menu .soon{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink);position:relative}
.menu a:hover{background:var(--soft)}
.menu a[aria-current="page"]{background:var(--sea-soft)}
.menu b{font-size:15.5px;font-weight:600;padding-right:72px}
.menu span{font-size:13.5px;color:var(--muted);line-height:1.4}
.menu i{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.menu .soon{opacity:.55}
@media (max-width:420px){ .tools .lang button{padding:4px 6px} .tools{gap:4px} .tools .themebtn{width:32px;height:32px} }
/* başlık */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
.wm{margin:0;line-height:0;color:var(--ink)}
.wm svg{display:block;height:34px;width:auto}
.mark{flex:none;width:34px;height:48px;color:var(--sea)}
.bar h1{font-size:32px;line-height:1}
h1 .on{color:var(--sea);font-style:italic}
.tagline{margin-top:5px;letter-spacing:.14em;white-space:nowrap;font-size:10.5px}

.tools{display:flex;align-items:center;gap:8px;flex:none}
.themebtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.themebtn:hover{border-color:var(--faint)}
.themebtn svg{width:18px;height:18px}
.themebtn .i-sun{display:none}
:root[data-theme="dark"] .themebtn .i-sun{display:block}:root[data-theme="dark"] .themebtn .i-moon{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .themebtn .i-sun{display:block} :root:not([data-theme="light"]) .themebtn .i-moon{display:none} }
@media (max-width:420px){ .wm svg{height:29px} .tagline{letter-spacing:.1em;font-size:9.5px;white-space:normal;max-width:16.5em;line-height:1.35} .lang button{padding:4px 8px;min-height:30px} .tools{gap:6px} .themebtn{width:34px;height:34px} }
/* segment düğmeleri */
.seg{display:inline-flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--raised)}
.seg button{border:0;background:none;padding:6px 14px;min-height:34px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button{padding:4px 11px;font-size:13px;min-height:30px;letter-spacing:.04em}

/* çekim kartı */
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px;border-radius:20px;background:var(--raised);box-shadow:var(--shadow);border:1px solid var(--line)}
.guide{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:4px 2px 8px}
.guide svg{flex:none;width:64px;height:84px;color:var(--sea)}
.guide .sub{font-size:14.5px}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--sea);color:var(--on-sea);font-weight:600;padding:12px 18px;cursor:pointer;overflow:hidden;border:0;transition:transform .12s ease,filter .12s ease}
.pick:hover{filter:brightness(1.08)}
.pick:active{transform:scale(.985)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pick:focus-within{outline:2px solid var(--sea);outline-offset:3px}
.pick.alt{background:var(--sea-soft);color:var(--sea)}
.pick.big{min-height:54px;font-size:16px;width:100%}
.pick svg{width:20px;height:20px;flex:none}
.scanbtn{grid-column:1/-1;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:700px){ .capture{grid-template-columns:repeat(3,1fr);padding:22px 24px} .scanbtn{grid-column:auto} }

/* hakkında */
.about{gap:14px}
.about{gap:18px}
.about p{color:var(--muted);font-size:15px;max-width:66ch}
.about .lead1{color:var(--ink);font-size:18px;line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:52ch}
.ab{display:flex;flex-direction:column;gap:10px}
.ab h3.lab{margin:0}
ol.steps.sm{gap:10px}
ol.steps.sm li{grid-template-columns:24px 1fr;gap:12px;font-size:15px;color:var(--ink);padding-top:0}
ol.steps.sm li::before{width:24px;height:24px;line-height:24px;font-size:12.5px;background:var(--sea-soft);color:var(--sea)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;line-height:1.5;padding-top:2px}
ol.steps li::before{content:counter(s);font-weight:600;font-size:15px;line-height:28px;width:28px;height:28px;border-radius:50%;text-align:center;background:var(--sea);color:var(--on-sea)}
/* kaynaklar, künye */
.usenotes{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.usenotes p{font-size:15px;max-width:66ch}
.usenotes p:first-child{font-weight:600}
.rights{margin-top:14px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.refs li{padding-left:2em;text-indent:-2em;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.credits p,.use p{max-width:66ch}
.cite-tool{font-size:14.5px;overflow-wrap:anywhere;padding:12px 16px 12px calc(16px + 1.4em);text-indent:-1.4em;background:var(--raised);border:1px solid var(--line);border-radius:12px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:20px}
footer a{color:var(--muted)}

/* Heritage Rejoiner: masa, kaplar, adaylar */
:root{--g1:#2F6DB3;--g2:#C9620C;--g3:#2E8554;--g4:#8A4BC4;--g5:#B23A48;--g6:#6B7A1E;--g7:#0E7C86;--g8:#A0527A;--hit:#E0A030}
.capture .demo{grid-column:1/-1}
@media (min-width:700px){ .capture .demo{grid-column:auto} }
.work{display:flex;flex-direction:column;gap:12px}
.status{font-size:15px;color:var(--ink);min-height:1.5em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--sea);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.th{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.th canvas{max-width:100%;height:56px;width:auto;border-radius:6px}
.th figcaption{font-size:12px;font-weight:600;color:var(--muted)}
#results{display:flex;flex-direction:column;gap:44px}
#results:empty{display:none}
.tzoom{overflow:auto;border-radius:16px;border:1px solid var(--line);cursor:zoom-in;-webkit-overflow-scrolling:touch}
.tzoom.big{cursor:zoom-out}
.tablecv{width:100%;height:auto;display:block}
.tzoom.big .tablecv{width:260%;max-width:none}
.jn{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plates{display:grid;grid-template-columns:1fr;gap:16px}
.plates.part{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.plate{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--raised);box-shadow:var(--shadow);display:flex;flex-direction:column}
.plate canvas{width:100%;height:auto;display:block;background:var(--soft)}
.pmeta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--gc)}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.pdot{width:24px;height:24px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-size:12.5px}
.pct{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gc);color:#fff;font-variant-numeric:tabular-nums}
.pct.part{background:var(--soft);color:var(--muted)}
.porder{font-size:13.5px;color:var(--muted);line-height:1.6}
.mini{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{align-self:flex-start}
.second .plate{box-shadow:none}
.loose{display:flex;flex-wrap:wrap;gap:10px}
.loose canvas{border-radius:6px}
details.all{border:1px solid var(--line);border-radius:14px;padding:0 16px;background:var(--raised)}
details.all summary{padding:14px 0;font-weight:600;font-size:15px;cursor:pointer}
details.all[open]{padding-bottom:16px}
details.all .sub{margin-bottom:12px}
.joins{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.join{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.join canvas{display:block;align-self:center;background:repeating-conic-gradient(var(--soft) 0 25%,var(--bg) 0 50%) 0 0/16px 16px}
.jmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--gc)}
.jt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.lvl.strong{background:var(--sea);color:var(--on-sea)}.lvl.medium{background:var(--sea-soft);color:var(--sea)}.lvl.weak{background:var(--soft);color:var(--muted)}
.jacts{display:flex;gap:8px}
.family{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:16px;background:var(--sea-soft);color:var(--sea);text-decoration:none;font-weight:600}
.family span{font-weight:400;color:var(--muted);font-size:14px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* adımlar ve önizleme rehberi */
h2 .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sea);color:var(--on-sea);font-size:15px;margin-right:10px;vertical-align:3px;letter-spacing:0}
[id^="st-"],.capture,.plate{scroll-margin-top:16px}
.nextstep{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--sea);cursor:pointer;margin-top:4px}
.nextstep:hover{border-color:var(--sea)}
.coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(688px,calc(100% - 24px));z-index:40;background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.45);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.coach p{font-size:15.5px;line-height:1.5}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cx{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;cursor:pointer}
.cbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cbtns .pick{min-height:46px;padding:10px 14px}
.cbtns .pick:disabled{opacity:.45;cursor:default;filter:none}
.hl{outline:3px solid var(--sea);outline-offset:6px;border-radius:18px}
.capture.hl{outline-offset:4px}
body.touring{padding-bottom:240px}

</style>
<style>
/* Herkes için Sualtı Mirası, 1. bölüm (Teredo navalis): tek bir geminin hikâyesi; sahne kaydırdıkça değişir */
:root{ --wood:#C9A27A; --wood-d:#A9825A; --grain:#B58E63; --cavity:#4A3120; --tube:#F4EFE3; --tube-l:#CFC6B2; --flesh:#E6B4A0; --sand:#E3D5B8; --sand-d:#CDBB97; --water-a:#D6E8EF; --water-b:#B9D3DF; --sky:#F1F5F4; --pot:#B8683E; --pot2:#8C8472; --sail:#F7F3EA; --cu:#C7773F; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#0E2028; --sky:#141C1E; --pot:#C97A50; --pot2:#A39A86; --sail:#CFC9BC; --cu:#D38A52; } }
:root[data-theme="dark"]{ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#0E2028; --sky:#141C1E; --pot:#C97A50; --pot2:#A39A86; --sail:#CFC9BC; --cu:#D38A52; }
.hero h2{font-size:clamp(28px,7vw,38px);line-height:1.1}
.hero h2 i,.step i,.txt i,.wc i{font-style:italic}
.lead1{font-size:18px;line-height:1.5;max-width:60ch}
.story{gap:0}
.stick{position:sticky;top:8px;z-index:5;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--bg);box-shadow:0 10px 26px -18px rgba(0,0,0,.45)}
.stick svg{display:block;width:100%;height:auto}
.dots{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--ink);opacity:.18;transition:opacity .25s,transform .25s}
.dots i.on{opacity:.75;transform:scale(1.25)}
.steps2{display:flex;flex-direction:column}
.step{min-height:78vh;display:flex;align-items:flex-start}
.step:first-child{min-height:60vh}
.step:last-child{min-height:70vh}
.step p{position:sticky;top:calc(var(--stb,300px) + 22px);font-size:clamp(19px,4.9vw,22px);line-height:1.42;max-width:30em;opacity:0;transition:opacity .3s;padding-bottom:22px}
.step.on p{opacity:1}
.step.near p{opacity:.22}
.step sup,.txt sup,.wc sup,.sub sup,.limits sup,section>p sup{font-size:.62em;line-height:0;color:var(--sea);font-weight:600;margin-left:1px}
sup a{color:inherit;text-decoration:none}
.where{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){ .where{grid-template-columns:1fr} }
.wc{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--raised);display:flex;flex-direction:column;gap:6px}
.wc h3{font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wc p{font-size:14.5px;color:var(--muted)}
.wc .tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 9px;white-space:nowrap}
.wc.yes .tag{background:var(--clay-soft);color:var(--clay)}
.wc.no .tag{background:var(--sea-soft);color:var(--sea)}
.limits{display:flex;flex-wrap:wrap;gap:8px}
.limits span{border-radius:12px;background:var(--soft);border:1px solid var(--line);padding:8px 12px;font-size:14.5px}
.limits b{font-weight:600}
.txt{display:flex;flex-direction:column;gap:10px}
.txt p{max-width:66ch}
.kick{margin:2px 0 8px;font-size:19px;font-weight:600;color:var(--sea)}
.chap{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.chap a{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--raised)}
.chap a[aria-current]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:999px;padding:9px 13px 9px 16px;font:600 14.5px var(--sans);cursor:pointer;box-shadow:0 8px 22px -14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.hint.show{opacity:1;pointer-events:auto}
.scrim{position:fixed;left:0;right:0;bottom:0;height:104px;z-index:5;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 58%);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.hint.mini{padding:9px;opacity:0}
.hint.mini.show{opacity:.82}
.hint.mini span{display:none}
.hint svg{width:18px;height:18px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){ .hint svg{animation:none} }
.callout{padding:18px 20px;border-radius:18px;background:var(--sea-soft)}
.callout h2{color:var(--sea)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.notes{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.wig{animation:wig 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wig{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@media (prefers-reduced-motion: reduce){ .wig{animation:none} .step p{transition:none} }

 tr:{navH:"Araçlar",navAmp:"Amphora tanıma",navAmpSub:"Underwater Heritage Recognizer · tek fotoğraftan amphora tipi",navRej:"Kırık seramik birleştirme",navRejSub:"Heritage Rejoiner · masadaki parçalardan kapları birleştirir",navCoin:"Sikke tanıma",navCoinSub:"Heritage Coin Recognizer · tek yüzden Roma imparatoru",navTer:"Herkes için Sualtı Mirası",navTerSub:"Heritage Explainer · batıktan geriye ne kalır",navKor:"Sualtı mirasının korunmaya başlanması",navKorSub:"Heritage Explainer · 1846’dan bugüne, Osman Hamdi Bey ve 1884 nizamnamesi",navHere:"Bu sayfa",navMenu:"Menü"},

tr:{title:"Sualtı Mirasının Korunmaya Başlanması",
 h1:"Sualtı Mirasının Korunmaya Başlanması",
 lede:"Denizden çıkan eski eser kimindir? Dünya bu soruyu çok geç sordu. Hikâye karada, yapıları ve mezarları koruyan ilk kurallarla başlar; denize ise ancak 1884’te, Osman Hamdi Bey’in yazdığı bir maddeyle ulaşır.",
 S:[`Eski eserleri koruma düşüncesi yeni değildir. Daha 458’de Roma İmparatoru Maiorianus, ayakta kalmış güzel ve yararlı yapıların yıkılmasını yasaklar.${n(1)}`,
  `Aynı kentte yasaklar yüzyıllar boyunca yinelenir. 1462’de Papa II. Pius antik yapılara izinsiz dokunulmasını, 1624’te bir kardinal fermanı izinsiz kazıyı yasaklar; bulunan her şey yirmi dört saat içinde bildirilecektir.${n(1)}`,
  `Koruma Roma’yla sınırlı kalmaz. İsveç’te 1666’da kral adına çıkarılan bir buyruk kaleleri, höyükleri, runik yazıtlı taşları ve mezarları korumaya alır.${n(2)}`,
  `On sekiz yıl sonra aynı ülkede bir kural suyun adını da anar: toprakta ya da göl ve deniz dibinde bulunan altın, gümüş ve bakır sikkeler ile madenî kaplar bildirilecek, üçte ikisi krala kalacaktır. Ama bu bir define kuralıdır; amacı eseri korumak değil, hazineyi paylaştırmaktır.${n(3)}`,
  `19. yüzyılda eski eserlere duyulan ilgi kazıya dönüşür. Kazmak isteyen, toprağın sahibi olan devletten izin alır; çıkanın nasıl paylaşılacağı da izinde yazar.${n(4)}`,
  `İzin, eseri her zaman yerinde tutmaz. İngiliz elçisi Lord Elgin, Osmanlı makamlarından aldığı izinle 1801–1805 arasında Atina’da Parthenon’dan kalan heykellerin yaklaşık yarısını söker; heykeller bugün Londra’dadır.${n(5)}`,
  `Kimi zaman izin açıkça çiğnenir. Heinrich Schliemann, 1871’de Troya için aldığı izne göre bulduklarının yarısını müzeye bırakacaktır; 1873’te bulduğu altın ve gümüş hazineyi ise gizlice ülke dışına çıkarır. Açılan dava uzar ve devlet sonunda 50.000 frankla yetinir.${n(6)}`,
  `Ülkeler bu gidişe kanunla karşılık verir. Yunanistan 1834’te kazılardan çıkan eski eserleri devlet malı sayar, Mısır 1835’te izinsiz çıkarmayı yasaklar; Osmanlı’da 1869’da yedi, 1874’te otuz altı maddelik iki nizamname çıkar.${n(7)}`,
  `Ne var ki Osmanlı’nın iki nizamnamesi de yalnızca karayı düşünür; sualtından söz etmez. Oysa eser yalnızca karadan çıkmaz: geçimini denizin dibinden kazananlar oradaki eserlere de ulaşır, bulduklarını çıkarır ve satarlar.${n(8)}`,
  `Bu eksiği görecek kişi 1881’de Müze-i Hümayun’un başına geçer: kendisi de kazı yapan bir arkeolog olan Osman Hamdi Bey.${n(9)}`,
  `Osman Hamdi Bey üç yıl sonra, 1884’te, otuz yedi maddelik yeni bir nizamname hazırlar. Üçüncü maddesi eksiği kapatır: denizden, gölden, nehirden, çaydan ve dereden çıkarılacak her çeşit eski eser devlete aittir.${n(10)}`,
  `Bu madde, bir devletin sualtı kültür mirasını korumak için koyduğu, dünyada bilinen en eski kuraldır. Öteki ülkelerde benzeri için uzun yıllar beklemek gerekir; sırada ilk gelen Danimarka’da yıl 1963’tür.${n(11)}`,
  `Kural kâğıt üzerinde de kalmaz. 1891’de Formako Adası’nda resimli altınlar ortaya çıkınca Bahriye Nezareti’ne yazı yazılır: bir dalgıç tutulup adaya gönderilecek, buluntular yerinde incelenecektir.${n(12)}`,
  `Ertesi yıl altınların izi sürülür. Otuz dördü bir çobanda, yetmiş dokuzu birkaç kişide bulunur; Nüzhet vapurunun süvarisi de işin içindedir. Toplanan sikkeler Rodos’ta hükümete teslim edilir.${n(12)}`,
  `Böylece Osman Hamdi Bey, devlet eliyle bir sualtı çalışması yürütmüş olur. Sünger dalgıçlarının Antikythera’da ilk antik batığı bulmasına daha dokuz yıl, dalgıcı yüzeyden bağımsız kılan donanımın bulunmasına ise yarım yüzyıl vardır.${n(13)}`,
  `O donanım 1940’larda gelir ve dibe inmeyi kolaylaştırır; batıklar zarar görmeye başlar. Ülkeler sualtı kültür mirası için özel kanunlarını ancak 1960’larda ve 1970’lerde çıkarır.${n(14)}`,
  `Bugün ilke açıktır. ICOMOS’un 1996 tarihli tüzüğü sualtı kültür mirasının nasıl korunacağını ve yönetileceğini belirler; ilk seçenek, mirası yerinde korumaktır.${n(15)}`],
 L:{h24:"bulunan, 24 saatte bildirilir",crownS:"⅔ krala",finderS:"⅓ bulana",permit:"KAZI İZNİ",lon:"Londra’ya",share:"müzenin payı: ½",fr:"50.000 frank",gr:"Yunanistan",eg:"Mısır",ot:"Osmanlı",
   noSea:"sualtı yok",land:"kara",sea:"deniz",mus:"Müze-i Hümayun",art:"3. madde",w:["deniz","göl","nehir","çay","dere"],isl:"Formako Adası",bah:"Bahriye Nezareti’ne",nuz:"Nüzhet vapuru",c34:"34",c79:"79",rod:"Rodos’a",
   ax:["Formako","Antikythera","aletli dalış"],y40:"1940’lar",laws:"1960’lar–1970’ler: ilk sualtı kanunları",insitu:"yerinde koruma",
   tl:["Osmanlı Devleti","Danimarka","Almanya","Avustralya","Hollanda","Mısır","ABD","Polonya","Lübnan","İtalya"]},
 aH:"İki belge",
 aP:`Formako Adası’ndaki çalışmayı iki belgeden biliyoruz. İkisi de Osmanlı Arşivi’ndedir: ilki 8 Ağustos 1891, ikincisi 23 Mayıs 1892 tarihlidir. Anlattıkları çalışma, devlet eliyle yürütülen sualtı çalışmalarının dünyadaki en erken örneklerinden biridir.${n(12)}`,
 bH:"Öteki ülkeler ne zaman?",
 bP:`1884’ün ne kadar erken olduğunu görmek için öteki ülkelere bakmak yeter. Sualtı kültür mirasını koruyan kurallar Danimarka’da 1963’te, Almanya’da 1970’te, Avustralya’da 1976’da, Hollanda’da 1985’te, Mısır’da 1986’da, ABD’de 1988’de, Polonya’da 1996’da, Lübnan’da 2006’da, İtalya’da 2009’da gelir. Osmanlı kuralı bunların en eskisinden 79 yıl öncedir.${n(11)}`,
 dH:"Türkiye’de bugün",
 dP:`Osmanlı nizamnamesi 1906’da yenilenir ve 1973’e kadar yürürlükte kalır; yerini önce 1710 sayılı Eski Eserler Kanunu, 1983’te de 2863 sayılı Kanun alır. Bugünkü kanuna göre korunması gereken kültür varlıklarının bulunduğu sualtı bölgeleri belirlenir ve ilan edilir; bu bölgelerde sportif amaçlı dalış yapılamaz. Bir kültür varlığı bulan kişi de bunu en geç üç gün içinde en yakın müze müdürlüğüne, köy muhtarına ya da mülki idare amirine bildirmekle yükümlüdür.${n(16)}`,
 cH:"Neden önemli?",
 cP:`Çünkü 1884’teki madde bugün de geçerli olan düşünceyi söyler: sualtındaki eski eser onu bulanın malı değildir; kamuya aittir. Bu mirası korumanın yolu çoğu zaman ona dokunmamak ve yerini bildirmektir.${n(15)}`,

en:{title:"The Beginnings of Underwater Heritage Protection",
 h1:"The Beginnings of Underwater Heritage Protection",
 lede:"To whom does an antiquity taken from the sea belong? The world asked this question very late. The story begins on land, with the first rules protecting buildings and graves; it reaches the sea only in 1884, with an article written by Osman Hamdi Bey.",
 S:[`The idea of protecting antiquities is not new. As early as 458 the Roman emperor Majorian forbids the destruction of buildings of beauty or use that are still standing.${n(1)}`,
  `In the same city the prohibitions are repeated over the centuries. In 1462 Pope Pius II forbids unauthorised interference with ancient buildings, and in 1624 a cardinal’s edict forbids unauthorised excavation; whatever is found must be reported within twenty-four hours.${n(1)}`,
  `Protection does not stay confined to Rome. In Sweden in 1666 a proclamation issued in the king’s name places castles, mounds, rune stones and graves under protection.${n(2)}`,
  `Eighteen years later, in the same country, a rule mentions water as well: gold, silver and copper coins and metal vessels found in the earth or on the bed of a lake or the sea must be reported, and two thirds go to the king. But this is a treasure rule; its aim is not to protect the object but to share out the treasure.${n(3)}`,
  `In the 19th century the interest in antiquities turns into excavation. Whoever wants to dig obtains a permit from the state that owns the land; how the finds will be shared is written in the permit too.${n(4)}`,
  `A permit does not always keep the object in its place. Lord Elgin, the British ambassador, acting under a permit from the Ottoman authorities, removes about half of the remaining sculptures of the Parthenon in Athens between 1801 and 1805; the sculptures are in London today.${n(5)}`,
  `Sometimes the permit is openly broken. Under the permit Heinrich Schliemann obtains for Troy in 1871, he is to leave half of what he finds to the museum; the treasure of gold and silver he finds in 1873 he smuggles out of the country. The lawsuit drags on, and in the end the state settles for 50,000 francs.${n(6)}`,
  `Countries answer with law. Greece declares antiquities from excavations state property in 1834, Egypt bans unauthorised removal in 1835; in the Ottoman Empire two regulations follow, of seven articles in 1869 and of thirty-six in 1874.${n(7)}`,
  `Yet both Ottoman regulations think only of the land; neither mentions what lies under water. And antiquities do not come only from the land: those who earn their living from the bottom of the sea reach the antiquities there too, bring up what they find and sell it.${n(8)}`,
  `The man who will see this gap becomes director of the Imperial Museum (Müze-i Hümayun) in 1881: Osman Hamdi Bey, himself an excavating archaeologist.${n(9)}`,
  `Three years later, in 1884, Osman Hamdi Bey prepares a new regulation of thirty-seven articles. Its third article closes the gap: every kind of antiquity brought out of the sea, lakes, rivers, streams and brooks belongs to the state.${n(10)}`,
  `This article is the oldest known rule in the world set by a state to protect underwater cultural heritage. Other countries wait many years for its like; in Denmark, the next in line, the year is 1963.${n(11)}`,
  `Nor does the rule stay on paper. When gold pieces bearing images come to light on Formako Island in 1891, a letter goes to the Ministry of the Navy: a diver is to be hired and sent to the island, and the finds are to be examined on the spot.${n(12)}`,
  `The following year the gold is traced. Thirty-four pieces are found with a shepherd and seventy-nine with several other people; the commander of the steamer Nüzhet is involved too. The coins collected are handed over to the government in Rhodes.${n(12)}`,
  `In this way Osman Hamdi Bey carries out underwater work on behalf of the state. It will be nine more years before sponge divers find the first ancient wreck at Antikythera, and half a century before the invention of the equipment that makes the diver independent of the surface.${n(13)}`,
  `That equipment arrives in the 1940s and makes it easy to go down; wrecks begin to suffer. Countries pass their own laws for underwater cultural heritage only in the 1960s and 1970s.${n(14)}`,
  `Today the principle is clear. The ICOMOS Charter of 1996 sets out how underwater cultural heritage is to be protected and managed; the first option is to preserve it in place.${n(15)}`],
 L:{h24:"finds reported within 24 hours",crownS:"⅔ to the king",finderS:"⅓ to the finder",permit:"EXCAVATION PERMIT",lon:"to London",share:"the museum’s share: ½",fr:"50,000 francs",gr:"Greece",eg:"Egypt",ot:"Ottoman",
   noSea:"nothing under water",land:"land",sea:"sea",mus:"Müze-i Hümayun",art:"Article 3",w:["sea","lake","river","stream","brook"],isl:"Formako Island",bah:"to the Ministry of the Navy",nuz:"steamer Nüzhet",c34:"34",c79:"79",rod:"to Rhodes",
   ax:["Formako","Antikythera","aqualung"],y40:"1940s",laws:"1960s–1970s: first underwater laws",insitu:"preservation in place",
   tl:["Ottoman Empire","Denmark","Germany","Australia","Netherlands","Egypt","USA","Poland","Lebanon","Italy"]},
 aH:"Two documents",
 aP:`We know the work on Formako Island from two documents. Both are in the Ottoman Archives: the first is dated 8 August 1891, the second 23 May 1892. The work they record is one of the earliest examples in the world of underwater work carried out by a state.${n(12)}`,
 bH:"When did other countries follow?",
 bP:`To see how early 1884 is, it is enough to look at other countries. Rules protecting underwater cultural heritage arrive in Denmark in 1963, in Germany in 1970, in Australia in 1976, in the Netherlands in 1985, in Egypt in 1986, in the USA in 1988, in Poland in 1996, in Lebanon in 2006 and in Italy in 2009. The Ottoman rule is 79 years older than the earliest of them.${n(11)}`,
 dH:"In Türkiye today",
 dP:`The Ottoman regulation is renewed in 1906 and stays in force until 1973; it is replaced first by the Antiquities Law no. 1710 and then, in 1983, by Law no. 2863. Under today’s law, underwater zones containing cultural property that must be protected are designated and announced, and sport diving is not allowed in them. Anyone who finds cultural property must also report it within three days at the latest to the nearest museum directorate, the village headman or the local administrative authority.${n(16)}`,
 cH:"Why does it matter?",
 cP:`Because the article of 1884 states the idea that still holds today: an antiquity under water does not belong to whoever finds it; it belongs to the public. The way to protect that heritage is, most of the time, not to touch it and to report where it is.${n(15)}`,
 N:["Adlercreutz (2017, p. 12).","Adlercreutz (2017, pp. 6–7).","Adlercreutz (2017, p. 9).","Uslu (2015, pp. 55–56).","British Museum (n.d.).","Uslu (2015, pp. 55–60).","Siegel (n.d.); Asan (2023); Uslu (2015, p. 63).","Öniz and Sütçüoğlu (2016, pp. 242–244).","Öniz and Sütçüoğlu (2016, pp. 242–243).","Öniz and Sütçüoğlu (2016, pp. 243–244); Asan (2023).","Öniz and Sütçüoğlu (2016, p. 243).","Öniz and Sütçüoğlu (2016, pp. 244–245).","Öniz and Sütçüoğlu (2016, pp. 242, 244–245); Dromgoole (2013).","Dromgoole (2013).","Underwood (2024, p. 22); International Council on Monuments and Sites [ICOMOS] (1996).","Asan (2023); Kültür ve Tabiat Varlıklarını Koruma Kanunu (1983, arts. 4, 35)."],

es:{title:"Los inicios de la protección del patrimonio subacuático",
 h1:"Los inicios de la protección del patrimonio subacuático",
 lede:"¿A quién pertenece una antigüedad extraída del mar? El mundo se hizo esta pregunta muy tarde. La historia empieza en tierra, con las primeras normas que protegen edificios y tumbas; al mar solo llega en 1884, con un artículo escrito por Osman Hamdi Bey.",
 S:[`La idea de proteger las antigüedades no es nueva. Ya en 458 el emperador romano Mayoriano prohíbe destruir los edificios bellos o útiles que siguen en pie.${n(1)}`,
  `En la misma ciudad las prohibiciones se repiten a lo largo de los siglos. En 1462 el papa Pío II prohíbe intervenir sin autorización en los edificios antiguos, y en 1624 un edicto cardenalicio prohíbe excavar sin autorización; todo lo que se encuentre debe comunicarse en veinticuatro horas.${n(1)}`,
  `La protección no se queda en Roma. En Suecia, en 1666, una proclama dictada en nombre del rey pone bajo protección castillos, túmulos, piedras rúnicas y tumbas.${n(2)}`,
  `Dieciocho años después, en el mismo país, una norma menciona también el agua: las monedas de oro, plata y cobre y las vasijas de metal halladas en la tierra o en el fondo de un lago o del mar deben comunicarse, y dos tercios son para el rey. Pero es una norma sobre tesoros; su fin no es proteger el objeto, sino repartir el tesoro.${n(3)}`,
  `En el siglo XIX el interés por las antigüedades se convierte en excavación. Quien quiere excavar obtiene un permiso del Estado dueño de la tierra; en el permiso consta también cómo se repartirá lo hallado.${n(4)}`,
  `Un permiso no siempre mantiene el objeto en su sitio. Lord Elgin, embajador británico, con un permiso de las autoridades otomanas, retira entre 1801 y 1805 aproximadamente la mitad de las esculturas que quedaban en el Partenón de Atenas; las esculturas están hoy en Londres.${n(5)}`,
  `A veces el permiso se incumple abiertamente. Según el permiso que Heinrich Schliemann obtiene para Troya en 1871, debe dejar al museo la mitad de lo que halle; el tesoro de oro y plata que encuentra en 1873 lo saca del país a escondidas. El pleito se alarga y el Estado acaba conformándose con 50 000 francos.${n(6)}`,
  `Los países responden con leyes. Grecia declara propiedad del Estado las antigüedades procedentes de excavaciones en 1834, Egipto prohíbe la extracción no autorizada en 1835; en el Imperio otomano llegan dos reglamentos, de siete artículos en 1869 y de treinta y seis en 1874.${n(7)}`,
  `Sin embargo, los dos reglamentos otomanos piensan solo en la tierra; ninguno menciona lo que está bajo el agua. Y las antigüedades no salen solo de la tierra: quienes se ganan la vida en el fondo del mar alcanzan también las que hay allí, sacan lo que encuentran y lo venden.${n(8)}`,
  `El hombre que verá ese vacío pasa a dirigir el Museo Imperial (Müze-i Hümayun) en 1881: Osman Hamdi Bey, él mismo un arqueólogo que excava.${n(9)}`,
  `Tres años después, en 1884, Osman Hamdi Bey prepara un nuevo reglamento de treinta y siete artículos. Su artículo tercero cierra el vacío: toda clase de antigüedad extraída del mar, de los lagos, de los ríos, de los arroyos y de los riachuelos pertenece al Estado.${n(10)}`,
  `Este artículo es la norma más antigua que se conoce en el mundo dictada por un Estado para proteger el patrimonio cultural subacuático. En los demás países hay que esperar muchos años algo parecido; en Dinamarca, el siguiente, el año es 1963.${n(11)}`,
  `La norma tampoco se queda en el papel. Cuando en 1891 aparecen en la isla de Formako unas piezas de oro con imágenes, se escribe al Ministerio de Marina: hay que contratar a un buzo, enviarlo a la isla y examinar los hallazgos en el lugar.${n(12)}`,
  `Al año siguiente se sigue el rastro del oro. Treinta y cuatro piezas se hallan en manos de un pastor y setenta y nueve en las de varias personas; interviene también el comandante del vapor Nüzhet. Las monedas reunidas se entregan al gobierno en Rodas.${n(12)}`,
  `Así, Osman Hamdi Bey lleva a cabo un trabajo subacuático en nombre del Estado. Faltan aún nueve años para que unos pescadores de esponjas encuentren en Anticitera el primer pecio antiguo, y medio siglo para que se invente el equipo que independiza al buzo de la superficie.${n(13)}`,
  `Ese equipo llega en la década de 1940 y hace fácil bajar al fondo; los pecios empiezan a sufrir daños. Los países no dictan sus propias leyes para el patrimonio cultural subacuático hasta las décadas de 1960 y 1970.${n(14)}`,
  `Hoy el principio está claro. La Carta del ICOMOS de 1996 establece cómo se protege y se gestiona el patrimonio cultural subacuático; la primera opción es conservarlo en su lugar.${n(15)}`],
 L:{h24:"lo hallado se comunica en 24 horas",crownS:"⅔ para el rey",finderS:"⅓ para quien lo halla",permit:"PERMISO DE EXCAVACIÓN",lon:"a Londres",share:"la parte del museo: ½",fr:"50 000 francos",gr:"Grecia",eg:"Egipto",ot:"otomano",
   noSea:"nada bajo el agua",land:"tierra",sea:"mar",mus:"Müze-i Hümayun",art:"Artículo 3",w:["mar","lago","río","arroyo","riachuelo"],isl:"isla de Formako",bah:"al Ministerio de Marina",nuz:"vapor Nüzhet",c34:"34",c79:"79",rod:"a Rodas",
   ax:["Formako","Anticitera","escafandra autónoma"],y40:"década de 1940",laws:"décadas de 1960 y 1970: primeras leyes subacuáticas",insitu:"conservación in situ",
   tl:["Imperio otomano","Dinamarca","Alemania","Australia","Países Bajos","Egipto","EE. UU.","Polonia","Líbano","Italia"]},
 aH:"Dos documentos",
 aP:`Conocemos el trabajo de la isla de Formako por dos documentos. Ambos están en el Archivo Otomano: el primero está fechado el 8 de agosto de 1891 y el segundo el 23 de mayo de 1892. El trabajo que recogen es uno de los ejemplos más tempranos del mundo de trabajo subacuático realizado por un Estado.${n(12)}`,
 bH:"¿Cuándo llegaron los demás países?",
 bP:`Para ver lo temprano que es 1884 basta mirar a los demás países. Las normas que protegen el patrimonio cultural subacuático llegan a Dinamarca en 1963, a Alemania en 1970, a Australia en 1976, a los Países Bajos en 1985, a Egipto en 1986, a EE. UU. en 1988, a Polonia en 1996, al Líbano en 2006 y a Italia en 2009. La norma otomana es 79 años anterior a la más antigua de ellas.${n(11)}`,
 dH:"En Türkiye hoy",
 dP:`El reglamento otomano se renueva en 1906 y sigue en vigor hasta 1973; lo sustituyen primero la Ley de Antigüedades n.º 1710 y después, en 1983, la Ley n.º 2863. Según la ley actual, las zonas subacuáticas que contienen bienes culturales que deben protegerse se delimitan y se anuncian, y en ellas no se permite el buceo deportivo. Quien encuentra un bien cultural debe además comunicarlo en un plazo máximo de tres días a la dirección del museo más cercano, al alcalde pedáneo o a la autoridad administrativa local.${n(16)}`,
 cH:"¿Por qué importa?",
 cP:`Porque el artículo de 1884 expresa la idea que sigue vigente hoy: una antigüedad bajo el agua no pertenece a quien la encuentra; pertenece al conjunto de la sociedad. La manera de proteger ese patrimonio es, la mayoría de las veces, no tocarlo y comunicar dónde está.${n(15)}`,
 N:["Adlercreutz (2017, p. 12).","Adlercreutz (2017, pp. 6–7).","Adlercreutz (2017, p. 9).","Uslu (2015, pp. 55–56).","British Museum (s. f.).","Uslu (2015, pp. 55–60).","Siegel (s. f.); Asan (2023); Uslu (2015, p. 63).","Öniz y Sütçüoğlu (2016, pp. 242–244).","Öniz y Sütçüoğlu (2016, pp. 242–243).","Öniz y Sütçüoğlu (2016, pp. 243–244); Asan (2023).","Öniz y Sütçüoğlu (2016, p. 243).","Öniz y Sütçüoğlu (2016, pp. 244–245).","Öniz y Sütçüoğlu (2016, pp. 242, 244–245); Dromgoole (2013).","Dromgoole (2013).","Underwood (2024, p. 22); International Council on Monuments and Sites [ICOMOS] (1996).","Asan (2023); Kültür ve Tabiat Varlıklarını Koruma Kanunu (1983, arts. 4, 35)."],
