<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RecOniz · Heritage Coin Recognizer</title>
<meta name="description" content="RecOniz Heritage Coin Recognizer: sikkenin tek yüzünün fotoğrafından Roma imparatorunu önerir; gerekirse diğer yüzü ister. Darphaneler, hükümdarlar ve nominaller kütüphanesiyle.">
<meta name="theme-color" content="#17495A">
<link rel="canonical" href="https://reconiz.org/coins/">
<meta name="apple-mobile-web-app-title" content="Coins">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Heritage Rejoiner: RecOniz ana sayfasıyla aynı tokenlar ve düzen (tek sütun, 720px, kutusuz bölümler, aynı başlık ve fotoğraf kartı) */
/* Düzen: tek sütun, 720px okuma genişliği; çekim kartı en üstte, katalog bir "tip levhası" ızgarası.
   Kimlik: deniz mavisi (sea) + pişmiş toprak (clay); tek yazı ailesi: Instrument Sans (başlık 600, metin 400). */
:root{
  --bg:#F6F7F5; --ink:#152021; --muted:#5B6664; --faint:#8C9795; --line:#DCE2E0; --soft:#ECF0EE; --raised:#FFFFFF;
  --sea:#17495A; --sea-soft:#DCE8EB; --on-sea:#FFFFFF; --clay:#9C5B38; --clay-soft:#F1E3D6;
  --z-rim:#2F6DB3; --z-handle:#8A4BC4; --z-body:#2E8554; --z-base:#C9620C;
  --paper:#FFFFFF; --paper-ink:#111111; --well-a:#EDF2F3; --well-b:#DCE6E8; --chartfill:#E9C9A0;
  --bar:#CCD5D3; --map-sea:#CFE0E6; --map-land:#EFE8DC; --map-coast:#9A8F80; --map-ink:#3A2A20; --map-ink2:#1D3A4C; --map-pin:#A0461E; --map-pin-a:rgba(160,70,30,.45); --map-reg:#285A78; --map-reg-a:rgba(40,90,120,.18); --map-sel:#17495A; --map-sel-a:rgba(23,73,90,.75);
  --shadow:0 1px 2px rgba(21,32,33,.06),0 8px 24px -12px rgba(21,32,33,.18);
  --sans:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
    --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
    --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
    --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
    --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
  --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
  --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
  --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
  --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:12px 56px;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--sans);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(21px,4.6vw,25px);line-height:1.2}
p{margin:0}
a{color:var(--sea);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{color:var(--muted);font-size:15px;max-width:66ch}
.lab,.dlab,.citeLabel,.tagline,.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.center{text-align:center}

/* araçlar menüsü */
.bar{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:min(340px,100%);background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.35);padding:12px;display:flex;flex-direction:column;gap:6px}
.menu .lab{padding:4px 8px 6px}
.menu a,.menu .soon{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink);position:relative}
.menu a:hover{background:var(--soft)}
.menu a[aria-current="page"]{background:var(--sea-soft)}
.menu b{font-size:15.5px;font-weight:600;padding-right:72px}
.menu span{font-size:13.5px;color:var(--muted);line-height:1.4}
.menu i{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.menu .soon{opacity:.55}
@media (max-width:420px){ .tools .lang button{padding:4px 6px} .tools{gap:4px} .tools .themebtn{width:32px;height:32px} }
/* başlık */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
.wm{margin:0;line-height:0;color:var(--ink)}
.wm svg{display:block;height:34px;width:auto}
.mark{flex:none;width:34px;height:48px;color:var(--sea)}
.bar h1{font-size:32px;line-height:1}
h1 .on{color:var(--sea);font-style:italic}
.tagline{margin-top:5px;letter-spacing:.14em;white-space:nowrap;font-size:10.5px}

.tools{display:flex;align-items:center;gap:8px;flex:none}
.themebtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.themebtn:hover{border-color:var(--faint)}
.themebtn svg{width:18px;height:18px}
.themebtn .i-sun{display:none}
:root[data-theme="dark"] .themebtn .i-sun{display:block}:root[data-theme="dark"] .themebtn .i-moon{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .themebtn .i-sun{display:block} :root:not([data-theme="light"]) .themebtn .i-moon{display:none} }
@media (max-width:420px){ .wm svg{height:29px} .tagline{letter-spacing:.1em;font-size:9.5px;white-space:normal;max-width:16.5em;line-height:1.35} .lang button{padding:4px 8px;min-height:30px} .tools{gap:6px} .themebtn{width:34px;height:34px} }
/* segment düğmeleri */
.seg{display:inline-flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--raised)}
.seg button{border:0;background:none;padding:6px 14px;min-height:34px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button{padding:4px 11px;font-size:13px;min-height:30px;letter-spacing:.04em}

/* çekim kartı */
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px;border-radius:20px;background:var(--raised);box-shadow:var(--shadow);border:1px solid var(--line)}
.guide{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:4px 2px 8px}
.guide svg{flex:none;width:64px;height:84px;color:var(--sea)}
.guide .sub{font-size:14.5px}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--sea);color:var(--on-sea);font-weight:600;padding:12px 18px;cursor:pointer;overflow:hidden;border:0;transition:transform .12s ease,filter .12s ease}
.pick:hover{filter:brightness(1.08)}
.pick:active{transform:scale(.985)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pick:focus-within{outline:2px solid var(--sea);outline-offset:3px}
.pick.alt{background:var(--sea-soft);color:var(--sea)}
.pick.big{min-height:54px;font-size:16px;width:100%}
.pick svg{width:20px;height:20px;flex:none}
.scanbtn{grid-column:1/-1;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:700px){ .capture{grid-template-columns:repeat(3,1fr);padding:22px 24px} .scanbtn{grid-column:auto} }

/* hakkında */
.about{gap:14px}
.about{gap:18px}
.about p{color:var(--muted);font-size:15px;max-width:66ch}
.about .lead1{color:var(--ink);font-size:18px;line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:52ch}
.ab{display:flex;flex-direction:column;gap:10px}
.ab h3.lab{margin:0}
ol.steps.sm{gap:10px}
ol.steps.sm li{grid-template-columns:24px 1fr;gap:12px;font-size:15px;color:var(--ink);padding-top:0}
ol.steps.sm li::before{width:24px;height:24px;line-height:24px;font-size:12.5px;background:var(--sea-soft);color:var(--sea)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;line-height:1.5;padding-top:2px}
ol.steps li::before{content:counter(s);font-weight:600;font-size:15px;line-height:28px;width:28px;height:28px;border-radius:50%;text-align:center;background:var(--sea);color:var(--on-sea)}
/* kaynaklar, künye */
.usenotes{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.usenotes p{font-size:15px;max-width:66ch}
.usenotes p:first-child{font-weight:600}
.rights{margin-top:14px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.refs li{padding-left:2em;text-indent:-2em;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.credits p,.use p{max-width:66ch}
.cite-tool{font-size:14.5px;overflow-wrap:anywhere;padding:12px 16px 12px calc(16px + 1.4em);text-indent:-1.4em;background:var(--raised);border:1px solid var(--line);border-radius:12px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:20px}
footer a{color:var(--muted)}

/* Heritage Rejoiner: masa, kaplar, adaylar */
:root{--g1:#2F6DB3;--g2:#C9620C;--g3:#2E8554;--g4:#8A4BC4;--g5:#B23A48;--g6:#6B7A1E;--g7:#0E7C86;--g8:#A0527A;--hit:#E0A030}
.capture .demo{grid-column:1/-1}
@media (min-width:700px){ .capture .demo{grid-column:auto} }
.work{display:flex;flex-direction:column;gap:12px}
.status{font-size:15px;color:var(--ink);min-height:1.5em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--sea);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.th{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.th canvas{max-width:100%;height:56px;width:auto;border-radius:6px}
.th figcaption{font-size:12px;font-weight:600;color:var(--muted)}
#results{display:flex;flex-direction:column;gap:44px}
#results:empty{display:none}
.tzoom{overflow:auto;border-radius:16px;border:1px solid var(--line);cursor:zoom-in;-webkit-overflow-scrolling:touch}
.tzoom.big{cursor:zoom-out}
.tablecv{width:100%;height:auto;display:block}
.tzoom.big .tablecv{width:260%;max-width:none}
.jn{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plates{display:grid;grid-template-columns:1fr;gap:16px}
.plates.part{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.plate{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--raised);box-shadow:var(--shadow);display:flex;flex-direction:column}
.plate canvas{width:100%;height:auto;display:block;background:var(--soft)}
.pmeta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--gc)}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.pdot{width:24px;height:24px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-size:12.5px}
.pct{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gc);color:#fff;font-variant-numeric:tabular-nums}
.pct.part{background:var(--soft);color:var(--muted)}
.porder{font-size:13.5px;color:var(--muted);line-height:1.6}
.mini{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{align-self:flex-start}
.second .plate{box-shadow:none}
.loose{display:flex;flex-wrap:wrap;gap:10px}
.loose canvas{border-radius:6px}
details.all{border:1px solid var(--line);border-radius:14px;padding:0 16px;background:var(--raised)}
details.all summary{padding:14px 0;font-weight:600;font-size:15px;cursor:pointer}
details.all[open]{padding-bottom:16px}
details.all .sub{margin-bottom:12px}
.joins{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.join{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.join canvas{display:block;align-self:center;background:repeating-conic-gradient(var(--soft) 0 25%,var(--bg) 0 50%) 0 0/16px 16px}
.jmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--gc)}
.jt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.lvl.strong{background:var(--sea);color:var(--on-sea)}.lvl.medium{background:var(--sea-soft);color:var(--sea)}.lvl.weak{background:var(--soft);color:var(--muted)}
.jacts{display:flex;gap:8px}
.family{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:16px;background:var(--sea-soft);color:var(--sea);text-decoration:none;font-weight:600}
.family span{font-weight:400;color:var(--muted);font-size:14px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* adımlar ve önizleme rehberi */
h2 .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sea);color:var(--on-sea);font-size:15px;margin-right:10px;vertical-align:3px;letter-spacing:0}
[id^="st-"],.capture,.plate{scroll-margin-top:16px}
.nextstep{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--sea);cursor:pointer;margin-top:4px}
.nextstep:hover{border-color:var(--sea)}
.coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(688px,calc(100% - 24px));z-index:40;background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.45);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.coach p{font-size:15.5px;line-height:1.5}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cx{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;cursor:pointer}
.cbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cbtns .pick{min-height:46px;padding:10px 14px}
.cbtns .pick:disabled{opacity:.45;cursor:default;filter:none}
.hl{outline:3px solid var(--sea);outline-offset:6px;border-radius:18px}
.capture.hl{outline-offset:4px}
body.touring{padding-bottom:240px}



/* sikke tanıma */
.stage2{display:flex;gap:12px;flex-wrap:wrap}
.face{margin:0;display:flex;flex-direction:column;gap:6px;align-items:center}
.face canvas{width:132px;height:132px;border-radius:50%;background:var(--soft);border:1px solid var(--line)}
.face figcaption{font-size:12.5px;color:var(--muted)}
.recacts{display:flex;flex-direction:column;gap:14px}
.otherb{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.otherb.soft .pick:not(.alt){background:var(--sea-soft);color:var(--sea)}
.metalrow{display:flex;flex-direction:column;gap:8px}
#recRes{display:flex;flex-direction:column;gap:14px}
#recRes:empty{display:none}
.cands{display:flex;flex-direction:column;gap:12px}
.cand{display:grid;grid-template-columns:auto 1fr;gap:14px;padding:14px;border:1px solid var(--line);border-radius:18px;background:var(--raised)}
.cand.top{border:2px solid var(--sea);box-shadow:var(--shadow)}
.cimgs{display:flex;gap:6px}
.cimgs img{width:64px;height:64px;border-radius:50%;object-fit:cover;background:var(--soft)}
.cmeta{display:flex;flex-direction:column;gap:4px;min-width:0}
.ct{display:flex;justify-content:space-between;gap:8px;align-items:baseline;flex-wrap:wrap}
.ct b{font-size:17px}
.pct2{font-size:12.5px;font-weight:600;color:var(--sea);font-variant-numeric:tabular-nums}
.clinks{display:flex;gap:14px;font-size:14px;font-weight:600}
@media (max-width:480px){ .cand{grid-template-columns:1fr} .cimgs img{width:72px;height:72px} }
.libsec{gap:16px}
/* sikke kütüphanesi */
.search{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:var(--raised);box-shadow:var(--shadow);border:1px solid var(--line)}
.search input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;width:100%}
.search input:focus{outline:2px solid var(--sea);outline-offset:1px}
.seg.wrap{flex-wrap:wrap;overflow:visible;border-radius:16px}
#tabs button span{font-size:12px;color:inherit;opacity:.7;margin-left:6px;font-variant-numeric:tabular-nums}
.mapbox{border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.mapbox svg{display:block;width:100%;height:auto}
.pin{cursor:pointer;stroke:var(--raised);stroke-width:1.2;opacity:.85}
.pin.on{stroke:var(--ink);stroke-width:2.5;opacity:1}
.detail{border:1px solid var(--line);border-radius:18px;background:var(--raised);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:10px;scroll-margin:16px}
.detail .dh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.detail h3{font-size:20px}
.detail .def{font-size:15px;color:var(--muted);max-width:66ch}
.alt{font-size:13.5px;color:var(--muted)}
.nlink{font-weight:600;font-size:14.5px;align-self:flex-start}
.cx{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;cursor:pointer}
.rows{display:flex;flex-direction:column;border-top:1px solid var(--line)}

 tr:{title:"Heritage Coin Recognizer",libH:"Kütüphane",aboutH:"Heritage Coin Recognizer nedir?",lede:"Heritage Coin Recognizer, sikkenin tek bir yüzünün fotoğrafından hangi Roma imparatoru döneminde basıldığını önerir; adaylar birbirine yakınsa diğer yüzü ister.",howH:"Nasıl çalışır",how1:"Fotoğraftaki sikke zeminden ayrılır ve daire biçiminde kırpılır.",how2:"Küçük bir görüntü modeli (DINOv2) sikke yüzünün görsel parmak izini çıkarır; sikke hangi açıyla çekilmiş olursa olsun sekiz farklı dönüşle denenir.",how3:"Parmak izi, Yale Üniversitesi Sanat Galerisi koleksiyonundaki etiketli Roma sikkelerinden oluşan referans setiyle karşılaştırılır; en yakın imparatorlar sıralanır.",how4:"İlk aday açıkça öndeyse sonuç verilir. Adaylar birbirine yakınsa ya da eşleşme yoksa sikkenin diğer yüzü istenir ve iki yüz birlikte değerlendirilir. Metal biliniyorsa seçilerek adaylar daraltılabilir.",acc:"Ölçülen doğruluk (referans setine alınmamış 1094 Yale sikkesiyle, 43 imparator): doğru imparator tek yüzle %33 oranında ilk sırada, %71 oranında ilk beşte; iki yüzle %39 ilk sırada, %74 ilk beşte. Bu bir ilk sürümdür; referans seti büyüdükçe artması beklenir.",priv:"Fotoğraflar cihazınızda işlenir; hiçbir yere gönderilmez. Model ilk kullanımda indirilir, sonra internetsiz de çalışır.",src1:"Yale University Art Gallery. <i>Numismatic Collection</i> (Yale LUX). Hugging Face üzerinden: yale-cultural-heritage/yuag-numismatics. <a href=\"https://lux.collections.yale.edu\">https://lux.collections.yale.edu</a>",srcH:"Kaynaklar",useH:"Kullanım",useExpert:"Heritage Coin Recognizer yalnızca tanımaya yardımcı olmak için tasarlanmıştır; sonuçlar bir ön değerlendirmedir ve kesin tanım bir uzman tarafından yapılmalıdır.",useScope:"Bu sürüm yalnızca Roma imparatorluk sikkelerini ve referans setinde yeterli örneği olan imparatorları tanır; tip numarası (RIC) vermez, lejant okumaz.",useBeta:"Bu bir deneme sürümüdür; olası aksaklıklar için anlayışınızı rica ederiz. Görüş ve önerilerinizi <a href=\"mailto:muhammedparlak@outlook.com\">muhammedparlak@outlook.com</a> adresine iletebilirsiniz.",navCoin:"Sikke tanıma",navCoinSub:"Heritage Coin Recognizer · tek yüzden Roma imparatoru",_x:"",lede:"Antik Yunan, Roma, Roma eyalet ve Bizans sikkeleri için açık başvuru kütüphanesi: darphaneler, hükümdarlar ve nominaller.",srch:"Ara: darphane, hükümdar ya da nominal",

  aboutH:"Heritage Coin Library nedir?",about1:"Sikke tanıma aracının ilk adımı olarak hazırlanan bir başvuru kütüphanesidir. Darphanelerin yerlerini haritada, hükümdarları zaman sırasıyla, nominalleri tanımlarıyla gösterir; her kayıt Nomisma.org’daki kalıcı adresine bağlanır.",
  about2:"Veriler Nomisma.org’un açık veri deposundan alınmıştır. Tanımlar özgün dilinde (İngilizce) verilir; kesin bilgi için her kaydın Nomisma sayfasına bakınız. Sikke görselleri ve fotoğraftan tanıma sonraki sürümde eklenecektir.",

 en:{title:"Heritage Coin Recognizer",libH:"Library",aboutH:"What is Heritage Coin Recognizer?",lede:"Heritage Coin Recognizer suggests, from a photograph of a single face of a coin, under which Roman emperor it was struck; if the candidates are close, it asks for the other face.",howH:"How it works",how1:"The coin is separated from the background and cropped as a circle.",how2:"A small image model (DINOv2) extracts a visual fingerprint of the coin face; it is tried at eight rotations, whatever angle the coin was photographed at.",how3:"The fingerprint is compared with a reference set of labelled Roman coins from the Yale University Art Gallery collection, and the closest emperors are ranked.",how4:"If the first candidate is clearly ahead, the result is given. If the candidates are close, or nothing matches, the other face of the coin is requested and both faces are assessed together. If the metal is known, selecting it narrows the candidates.",acc:"Measured accuracy (on 1094 Yale coins not used as references, 43 emperors): with one face the correct emperor is first 33% of the time and in the top five 71%; with both faces 39% first and 74% in the top five. This is a first version; accuracy is expected to rise as the reference set grows.",priv:"Photos are processed on your device and are never uploaded. The model is downloaded on first use and then also works without internet.",src1:"Yale University Art Gallery. <i>Numismatic Collection</i> (Yale LUX). Via Hugging Face: yale-cultural-heritage/yuag-numismatics. <a href=\"https://lux.collections.yale.edu\">https://lux.collections.yale.edu</a>",srcH:"Sources",useH:"Use",useExpert:"Heritage Coin Recognizer is designed only to assist identification; its results are a preliminary assessment and a firm identification must be made by a specialist.",useScope:"This version recognises only Roman imperial coins of emperors with enough examples in the reference set; it does not give type numbers (RIC) and does not read legends.",useBeta:"This is a trial version; we ask for your understanding if you encounter any problems. Please send comments and suggestions to <a href=\"mailto:muhammedparlak@outlook.com\">muhammedparlak@outlook.com</a>.",navCoin:"Coin recognition",navCoinSub:"Heritage Coin Recognizer · Roman emperor from one face",_x:"",lede:"An open reference library for ancient Greek, Roman, Roman provincial and Byzantine coins: mints, rulers and denominations.",srch:"Search: mint, ruler or denomination",

function fgMask(c){
  const w=c.width, h=c.height, d=c.getContext("2d").getImageData(0,0,w,h).data;

  const sx=Math.max(1,(w/400)|0), sy=Math.max(1,(h/400)|0);
  for(let x=0;x<w;x+=sx){ push((x)*4); push(((h-1)*w+x)*4); } for(let y=0;y<h;y+=sy){ push((y*w)*4); push((y*w+w-1)*4); }
  const med=a=>{ a.sort((u,v)=>u-v); return a[a.length>>1]; }; const bg=bs.map(med);
  // Zeminden fark: renk sapması (zemin rengi doğrultusuna dik uzaklık) ya da zeminden parlak olma.
  // Gölge zemin renginin koyulaşmış halidir (aynı doğrultu, daha kısa); koyu zeminde parça sayılmaz, açık zeminde zayıf sayılır.
  const bn=Math.hypot(bg[0],bg[1],bg[2])||1, ux=bg[0]/bn, uy=bg[1]/bn, uz=bg[2]/bn, lam=Math.max(0,Math.min(0.6,(bn-150)/300));
  const dist=new Float32Array(w*h); let mx=1;
  for(let i=0,j=0;i<w*h;i++,j+=4){ const r=d[j], g=d[j+1], b=d[j+2]; const al=r*ux+g*uy+b*uz; const px=r-al*ux, py=g-al*uy, pz=b-al*uz;
    const v=Math.max(Math.sqrt(px*px+py*py+pz*pz), al-bn, lam*(bn-al)); dist[i]=v; if(v>mx) mx=v; }
  // zemin gürültüsü: kenar piksellerinin %95'lik değeri
  const bsn=[]; for(let x=0;x<w;x+=sx){ bsn.push(dist[x],dist[(h-1)*w+x]); } for(let y=0;y<h;y+=sy){ bsn.push(dist[y*w],dist[y*w+w-1]); } bsn.sort((a,b)=>a-b); const noise=bsn[Math.floor(bsn.length*0.95)]||0;
  // Otsu eşiği; zemin gürültüsünün belirgin üstündeki her şey parça sayılır (koyu bezemeli bölümler kopmasın)
  const H=new Float64Array(256); for(let i=0;i<w*h;i++) H[Math.min(255,dist[i]/mx*255|0)]++;
  let sum=0; for(let i=0;i<256;i++) sum+=i*H[i]; let sB=0,wB=0,best=0,th=40; const N=w*h;
  for(let t=0;t<256;t++){ wB+=H[t]; if(!wB) continue; const wF=N-wB; if(!wF) break; sB+=t*H[t]; const mB=sB/wB, mF=(sum-sB)/wF, v=wB*wF*(mB-mF)*(mB-mF); if(v>best){ best=v; th=t; } }
  const thr=Math.max(14,Math.min(th/255*mx,3*noise+8));

function morph(m,w,h,r,erode){ const o=new Uint8Array(w*h), t=new Uint8Array(w*h);

async function loadModel(){ if(MODEL&&SESS) return;
  setRec(T("mLoad"));
  if(!MODEL){ const m=await (await fetch("model.json")).json();
    m.Wo=new Float32Array(b64f(m.Wo)); m.bo=new Float32Array(b64f(m.bo)); m.Wr=new Float32Array(b64f(m.Wr)); m.br=new Float32Array(b64f(m.br)); m.Wf=new Float32Array(b64f(m.Wf)); MODEL=m; }
  if(!SESS){ ort.env.wasm.wasmPaths="/ml/"; ort.env.wasm.numThreads=1; SESS=await ort.InferenceSession.create("/ml/dinov2s_q.onnx",{executionProviders:["wasm"]}); } }
/* sikkeyi bul: zeminden ayrılan en büyük, daireye yakın bileşen; bulunamazsa ortadaki kare */
function coinCrop(src){ const S=224, W=Math.min(640,src.width), k=W/src.width, H=Math.round(src.height*k);
  const c=document.createElement("canvas"); c.width=W; c.height=H; const g=c.getContext("2d",{willReadFrequently:true}); g.drawImage(src,0,0,W,H);
  let cx=W/2, cy=H/2, r=Math.min(W,H)/2*0.96;
  try{ const F=fgMask(c), m=F.m, lab=new Int32Array(W*H); let best=0,bb=null,n=0; const st=[];
    for(let i=0;i<W*H;i++){ if(!m[i]||lab[i]) continue; n++; lab[i]=n; st.push(i); let a=0,x0=W,y0=H,x1=0,y1=0,edge=false;
      while(st.length){ const p=st.pop(); a++; const x=p%W, y=(p/W)|0; if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; if(x===0||y===0||x===W-1||y===H-1) edge=true;
        for(const q of [x>0?p-1:-1,x<W-1?p+1:-1,y>0?p-W:-1,y<H-1?p+W:-1]) if(q>=0&&m[q]&&!lab[q]){ lab[q]=n; st.push(q); } }
      const w=x1-x0+1, h=y1-y0+1; if(!edge&&a>best&&a>0.04*W*H&&w/h>0.7&&w/h<1.4&&a/(w*h)>0.55){ best=a; bb=[x0,y0,w,h]; } }
    if(bb){ cx=bb[0]+bb[2]/2; cy=bb[1]+bb[3]/2; r=Math.max(bb[2],bb[3])/2*1.03; } }catch(_){}
  const o=document.createElement("canvas"); o.width=S; o.height=S; const x=o.getContext("2d",{willReadFrequently:true}); x.fillStyle="rgb(128,128,128)"; x.fillRect(0,0,S,S);
  x.save(); x.beginPath(); x.arc(S/2,S/2,S/2,0,Math.PI*2); x.clip(); x.drawImage(c,(cx-r),(cy-r),2*r,2*r,0,0,S,S); x.restore(); return o; }
const MEAN=[0.485,0.456,0.406], STD=[0.229,0.224,0.225];
function toTensor(cv,ang){ const S=224, t=document.createElement("canvas"); t.width=S; t.height=S; const g=t.getContext("2d",{willReadFrequently:true});
  g.fillStyle="rgb(128,128,128)"; g.fillRect(0,0,S,S); g.translate(S/2,S/2); g.rotate(ang); g.drawImage(cv,-S/2,-S/2); const d=g.getImageData(0,0,S,S).data, f=new Float32Array(3*S*S);
  for(let i=0;i<S*S;i++) for(let c=0;c<3;c++) f[c*S*S+i]=(d[i*4+c]/255-MEAN[c])/STD[c]; return new ort.Tensor("float32",f,[1,3,S,S]); }
// özellik: CLS ve yama ortalaması, her biri birim boy (referans setiyle aynı)
async function embed(cv,ang){ const out=await SESS.run({pixel_values:toTensor(cv,ang)}); const h=out.last_hidden_state.data, D=384, N=257;
  const a=new Float32Array(2*D); for(let j=0;j<D;j++) a[j]=h[j]; for(let t=1;t<N;t++) for(let j=0;j<D;j++) a[D+j]+=h[t*D+j];
  const nrm=(o)=>{ let s=0; for(let j=0;j<D;j++) s+=a[o+j]*a[o+j]; s=Math.sqrt(s)||1; for(let j=0;j<D;j++) a[o+j]/=s; }; nrm(0); nrm(D); return a; }
function softmax(W,b,f){ const C=b.length, D=f.length, z=new Float32Array(C); let mx=-1e9;
  for(let c=0;c<C;c++){ let s=b[c]; for(let j=0;j<D;j++) s+=f[j]*W[j*C+c]; z[c]=s; if(s>mx) mx=s; } let t=0; for(let c=0;c<C;c++){ z[c]=Math.exp(z[c]-mx); t+=z[c]; } for(let c=0;c<C;c++) z[c]/=t; return z; }
// her dönüşte yüz türü ve imparator olasılıkları; en emin olunan dönüş seçilir
async function scoreFace(cv){ let pr=0; const runs=[];
  for(let a=0;a<MODEL.rot;a++){ const f=await embed(cv,a*2*Math.PI/MODEL.rot); let s=MODEL.bf; for(let j=0;j<f.length;j++) s+=f[j]*MODEL.Wf[j]; pr+=1/(1+Math.exp(-s)); runs.push(f); }
  const face=pr/MODEL.rot>0.5?1:0; let best=null;
  for(const f of runs){ const p=face?softmax(MODEL.Wr,MODEL.br,f):softmax(MODEL.Wo,MODEL.bo,f); const m=Math.max(...p); if(!best||m>best.m) best={m,p}; }
  return {face, s:Array.from(best.p)}; }
function rank(p){ let q=p.map((v,c)=>v*(METAL?((MODEL.classes[c].mat||{})[METAL]||0)+0.03:1)); const t=q.reduce((x,y)=>x+y,0)||1; return q.map((v,c)=>({c,s:v/t})).sort((a,b)=>b.s-a.s); }
function verdict(r){ const th=MODEL.th; if(r[0].s<th.none) return "none"; if(r[0].s>=th.clear&&r[0].s-r[1].s>=0.15) return "clear"; return "close"; }
function setRec(t){ $("#recStatus").textContent=t; }
async function recognise(src,second){ $("#work").hidden=false; $("#recActs").hidden=true; $("#recRes").innerHTML="";
  try{ await loadModel(); }catch(e){ setRec("Model: "+e.message); return; }
  setRec(T("mRun")); await new Promise(r=>setTimeout(r,30));
  const cv=coinCrop(src); const f=await scoreFace(cv);
  if(!second){ REC={faces:[{cv,face:f.face,s:f.s}]}; } else REC.faces.push({cv,face:f.face,s:f.s});
  showRec(); }
function showRec(){ if(!REC) return; const F=REC.faces; const st=$("#stage"); st.innerHTML="";
  F.forEach((x,i)=>{ const w=document.createElement("figure"); w.className="face"; const c=document.createElement("canvas"); c.width=224; c.height=224; c.getContext("2d").drawImage(x.cv,0,0);
    const cap=document.createElement("figcaption"); cap.textContent=T(i?"face2":"face1")+" · "+T(x.face?"rev":"obv"); w.append(c,cap); st.append(w); });
  const comb=F.length>1? F[0].s.map((v,c)=>(v+F[1].s[c])/2) : F[0].s; const r=rank(comb); const v=verdict(r);
  const msg=F.length>1?(v==="none"?T("bothNone"):T("both")):T(v); setRec(msg);
  $("#recActs").hidden=false; $("#otherBtns").hidden=F.length>1; $("#otherBtns").classList.toggle("soft",v==="clear"); $("#otherCam").hidden=DEMO; $("#otherFile").hidden=DEMO; $("#otherDemo").hidden=!DEMO;
  const show=v==="none"?r.slice(0,3):v==="close"?r.slice(0,5):r.slice(0,3);
  const box=$("#recRes"); box.innerHTML=`<h2>${T("resH")}</h2>`; const list=document.createElement("div"); list.className="cands";
  show.forEach((x,i)=>{ const C=MODEL.classes[x.c]; const pct=Math.round(x.s*100);
    const el=document.createElement("article"); el.className="cand"+(i===0&&v!=="none"?" top":"");
    el.innerHTML=`<div class="cimgs"><img src="refs/${x.c}_o.jpg" alt="" loading="lazy"><img src="refs/${x.c}_r.jpg" alt="" loading="lazy"></div>
      <div class="cmeta"><div class="ct"><b>${esc(C.name)}</b><span class="pct2">${T("sim")} %${pct}</span></div>
      <p class="jn">${C.start!=null?T("reign")+": "+span(C.start,C.end):""}</p>
      ${C.dens&&C.dens.length?`<p class="jn">${T("dens")}: ${C.dens.map(esc).join(", ")}</p>`:""}${C.mints&&C.mints.length?`<p class="jn">${T("mints")}: ${C.mints.map(esc).join(", ")}</p>`:""}
      <p class="clinks">${C.nm?`<a href="https://nomisma.org/id/${C.nm}" target="_blank" rel="noopener">${T("nomisma")} ↗</a>`:""}</p></div>`;
    list.append(el); });
  box.append(list); box.scrollIntoView({behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth",block:"nearest"}); }
async function fromFile(f,second){ const bmp=await createImageBitmap(f,{imageOrientation:"from-image"}).catch(()=>null); if(!bmp){ setRec(T("mNoCoin")); return; } await recognise(bmp,second); }
for(const [id,sec] of [["#cam",false],["#file",false],["#cam2",true],["#file2",true]]) $(id).addEventListener("change",async e=>{ const f=e.target.files[0]; e.target.value=""; if(f){ if(!sec){ DEMO=false; $("#demoNote").hidden=true; } await fromFile(f,sec); } });
$("#again").addEventListener("click",()=>{ REC=null; DEMO=false; $("#work").hidden=true; $("#recRes").innerHTML=""; window.scrollTo({top:0,behavior:"smooth"}); });
$("#metal").addEventListener("click",e=>{ const b=e.target.closest("button"); if(!b) return; METAL=b.dataset.v; [...$("#metal").children].forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===METAL)); if(REC) showRec(); });
$("#demo").addEventListener("click",async()=>{ DEMO=true; const im=new Image(); im.src="refs/demo_o.jpg"; await im.decode(); $("#demoNote").hidden=false; await recognise(im,false); });
$("#otherDemo").addEventListener("click",async()=>{ const im=new Image(); im.src="refs/demo_r.jpg"; await im.decode(); await recognise(im,true); });

fetch("model.json").then(r=>r.json()).then(m=>{ const a=m.eval&&m.eval.acc; window.__acc=a; }).catch(()=>{});
applyLang();
fetch("data.json").then(r=>r.json()).then(d=>{ DATA=d; render(); }).catch(()=>{ $("#list").innerHTML='<p class="sub">—</p>'; });
