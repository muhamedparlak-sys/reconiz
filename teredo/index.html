<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RecOniz · Herkes için Teredo navalis</title>
<meta name="description" content="Herkes için Teredo navalis: ahşap batıkları tüketen deniz kurdunun nasıl yaşadığını ve bir batığın neden amphora yığınına dönüştüğünü canlandırmalarla anlatır.">
<meta name="theme-color" content="#17495A">
<link rel="canonical" href="https://reconiz.org/teredo/">
<meta name="apple-mobile-web-app-title" content="Teredo">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>
/* Heritage Rejoiner: RecOniz ana sayfasıyla aynı tokenlar ve düzen (tek sütun, 720px, kutusuz bölümler, aynı başlık ve fotoğraf kartı) */
/* Düzen: tek sütun, 720px okuma genişliği; çekim kartı en üstte, katalog bir "tip levhası" ızgarası.
   Kimlik: deniz mavisi (sea) + pişmiş toprak (clay); tek yazı ailesi: Instrument Sans (başlık 600, metin 400). */
:root{
  --bg:#F6F7F5; --ink:#152021; --muted:#5B6664; --faint:#8C9795; --line:#DCE2E0; --soft:#ECF0EE; --raised:#FFFFFF;
  --sea:#17495A; --sea-soft:#DCE8EB; --on-sea:#FFFFFF; --clay:#9C5B38; --clay-soft:#F1E3D6;
  --z-rim:#2F6DB3; --z-handle:#8A4BC4; --z-body:#2E8554; --z-base:#C9620C;
  --paper:#FFFFFF; --paper-ink:#111111; --well-a:#EDF2F3; --well-b:#DCE6E8; --chartfill:#E9C9A0;
  --bar:#CCD5D3; --map-sea:#CFE0E6; --map-land:#EFE8DC; --map-coast:#9A8F80; --map-ink:#3A2A20; --map-ink2:#1D3A4C; --map-pin:#A0461E; --map-pin-a:rgba(160,70,30,.45); --map-reg:#285A78; --map-reg-a:rgba(40,90,120,.18); --map-sel:#17495A; --map-sel-a:rgba(23,73,90,.75);
  --shadow:0 1px 2px rgba(21,32,33,.06),0 8px 24px -12px rgba(21,32,33,.18);
  --sans:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
    --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
    --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
    --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
    --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
  --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
  --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
  --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
  --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:12px 56px;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--sans);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(21px,4.6vw,25px);line-height:1.2}
p{margin:0}
a{color:var(--sea);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{color:var(--muted);font-size:15px;max-width:66ch}
.lab,.dlab,.citeLabel,.tagline,.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.center{text-align:center}

/* araçlar menüsü */
.bar{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:min(340px,100%);background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.35);padding:12px;display:flex;flex-direction:column;gap:6px}
.menu .lab{padding:4px 8px 6px}
.menu a,.menu .soon{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink);position:relative}
.menu a:hover{background:var(--soft)}
.menu a[aria-current="page"]{background:var(--sea-soft)}
.menu b{font-size:15.5px;font-weight:600;padding-right:72px}
.menu span{font-size:13.5px;color:var(--muted);line-height:1.4}
.menu i{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.menu .soon{opacity:.55}
@media (max-width:420px){ .tools .lang button{padding:4px 6px} .tools{gap:4px} .tools .themebtn{width:32px;height:32px} }
/* başlık */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
.wm{margin:0;line-height:0;color:var(--ink)}
.wm svg{display:block;height:34px;width:auto}
.mark{flex:none;width:34px;height:48px;color:var(--sea)}
.bar h1{font-size:32px;line-height:1}
h1 .on{color:var(--sea);font-style:italic}
.tagline{margin-top:5px;letter-spacing:.14em;white-space:nowrap;font-size:10.5px}

.tools{display:flex;align-items:center;gap:8px;flex:none}
.themebtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.themebtn:hover{border-color:var(--faint)}
.themebtn svg{width:18px;height:18px}
.themebtn .i-sun{display:none}
:root[data-theme="dark"] .themebtn .i-sun{display:block}:root[data-theme="dark"] .themebtn .i-moon{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .themebtn .i-sun{display:block} :root:not([data-theme="light"]) .themebtn .i-moon{display:none} }
@media (max-width:420px){ .wm svg{height:29px} .tagline{letter-spacing:.1em;font-size:9.5px;white-space:normal;max-width:16.5em;line-height:1.35} .lang button{padding:4px 8px;min-height:30px} .tools{gap:6px} .themebtn{width:34px;height:34px} }
/* segment düğmeleri */
.seg{display:inline-flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--raised)}
.seg button{border:0;background:none;padding:6px 14px;min-height:34px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button{padding:4px 11px;font-size:13px;min-height:30px;letter-spacing:.04em}

/* çekim kartı */
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px;border-radius:20px;background:var(--raised);box-shadow:var(--shadow);border:1px solid var(--line)}
.guide{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:4px 2px 8px}
.guide svg{flex:none;width:64px;height:84px;color:var(--sea)}
.guide .sub{font-size:14.5px}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--sea);color:var(--on-sea);font-weight:600;padding:12px 18px;cursor:pointer;overflow:hidden;border:0;transition:transform .12s ease,filter .12s ease}
.pick:hover{filter:brightness(1.08)}
.pick:active{transform:scale(.985)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pick:focus-within{outline:2px solid var(--sea);outline-offset:3px}
.pick.alt{background:var(--sea-soft);color:var(--sea)}
.pick.big{min-height:54px;font-size:16px;width:100%}
.pick svg{width:20px;height:20px;flex:none}
.scanbtn{grid-column:1/-1;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:700px){ .capture{grid-template-columns:repeat(3,1fr);padding:22px 24px} .scanbtn{grid-column:auto} }

/* hakkında */
.about{gap:14px}
.about{gap:18px}
.about p{color:var(--muted);font-size:15px;max-width:66ch}
.about .lead1{color:var(--ink);font-size:18px;line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:52ch}
.ab{display:flex;flex-direction:column;gap:10px}
.ab h3.lab{margin:0}
ol.steps.sm{gap:10px}
ol.steps.sm li{grid-template-columns:24px 1fr;gap:12px;font-size:15px;color:var(--ink);padding-top:0}
ol.steps.sm li::before{width:24px;height:24px;line-height:24px;font-size:12.5px;background:var(--sea-soft);color:var(--sea)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;line-height:1.5;padding-top:2px}
ol.steps li::before{content:counter(s);font-weight:600;font-size:15px;line-height:28px;width:28px;height:28px;border-radius:50%;text-align:center;background:var(--sea);color:var(--on-sea)}
/* kaynaklar, künye */
.usenotes{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.usenotes p{font-size:15px;max-width:66ch}
.usenotes p:first-child{font-weight:600}
.rights{margin-top:14px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.refs li{padding-left:2em;text-indent:-2em;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.credits p,.use p{max-width:66ch}
.cite-tool{font-size:14.5px;overflow-wrap:anywhere;padding:12px 16px 12px calc(16px + 1.4em);text-indent:-1.4em;background:var(--raised);border:1px solid var(--line);border-radius:12px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:20px}
footer a{color:var(--muted)}

/* Heritage Rejoiner: masa, kaplar, adaylar */
:root{--g1:#2F6DB3;--g2:#C9620C;--g3:#2E8554;--g4:#8A4BC4;--g5:#B23A48;--g6:#6B7A1E;--g7:#0E7C86;--g8:#A0527A;--hit:#E0A030}
.capture .demo{grid-column:1/-1}
@media (min-width:700px){ .capture .demo{grid-column:auto} }
.work{display:flex;flex-direction:column;gap:12px}
.status{font-size:15px;color:var(--ink);min-height:1.5em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--sea);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.th{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.th canvas{max-width:100%;height:56px;width:auto;border-radius:6px}
.th figcaption{font-size:12px;font-weight:600;color:var(--muted)}
#results{display:flex;flex-direction:column;gap:44px}
#results:empty{display:none}
.tzoom{overflow:auto;border-radius:16px;border:1px solid var(--line);cursor:zoom-in;-webkit-overflow-scrolling:touch}
.tzoom.big{cursor:zoom-out}
.tablecv{width:100%;height:auto;display:block}
.tzoom.big .tablecv{width:260%;max-width:none}
.jn{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plates{display:grid;grid-template-columns:1fr;gap:16px}
.plates.part{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.plate{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--raised);box-shadow:var(--shadow);display:flex;flex-direction:column}
.plate canvas{width:100%;height:auto;display:block;background:var(--soft)}
.pmeta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--gc)}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.pdot{width:24px;height:24px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-size:12.5px}
.pct{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gc);color:#fff;font-variant-numeric:tabular-nums}
.pct.part{background:var(--soft);color:var(--muted)}
.porder{font-size:13.5px;color:var(--muted);line-height:1.6}
.mini{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{align-self:flex-start}
.second .plate{box-shadow:none}
.loose{display:flex;flex-wrap:wrap;gap:10px}
.loose canvas{border-radius:6px}
details.all{border:1px solid var(--line);border-radius:14px;padding:0 16px;background:var(--raised)}
details.all summary{padding:14px 0;font-weight:600;font-size:15px;cursor:pointer}
details.all[open]{padding-bottom:16px}
details.all .sub{margin-bottom:12px}
.joins{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.join{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.join canvas{display:block;align-self:center;background:repeating-conic-gradient(var(--soft) 0 25%,var(--bg) 0 50%) 0 0/16px 16px}
.jmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--gc)}
.jt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.lvl.strong{background:var(--sea);color:var(--on-sea)}.lvl.medium{background:var(--sea-soft);color:var(--sea)}.lvl.weak{background:var(--soft);color:var(--muted)}
.jacts{display:flex;gap:8px}
.family{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:16px;background:var(--sea-soft);color:var(--sea);text-decoration:none;font-weight:600}
.family span{font-weight:400;color:var(--muted);font-size:14px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* adımlar ve önizleme rehberi */
h2 .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sea);color:var(--on-sea);font-size:15px;margin-right:10px;vertical-align:3px;letter-spacing:0}
[id^="st-"],.capture,.plate{scroll-margin-top:16px}
.nextstep{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--sea);cursor:pointer;margin-top:4px}
.nextstep:hover{border-color:var(--sea)}
.coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(688px,calc(100% - 24px));z-index:40;background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.45);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.coach p{font-size:15.5px;line-height:1.5}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cx{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;cursor:pointer}
.cbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cbtns .pick{min-height:46px;padding:10px 14px}
.cbtns .pick:disabled{opacity:.45;cursor:default;filter:none}
.hl{outline:3px solid var(--sea);outline-offset:6px;border-radius:18px}
.capture.hl{outline-offset:4px}
body.touring{padding-bottom:240px}

</style>
<style>
/* Herkes için Teredo navalis: RecOniz ailesiyle aynı tokenlar; sayfaya özgü renkler */
:root{ --wood:#C9A27A; --wood-d:#A9825A; --grain:#B58E63; --cavity:#4A3120; --tube:#F4EFE3; --tube-l:#CFC6B2; --flesh:#E6B4A0; --sand:#E3D5B8; --sand-d:#CDBB97; --water-a:#DCEAF0; --water-b:#C3DAE4; --pot:#B8683E; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#10232B; --pot:#C97A50; } }
:root[data-theme="dark"]{ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#10232B; --pot:#C97A50; }
.hero h2{font-size:clamp(28px,7vw,38px);line-height:1.1}
.hero h2 i{font-style:italic;font-weight:600}
.lead1{font-size:18px;line-height:1.5;max-width:60ch}
.stage{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--raised)}
.stage svg{display:block;width:100%;height:auto}
.ctl{display:flex;align-items:center;gap:12px;padding:10px 14px;border-top:1px solid var(--line)}
.ctl button{flex:none;min-width:92px;border:0;border-radius:999px;background:var(--sea);color:var(--on-sea);font-weight:600;padding:8px 16px;min-height:38px;cursor:pointer}
.ctl input[type=range]{flex:1;min-width:0;accent-color:var(--sea);height:28px}
.cap{font-size:16px;min-height:3.1em}
.cap b{font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:5px 12px;font-size:13.5px;color:var(--muted);cursor:pointer}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.meter{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.meter .tr{flex:1;height:8px;border-radius:999px;background:var(--soft);overflow:hidden;border:1px solid var(--line)}
.meter .tr i{display:block;height:100%;background:var(--clay);width:100%}
.meter b{color:var(--ink);font-weight:600;min-width:3.2em;text-align:right;font-variant-numeric:tabular-nums}
.parts{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;counter-reset:p}
.parts li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;font-size:15.5px}
.parts li::before{counter-increment:p;content:counter(p);width:26px;height:26px;border-radius:999px;background:var(--sea);color:var(--on-sea);font-size:13px;font-weight:600;display:grid;place-items:center}
.parts b{font-weight:600}
.where{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

en:{title:"Teredo navalis for everyone",
 h1:"<i>Teredo navalis</i> for everyone",
 lede:"When a wooden ship sinks in the Mediterranean, often only its cargo is left. The wood is consumed by <i>Teredo navalis</i>, which sailors call the shipworm, and its relatives. This page shows how it consumes timber and why a wreck turns into a mound of amphorae.",
 play:"Play", pause:"Pause", replay:"Replay", tAria:"Time",
 aH:"Inside a timber",
 a1:"Settling", a2:"Tunnelling", a3:"Hollowed out", a4:"Falls apart",
 aC1:"<b>Settling.</b> Larvae drift in the water and attach to the surface of the wood.",
 aC2:"<b>Tunnelling.</b> Each one enters the wood and advances along its length, leaving a calcareous lining behind. Its siphons stay at the entrance, in the water.",
 aC3:"<b>Hollowed out.</b> Because the animals advance inside the timber instead of boring through the hull, little of the damage shows from outside.",
 aC4:"<b>Falls apart.</b> The wood is used up; the animal’s calcareous tubes remain. Timber that has disappeared can be recognised from these tubes.",
 aMeter:"Sound wood remaining",
 aNote:"The animation shows the process in simplified form. The time it takes depends on the kind of wood and the conditions of the sea; in saline seas exposed timber can be destroyed within months or years (WreckProtect, 2011; Öniz, 2023, p. 10).",
 bH:"Not a worm but a relative of the mussel",
 bP:"Despite its name, <i>Teredo navalis</i> is not a worm but a bivalve mollusc; it looks like a worm because most of its body lies outside the shell (Langley, 2023). It belongs to the family Teredinidae, of which about 75 species are known (Pournou, 2020, as cited in Öniz, 2023, p. 10).",
 b1:"<span><b>Shells.</b> Rows of teeth on the two small shells at the head end let the animal grip the wood and advance (Turner, 1971, as cited in Öniz, 2023, p. 11).</span>",
 b2:"<span><b>Body.</b> The long, soft body stays inside the tunnel; in some species it occasionally reaches 185 cm (Öniz, 2023, p. 11).</span>",
 b3:"<span><b>Calcareous lining.</b> As it advances the animal secretes a calcareous layer that keeps the tunnel from collapsing (Öniz, 2023, p. 11).</span>",
 b4:"<span><b>Siphons.</b> The siphon at the tail end extends out of the wood and keeps contact with the seawater (Öniz, 2023, p. 11).</span>",
 b5:"<span><b>Pallets.</b> When temperature or salinity changes, the pallets close the entrance of the tunnel; the animal can survive for up to 6 weeks without contact with the water (Blum, 1928, as cited in Öniz, 2023, p. 11).</span>",
 bP2:"The shipworm does not only bore the wood, it digests it (Langley, 2023). It cannot swim and cannot survive without a food source nearby (Grave, 1928, as cited in Öniz, 2023, p. 11).",
 cH:"What happens to the wreck?",
 c1:"Settles", c2:"Wood is consumed", c3:"Hull collapses", c4:"The mound remains",
 cC1:"<b>Settles.</b> The lower part of the hull is buried in sand; the upper part stays exposed in the water.",
 cC2:"<b>Wood is consumed.</b> Timber left exposed on the seabed is eventually destroyed by shipworms (Öniz, 2023, p. 10).",
 cC3:"<b>Hull collapses.</b> With no timber left to hold it, the cargo spreads over the seabed.",
 cC4:"<b>The mound remains.</b> What is left is a mound of amphorae. Timber lying under sand or mud, however, can keep its integrity (Öniz, 2023, p. 10).",
 cLabA:"amphora mound", cLabB:"timber preserved under the sand",
 cNote:"Near the coast waves, and offshore strong currents or bottom trawls, can uncover buried timber; the part that is exposed is in turn destroyed after a time (Öniz, 2023, p. 10).",
 dH:"Where it lives and where it cannot",
 dP:"<i>Teredo navalis</i> is found from cold regions to the tropics, but three conditions are needed for it to multiply rapidly (Steinmayer & Turfa, 1996, as cited in Öniz, 2023, p. 11):",
 dL1:"<b>Temperature</b> above 11 °C (12 °C for larvae)", dL2:"<b>Salinity</b> above 8 PSU", dL3:"<b>Dissolved oxygen</b> above 4 mg per litre",
 wYes:"Lives", wNo:"Cannot live",
 w1H:"Mediterranean", w1P:"Temperature, salinity and oxygen are suitable. The wooden parts of sunken ships disappear after a time that depends on the kind of wood used (Öniz, 2023, p. 10).",
 w2H:"The deep Black Sea", w2P:"Below about 100 metres the water has no oxygen; <i>Teredo navalis</i> and similar shipworms are absent (Öniz, 2023, p. 11).",
 w3H:"Baltic Sea", w3P:"Salinity is very low; aggressive marine borers have not been able to spread here and historical shipwrecks have remained intact (WreckProtect, 2011).",
 w4H:"Fresh water", w4P:"Owners of wooden boats on the Antalya coast take their boats into cold, fresh waters such as the Manavgat River and leave them there for 5–6 weeks; the shipworms that have grown under the boat fall off. This tradition has continued for centuries (Öniz, 2023, p. 11).",
 eH:"A problem thousands of years old for sailors",
 eP:"This family of animals is the main reason why, for thousands of years, the bottoms of ships were sheathed first in copper and then in lead, and later coated with various chemical paints (Öniz, 2023, p. 10). In the Eastern Mediterranean the wood most used for shipbuilding in antiquity was cedar; depending on its density, different kinds of wood are affected by the shipworm to different degrees (Öniz, 2023, pp. 11–12).",
 fH:"Its traces on amphorae",
 fP:"The shipworm can also leave calcareous remains on the surface of amphorae. The density of these traces on amphorae recovered off Rough Cilicia is explained by the animals living in the timber of the wreck having spread onto the amphorae of the cargo as well. This layer hardens and can break up the ceramic surface, destroying decoration, stamps and graffiti (Öniz, 2023, p. 12; Pearson, 1987, as cited in Öniz, 2023).",
 gH:"Is it the only thing that consumes wood?",
 gP:"No. Small crustaceans such as <i>Limnoria</i> (gribble) also bore into wood, and fungi and bacteria rot it (Langley, 2023). However, the rate of degradation by soft rot fungi and erosion bacteria is generally very slow compared with marine borers (WreckProtect, 2011). In saline, oxygenated waters it is the shipworms that consume exposed timber in a short time.",
 hH:"How is it protected?",
 hP:"The way to preserve a wooden wreck in situ is to keep it covered: sandbags, layers of sand, geotextile or fabric sheets (WreckProtect, 2011; Öniz et al., 2024).",
 iH:"If you see timber on a dive",
 i1:"Do not uncover sand, mud or any covering. That cover is what protects buried timber.",
 i2:"Do not touch it or move it.",
 i3:"Record the position and photograph it.",
 i4:"Report it to the nearest museum.",
 iSrc:"Source: Öniz (2023, p. 10); Öniz et al. (2024).",
 refH:"References", refNote:"Formatted in APA 7th edition. Works given in the text with “as cited in” are cited through Öniz (2023).",
 useH:"Use",
 useSimple:"This page was prepared to explain the subject in a way everyone can follow; the drawings and animations are schematic and not to scale.",
 credDev:"Prepared by Muhammed Parlak under the supervision of Hakan Öniz (2026).",
 priv:"Page visits are counted anonymously, without cookies and without collecting personal data.",
 rights:"© 2026 Muhammed Parlak. All rights reserved. The page may be used free of charge for academic, educational and personal purposes; copying, modifying or redistributing it requires written permission.",
 famSub:"The RecOniz family", famH:"Amphora recognition: Underwater Heritage Recognizer"},
es:{title:"Teredo navalis para todos",
 h1:"<i>Teredo navalis</i> para todos",
 lede:"Cuando un barco de madera se hunde en el Mediterráneo, a menudo solo queda su cargamento. La madera la consume <i>Teredo navalis</i>, la broma de los marinos, y sus parientes. Esta página muestra cómo consume la madera y por qué un pecio se convierte en un túmulo de ánforas.",
 play:"Reproducir", pause:"Pausar", replay:"Repetir", tAria:"Tiempo",
 aH:"Dentro de un madero",
 a1:"Asentamiento", a2:"Perforación", a3:"Se vacía", a4:"Se deshace",
 aC1:"<b>Asentamiento.</b> Las larvas derivan en el agua y se fijan a la superficie de la madera.",
 aC2:"<b>Perforación.</b> Cada una entra en la madera y avanza a lo largo de ella, dejando tras de sí un revestimiento calcáreo. Sus sifones quedan en la entrada, en el agua.",
 aC3:"<b>Se vacía.</b> Como los animales avanzan por dentro del madero en lugar de atravesar el casco, el daño apenas se ve desde fuera.",
 aC4:"<b>Se deshace.</b> La madera se agota; quedan los tubos calcáreos del animal. Una madera desaparecida se reconoce por esos tubos.",
 aMeter:"Madera sana restante",
 aNote:"La animación muestra el proceso de forma simplificada. El tiempo depende del tipo de madera y de las condiciones del mar; en mares salinos la madera expuesta puede destruirse en meses o años (WreckProtect, 2011; Öniz, 2023, p. 10).",
 bH:"No es un gusano, sino un pariente del mejillón",
 bP:"A pesar de su nombre, <i>Teredo navalis</i> no es un gusano sino un molusco bivalvo; parece un gusano porque la mayor parte de su cuerpo queda fuera de la concha (Langley, 2023). Pertenece a la familia Teredinidae, de la que se conocen unas 75 especies (Pournou, 2020, citado en Öniz, 2023, p. 10).",
 b1:"<span><b>Valvas.</b> Las hileras de dientes de las dos pequeñas valvas del extremo de la cabeza permiten al animal sujetarse a la madera y avanzar (Turner, 1971, citado en Öniz, 2023, p. 11).</span>",
 b2:"<span><b>Cuerpo.</b> El cuerpo, largo y blando, queda dentro del túnel; en algunas especies llega ocasionalmente a 185 cm (Öniz, 2023, p. 11).</span>",
 b3:"<span><b>Revestimiento calcáreo.</b> Al avanzar, el animal segrega una capa calcárea que impide que el túnel se derrumbe (Öniz, 2023, p. 11).</span>",
 b4:"<span><b>Sifones.</b> El sifón del extremo de la cola sale de la madera y mantiene el contacto con el agua de mar (Öniz, 2023, p. 11).</span>",
 b5:"<span><b>Paletas.</b> Cuando cambian la temperatura o la salinidad, las paletas cierran la entrada del túnel; el animal puede sobrevivir hasta 6 semanas sin contacto con el agua (Blum, 1928, citado en Öniz, 2023, p. 11).</span>",
 bP2:"La broma no solo perfora la madera: la digiere (Langley, 2023). No puede nadar y no sobrevive sin una fuente de alimento cercana (Grave, 1928, citado en Öniz, 2023, p. 11).",
 cH:"¿Qué le ocurre al pecio?",
 c1:"Se asienta", c2:"La madera se consume", c3:"El casco se derrumba", c4:"Queda el túmulo",
 cC1:"<b>Se asienta.</b> La parte inferior del casco queda enterrada en la arena; la superior queda expuesta en el agua.",
 cC2:"<b>La madera se consume.</b> La madera que queda expuesta en el fondo marino acaba destruida por las bromas (Öniz, 2023, p. 10).",
 cC3:"<b>El casco se derrumba.</b> Sin madera que lo sostenga, el cargamento se esparce por el fondo.",
 cC4:"<b>Queda el túmulo.</b> Lo que queda es un túmulo de ánforas. La madera que yace bajo la arena o el fango, en cambio, puede conservar su integridad (Öniz, 2023, p. 10).",
 cLabA:"túmulo de ánforas", cLabB:"madera conservada bajo la arena",
 cNote:"Cerca de la costa el oleaje, y mar adentro las corrientes fuertes o la pesca de arrastre, pueden destapar la madera enterrada; la parte que queda expuesta acaba también destruida (Öniz, 2023, p. 10).",
 dH:"Dónde vive y dónde no puede vivir",
 dP:"<i>Teredo navalis</i> se encuentra desde las regiones frías hasta los trópicos, pero para multiplicarse con rapidez necesita tres condiciones (Steinmayer y Turfa, 1996, citado en Öniz, 2023, p. 11):",
 dL1:"<b>Temperatura</b> superior a 11 °C (12 °C para las larvas)", dL2:"<b>Salinidad</b> superior a 8 PSU", dL3:"<b>Oxígeno disuelto</b> superior a 4 mg por litro",
 wYes:"Vive", wNo:"No puede vivir",
 w1H:"Mediterráneo", w1P:"La temperatura, la salinidad y el oxígeno son adecuados. Las partes de madera de los barcos hundidos desaparecen al cabo de un tiempo que depende del tipo de madera empleada (Öniz, 2023, p. 10).",
 w2H:"El mar Negro profundo", w2P:"Por debajo de unos 100 metros el agua carece de oxígeno; <i>Teredo navalis</i> y las bromas similares están ausentes (Öniz, 2023, p. 11).",
 w3H:"Mar Báltico", w3P:"La salinidad es muy baja; los perforadores marinos agresivos no han podido extenderse aquí y los pecios históricos se han conservado intactos (WreckProtect, 2011).",
 w4H:"Agua dulce", w4P:"Los dueños de embarcaciones de madera de la costa de Antalya las llevan a aguas frías y dulces, como el río Manavgat, y las dejan allí 5–6 semanas; las bromas que han crecido bajo la embarcación se desprenden. Esta tradición se mantiene desde hace siglos (Öniz, 2023, p. 11).",
 eH:"Un problema milenario para los marinos",
 eP:"Esta familia de animales es la razón principal de que, durante miles de años, los fondos de los barcos se forraran primero con cobre y luego con plomo, y más tarde se cubrieran con diversas pinturas químicas (Öniz, 2023, p. 10). En el Mediterráneo oriental la madera más empleada en la construcción naval de la Antigüedad fue el cedro; según su densidad, las distintas maderas se ven afectadas por la broma en distinto grado (Öniz, 2023, pp. 11–12).",
 fH:"Sus huellas en las ánforas",
 fP:"La broma puede dejar también restos calcáreos en la superficie de las ánforas. La abundancia de estas huellas en las ánforas recuperadas frente a la Cilicia Traquea se explica porque los animales que vivían en la madera del pecio se extendieron también sobre las ánforas del cargamento. Esta capa se endurece y puede fragmentar la superficie cerámica, destruyendo decoración, sellos y grafitos (Öniz, 2023, p. 12; Pearson, 1987, citado en Öniz, 2023).",
 gH:"¿Es lo único que consume la madera?",
 gP:"No. Pequeños crustáceos como <i>Limnoria</i> también perforan la madera, y los hongos y las bacterias la pudren (Langley, 2023). Sin embargo, la velocidad de degradación de los hongos de pudrición blanda y de las bacterias de erosión es en general muy lenta en comparación con la de los perforadores marinos (WreckProtect, 2011). En aguas salinas y oxigenadas son las bromas las que consumen en poco tiempo la madera expuesta.",
 hH:"¿Cómo se protege?",
 hP:"La manera de conservar in situ un pecio de madera es mantenerlo cubierto: sacos de arena, capas de arena, geotextil o telas (WreckProtect, 2011; Öniz et al., 2024).",
 iH:"Si ve madera durante una inmersión",
 i1:"No destape la arena, el fango ni ninguna cubierta. Esa cubierta es lo que protege la madera enterrada.",
 i2:"No la toque ni la mueva.",
 i3:"Registre la posición y fotografíela.",
 i4:"Comuníquelo al museo más cercano.",
 iSrc:"Fuente: Öniz (2023, p. 10); Öniz et al. (2024).",
 refH:"Referencias", refNote:"Formato APA, 7.ª edición. Los trabajos indicados en el texto con «citado en» se citan a través de Öniz (2023).",
 useH:"Uso",
 useSimple:"Esta página se ha preparado para explicar el tema de forma que todos puedan seguirlo; los dibujos y las animaciones son esquemáticos y no están a escala.",
 credDev:"Preparada por Muhammed Parlak bajo la supervisión de Hakan Öniz (2026).",
 priv:"Las visitas a la página se cuentan de forma anónima, sin cookies y sin recopilar datos personales.",
 rights:"© 2026 Muhammed Parlak. Todos los derechos reservados. La página puede utilizarse gratuitamente con fines académicos, educativos y personales; su copia, modificación o redistribución requiere autorización por escrito.",
 famSub:"La familia RecOniz", famH:"Identificación de ánforas: Underwater Heritage Recognizer"}};

  A.wood.setAttribute("opacity",1-0.9*fall);
  for(const q of A.tun){ const p=ease(seg(t,q.s,q.s+q.d)), off=q.L*(1-p);
    q.lin.setAttribute("stroke-dashoffset",off); q.cav.setAttribute("stroke-dashoffset",off); q.body.setAttribute("stroke-dashoffset",off);
    const pt=q.lin.getPointAtLength(q.L*p); q.head.setAttribute("cx",pt.x); q.head.setAttribute("cy",pt.y);

const ST={a:-1,c:-1}, JUMP={a:[0,0.2,0.6,1],c:[0,0.3,0.66,1]};
function setStage(w,i,force){ if(ST[w]===i&&!force) return; ST[w]=i; $("#"+w+"Cap").innerHTML=T(w+"C"+(i+1)); [...$("#"+w+"Chips").children].forEach((b,k)=>b.setAttribute("aria-pressed",k===i)); }
function wire(w,S,draw,dur){ const btn=$("#"+w+"Play"), rg=$("#"+w+"T");
  const lab=()=>{ btn.textContent=T(S.play?"pause":S.t>=0.999?"replay":"play"); };
  const stop=()=>{ S.play=false; cancelAnimationFrame(S.raf); lab(); };
  const run=()=>{ if(S.t>=0.999) S.t=0; S.play=true; lab(); let last=performance.now(); const step=now=>{ if(!S.play) return; S.t=Math.min(1,S.t+(now-last)/dur); last=now; rg.value=Math.round(S.t*1000); draw(S.t); if(S.t>=1){ stop(); return; } S.raf=requestAnimationFrame(step); }; S.raf=requestAnimationFrame(step); };
  btn.addEventListener("click",()=>S.play?stop():run());
  rg.addEventListener("input",()=>{ stop(); draw(rg.value/1000); lab(); });
  const ch=$("#"+w+"Chips"); ch.innerHTML=""; for(let i=0;i<4;i++){ const b=document.createElement("button"); b.type="button"; b.dataset.i=i; ch.append(b); b.addEventListener("click",()=>{ stop(); rg.value=Math.round(JUMP[w][i]*1000); draw(JUMP[w][i]); lab(); }); }
  S.lab=lab; S.run=run; S.stop=stop;
  if(!REDUCE&&"IntersectionObserver" in window){ let seen=false; new IntersectionObserver(es=>{ es.forEach(e=>{ if(e.isIntersecting&&!seen){ seen=true; run(); } else if(!e.isIntersecting&&S.play) stop(); }); },{threshold:0.6}).observe($("#svg"+w.toUpperCase())); } }

(()=>{ const b=document.getElementById("menuBtn"), m=document.getElementById("menu"); if(!b||!m) return;
