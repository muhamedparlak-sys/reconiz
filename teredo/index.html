<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>RecOniz · Herkes için Sualtı Mirası</title>
<meta name="description" content="Herkes için Sualtı Mirası, 1. bölüm: bir geminin nasıl battığını, ahşabını tüketen deniz kurdunu (Teredo navalis) ve batıktan geriye neden amphora yığını kaldığını canlandırmalarla anlatır.">
<meta name="theme-color" content="#17495A">
<link rel="canonical" href="https://reconiz.org/teredo/">
<meta name="apple-mobile-web-app-title" content="Teredo">

<style>
/* Heritage Rejoiner: RecOniz ana sayfasıyla aynı tokenlar ve düzen (tek sütun, 720px, kutusuz bölümler, aynı başlık ve fotoğraf kartı) */
/* Düzen: tek sütun, 720px okuma genişliği; çekim kartı en üstte, katalog bir "tip levhası" ızgarası.
   Kimlik: deniz mavisi (sea) + pişmiş toprak (clay); tek yazı ailesi: Instrument Sans (başlık 600, metin 400). */
:root{
  --bg:#F6F7F5; --ink:#152021; --muted:#5B6664; --faint:#8C9795; --line:#DCE2E0; --soft:#ECF0EE; --raised:#FFFFFF;
  --sea:#17495A; --sea-soft:#DCE8EB; --on-sea:#FFFFFF; --clay:#9C5B38; --clay-soft:#F1E3D6;
  --z-rim:#2F6DB3; --z-handle:#8A4BC4; --z-body:#2E8554; --z-base:#C9620C;
  --paper:#FFFFFF; --paper-ink:#111111; --well-a:#EDF2F3; --well-b:#DCE6E8; --chartfill:#E9C9A0;
  --bar:#CCD5D3; --map-sea:#CFE0E6; --map-land:#EFE8DC; --map-coast:#9A8F80; --map-ink:#3A2A20; --map-ink2:#1D3A4C; --map-pin:#A0461E; --map-pin-a:rgba(160,70,30,.45); --map-reg:#285A78; --map-reg-a:rgba(40,90,120,.18); --map-sel:#17495A; --map-sel-a:rgba(23,73,90,.75);
  --shadow:0 1px 2px rgba(21,32,33,.06),0 8px 24px -12px rgba(21,32,33,.18);
  --sans:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
    --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
    --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
    --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
    --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
  --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
  --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
  --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
  --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:12px 56px;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--sans);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(21px,4.6vw,25px);line-height:1.2}
p{margin:0}
a{color:var(--sea);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{color:var(--muted);font-size:15px;max-width:66ch}
.lab,.dlab,.citeLabel,.tagline,.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.center{text-align:center}

/* araçlar menüsü */
.bar{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:min(340px,100%);background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.35);padding:12px;display:flex;flex-direction:column;gap:6px}
.menu .lab{padding:4px 8px 6px}
.menu a,.menu .soon{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink);position:relative}
.menu a:hover{background:var(--soft)}
.menu a[aria-current="page"]{background:var(--sea-soft)}
.menu b{font-size:15.5px;font-weight:600;padding-right:72px}
.menu span{font-size:13.5px;color:var(--muted);line-height:1.4}
.menu i{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.menu .soon{opacity:.55}
@media (max-width:420px){ .tools .lang button{padding:4px 6px} .tools{gap:4px} .tools .themebtn{width:32px;height:32px} }
/* başlık */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
.wm{margin:0;line-height:0;color:var(--ink)}
.wm svg{display:block;height:34px;width:auto}
.mark{flex:none;width:34px;height:48px;color:var(--sea)}
.bar h1{font-size:32px;line-height:1}
h1 .on{color:var(--sea);font-style:italic}
.tagline{margin-top:5px;letter-spacing:.14em;white-space:nowrap;font-size:10.5px}

.tools{display:flex;align-items:center;gap:8px;flex:none}
.themebtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.themebtn:hover{border-color:var(--faint)}
.themebtn svg{width:18px;height:18px}
.themebtn .i-sun{display:none}
:root[data-theme="dark"] .themebtn .i-sun{display:block}:root[data-theme="dark"] .themebtn .i-moon{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .themebtn .i-sun{display:block} :root:not([data-theme="light"]) .themebtn .i-moon{display:none} }
@media (max-width:420px){ .wm svg{height:29px} .tagline{letter-spacing:.1em;font-size:9.5px;white-space:normal;max-width:16.5em;line-height:1.35} .lang button{padding:4px 8px;min-height:30px} .tools{gap:6px} .themebtn{width:34px;height:34px} }
/* segment düğmeleri */
.seg{display:inline-flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--raised)}
.seg button{border:0;background:none;padding:6px 14px;min-height:34px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button{padding:4px 11px;font-size:13px;min-height:30px;letter-spacing:.04em}

/* çekim kartı */
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px;border-radius:20px;background:var(--raised);box-shadow:var(--shadow);border:1px solid var(--line)}
.guide{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:4px 2px 8px}
.guide svg{flex:none;width:64px;height:84px;color:var(--sea)}
.guide .sub{font-size:14.5px}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--sea);color:var(--on-sea);font-weight:600;padding:12px 18px;cursor:pointer;overflow:hidden;border:0;transition:transform .12s ease,filter .12s ease}
.pick:hover{filter:brightness(1.08)}
.pick:active{transform:scale(.985)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pick:focus-within{outline:2px solid var(--sea);outline-offset:3px}
.pick.alt{background:var(--sea-soft);color:var(--sea)}
.pick.big{min-height:54px;font-size:16px;width:100%}
.pick svg{width:20px;height:20px;flex:none}
.scanbtn{grid-column:1/-1;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:700px){ .capture{grid-template-columns:repeat(3,1fr);padding:22px 24px} .scanbtn{grid-column:auto} }

/* hakkında */
.about{gap:14px}
.about{gap:18px}
.about p{color:var(--muted);font-size:15px;max-width:66ch}
.about .lead1{color:var(--ink);font-size:18px;line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:52ch}
.ab{display:flex;flex-direction:column;gap:10px}
.ab h3.lab{margin:0}
ol.steps.sm{gap:10px}
ol.steps.sm li{grid-template-columns:24px 1fr;gap:12px;font-size:15px;color:var(--ink);padding-top:0}
ol.steps.sm li::before{width:24px;height:24px;line-height:24px;font-size:12.5px;background:var(--sea-soft);color:var(--sea)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;line-height:1.5;padding-top:2px}
ol.steps li::before{content:counter(s);font-weight:600;font-size:15px;line-height:28px;width:28px;height:28px;border-radius:50%;text-align:center;background:var(--sea);color:var(--on-sea)}
/* kaynaklar, künye */
.usenotes{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.usenotes p{font-size:15px;max-width:66ch}
.usenotes p:first-child{font-weight:600}
.rights{margin-top:14px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.refs li{padding-left:2em;text-indent:-2em;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.credits p,.use p{max-width:66ch}
.cite-tool{font-size:14.5px;overflow-wrap:anywhere;padding:12px 16px 12px calc(16px + 1.4em);text-indent:-1.4em;background:var(--raised);border:1px solid var(--line);border-radius:12px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:20px}
footer a{color:var(--muted)}

/* Heritage Rejoiner: masa, kaplar, adaylar */
:root{--g1:#2F6DB3;--g2:#C9620C;--g3:#2E8554;--g4:#8A4BC4;--g5:#B23A48;--g6:#6B7A1E;--g7:#0E7C86;--g8:#A0527A;--hit:#E0A030}
.capture .demo{grid-column:1/-1}
@media (min-width:700px){ .capture .demo{grid-column:auto} }
.work{display:flex;flex-direction:column;gap:12px}
.status{font-size:15px;color:var(--ink);min-height:1.5em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--sea);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.th{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.th canvas{max-width:100%;height:56px;width:auto;border-radius:6px}
.th figcaption{font-size:12px;font-weight:600;color:var(--muted)}
#results{display:flex;flex-direction:column;gap:44px}
#results:empty{display:none}
.tzoom{overflow:auto;border-radius:16px;border:1px solid var(--line);cursor:zoom-in;-webkit-overflow-scrolling:touch}
.tzoom.big{cursor:zoom-out}
.tablecv{width:100%;height:auto;display:block}
.tzoom.big .tablecv{width:260%;max-width:none}
.jn{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plates{display:grid;grid-template-columns:1fr;gap:16px}
.plates.part{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.plate{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--raised);box-shadow:var(--shadow);display:flex;flex-direction:column}
.plate canvas{width:100%;height:auto;display:block;background:var(--soft)}
.pmeta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--gc)}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.pdot{width:24px;height:24px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-size:12.5px}
.pct{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gc);color:#fff;font-variant-numeric:tabular-nums}
.pct.part{background:var(--soft);color:var(--muted)}
.porder{font-size:13.5px;color:var(--muted);line-height:1.6}
.mini{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{align-self:flex-start}
.second .plate{box-shadow:none}
.loose{display:flex;flex-wrap:wrap;gap:10px}
.loose canvas{border-radius:6px}
details.all{border:1px solid var(--line);border-radius:14px;padding:0 16px;background:var(--raised)}
details.all summary{padding:14px 0;font-weight:600;font-size:15px;cursor:pointer}
details.all[open]{padding-bottom:16px}
details.all .sub{margin-bottom:12px}
.joins{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.join{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.join canvas{display:block;align-self:center;background:repeating-conic-gradient(var(--soft) 0 25%,var(--bg) 0 50%) 0 0/16px 16px}
.jmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--gc)}
.jt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.lvl.strong{background:var(--sea);color:var(--on-sea)}.lvl.medium{background:var(--sea-soft);color:var(--sea)}.lvl.weak{background:var(--soft);color:var(--muted)}
.jacts{display:flex;gap:8px}
.family{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:16px;background:var(--sea-soft);color:var(--sea);text-decoration:none;font-weight:600}
.family span{font-weight:400;color:var(--muted);font-size:14px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* adımlar ve önizleme rehberi */
h2 .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sea);color:var(--on-sea);font-size:15px;margin-right:10px;vertical-align:3px;letter-spacing:0}
[id^="st-"],.capture,.plate{scroll-margin-top:16px}
.nextstep{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--sea);cursor:pointer;margin-top:4px}
.nextstep:hover{border-color:var(--sea)}
.coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(688px,calc(100% - 24px));z-index:40;background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.45);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.coach p{font-size:15.5px;line-height:1.5}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cx{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;cursor:pointer}
.cbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cbtns .pick{min-height:46px;padding:10px 14px}
.cbtns .pick:disabled{opacity:.45;cursor:default;filter:none}
.hl{outline:3px solid var(--sea);outline-offset:6px;border-radius:18px}
.capture.hl{outline-offset:4px}
body.touring{padding-bottom:240px}

</style>
<style>
/* Herkes için Sualtı Mirası, 1. bölüm (Teredo navalis): tek bir geminin hikâyesi; sahne kaydırdıkça değişir */
:root{ --wood:#C9A27A; --wood-d:#A9825A; --grain:#B58E63; --cavity:#4A3120; --tube:#F4EFE3; --tube-l:#CFC6B2; --flesh:#E6B4A0; --sand:#E3D5B8; --sand-d:#CDBB97; --water-a:#D6E8EF; --water-b:#B9D3DF; --sky:#F1F5F4; --pot:#B8683E; --pot2:#8C8472; --sail:#F7F3EA; --cu:#C7773F; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#0E2028; --sky:#141C1E; --pot:#C97A50; --pot2:#A39A86; --sail:#CFC9BC; --cu:#D38A52; } }
:root[data-theme="dark"]{ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#0E2028; --sky:#141C1E; --pot:#C97A50; --pot2:#A39A86; --sail:#CFC9BC; --cu:#D38A52; }
.hero h2{font-size:clamp(28px,7vw,38px);line-height:1.1}
.hero h2 i,.step i,.txt i,.wc i{font-style:italic}
.lead1{font-size:18px;line-height:1.5;max-width:60ch}
.story{gap:0}
.stick{position:sticky;top:8px;z-index:5;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--bg);box-shadow:0 10px 26px -18px rgba(0,0,0,.45)}
.stick svg{display:block;width:100%;height:auto}
.dots{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--ink);opacity:.18;transition:opacity .25s,transform .25s}
.dots i.on{opacity:.75;transform:scale(1.25)}
.steps2{display:flex;flex-direction:column}
.step{min-height:78vh;display:flex;align-items:flex-start}
.step:first-child{min-height:60vh}
.step:last-child{min-height:70vh}
.step p{position:sticky;top:calc(var(--stb,300px) + 22px);font-size:clamp(19px,4.9vw,22px);line-height:1.42;max-width:30em;opacity:0;transition:opacity .3s;padding-bottom:22px}
.step.on p{opacity:1}
.step.near p{opacity:.22}
.step sup,.txt sup,.wc sup,.sub sup,.limits sup,section>p sup{font-size:.62em;line-height:0;color:var(--sea);font-weight:600;margin-left:1px}
sup a{color:inherit;text-decoration:none}
.where{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.wc{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--raised);display:flex;flex-direction:column;gap:6px}

tr:{title:"Herkes için Sualtı Mirası",
 h1:"Herkes için Sualtı Mirası",
 kick:"1. bölüm · Bir batıktan geriye neden amphora yığını kalır?",
 lede:"Deniz dibindeki bir batıkta neden amphoralar durur da geminin kendisi yoktur? Cevabını, bir geminin hikâyesini baştan izleyerek görelim.",
 S:["Yüklü bir ticaret gemisi Akdeniz’de yol alıyor. Gövdesi ahşap, ambarı amphora dolu.",
  "Su yüzeyi, altındaki derinliği gizler. Bugün deniz dibi sonarla görülebiliyor, fırtınalar önceden tahmin edilebiliyor. O günün denizcisinin elinde bunların hiçbiri yoktur.",
  `Derin sanılan su birden sığlaşabilir. Ani bir fırtına, küçük ahşap gemiyi kayalık kıyılara ya da görünmeyen sığlıklara sürükler.${n(1)}`,
  "Gemi batar. Dibe oturur; gövdenin altı kuma gömülür, üstü suyun içinde açıkta kalır.",
  `Yüzerken onu denizciler korurdu. Gemilerin altı binlerce yıl boyunca deniz kurduna karşı bakır ve kurşun levhalarla kaplanmış, düzenli bakımla ayakta tutulmuştur. Dipte ise onu koruyan kimse yoktur.${n(2)}`,
  `Deniz boş değildir. Oksijenli suda yaşayan bazı canlılar için ahşap doğal bir besindir; bunların başında deniz kurdu gelir. Suda sürüklenen larvaları ahşabı bulur ve yüzeyine tutunur.${n(3)}`,
  `Her biri ahşaba girer ve boyuna doğru ilerlemeye başlar. Gemiyi delip geçmez; ahşabın içinde kalır.${n(4)}`,
  `Yakından bakalım. Adı kurt, ama bu bir kurt değil: çift kabuklu bir yumuşakça, yani midyenin akrabası. Bilimsel adı <i>Teredo navalis</i>.${n(5)}`,
  `Baş ucunda iki küçük kabuk taşır. Kabukların üzerindeki diş sıralarıyla ahşaba tutunur ve ilerler; ahşabı da sindirir.${n(6)}`,
  `İlerlerken tünel çökmesin diye kireçli bir astar bırakır. Kuyruk ucundaki sifon girişte kalır, çünkü deniz suyuna ulaşması gerekir. Koşullar bozulursa iki palet girişi kapatır; hayvan böyle altı haftaya kadar yaşayabilir.${n(7)}`,
  `Aynı ahşabın içinde pek çoğu birlikte ilerler. Ne kadar çok canlı yerleşirse ahşap o kadar çabuk tükenir; süre ahşabın cinsine ve denizin koşullarına da bağlıdır.${n(8)}`,
  "İçi boşalan ahşap dayanımını yitirir. Direk devrilir, gövde çöker; parçaları akıntıyla dağılır.",
  `Geriye geminin yükü kalır: bir amphora yığını. Seramik ve taş deniz kurdunun besini değildir; bu yüzden yerlerinde dururlar. Ahşabın yerinde ise canlının kireçli tüpleri kalır.${n(9)}`,
  `Ama gemi tümüyle yok olmaz. Deniz kurdu suyla temas etmek zorundadır; kumun ya da balçığın altında yaşayamaz. Gömülü kalan ahşap bu yüzden bütünlüğünü koruyabilir.${n(10)}`,
  `Dalgalar, güçlü akıntılar ya da dip trolleri bu örtüyü açarsa, açığa çıkan ahşap da bir süre sonra yok olur.${n(10)}`,
  `Aynı tehlikeli noktada başka gemiler de batar; bazen batıklar üst üste bulunur. Türkiye kıyılarında bunun en bilinen örneği Yassıada’dır. Gövdeleri kalmadığı için onları birbirinden ayıran, taşıdıkları yüktür.${n(11)}`],

 dP:`<i>Teredo navalis</i> soğuk bölgelerden tropiklere geniş bir alana yayılmıştır, ama hızla çoğalması için üç koşul gerekir:${n(12)}`,
 dL1:"<b>Sıcaklık</b> 11 °C’nin üzerinde (larvalar için 12 °C)", dL2:"<b>Tuzluluk</b> 8 PSU’nun üzerinde", dL3:"<b>Çözünmüş oksijen</b> litrede 4 mg’ın üzerinde",

en:{title:"Underwater Heritage for Everyone",
 h1:"Underwater Heritage for Everyone",
 kick:"Chapter 1 · Why does a wreck become a mound of amphorae?",
 lede:"Why, at a wreck on the seabed, are the amphorae still there while the ship itself is gone? Let us find the answer by following the story of one ship from the beginning.",
 S:["A laden merchant ship is sailing the Mediterranean. Her hull is wood; her hold is full of amphorae.",
  "The surface of the water hides the depth beneath it. Today the seabed can be seen with sonar and storms can be forecast. The sailor of that day has neither.",
  `Water that seems deep can suddenly turn shallow. A sudden storm drives the small wooden ship onto rocky shores or hidden shoals.${n(1)}`,
  "The ship sinks. She settles on the seabed; the bottom of the hull is buried in sand, the top stays exposed in the water.",
  `While she was afloat, her sailors protected her. For thousands of years the bottoms of ships were sheathed in copper and lead against the shipworm and kept afloat by regular maintenance. On the seabed no one protects her.${n(2)}`,
  `The sea is not empty. For some of the creatures that live in oxygenated water, wood is natural food; chief among them is the shipworm. Its larvae, drifting in the water, find the wood and attach to its surface.${n(3)}`,
  `Each one enters the wood and begins to advance along its length. It does not bore through the hull; it stays inside the timber.${n(4)}`,
  `Let us look closer. It is called a worm, but it is not one: it is a bivalve mollusc, a relative of the mussel. Its scientific name is <i>Teredo navalis</i>.${n(5)}`,
  `At the head end it carries two small shells. With the rows of teeth on them it grips the wood and advances; it also digests the wood.${n(6)}`,
  `As it advances it leaves a calcareous lining so that the tunnel does not collapse. The siphon at the tail end stays at the entrance, because it has to reach the seawater. If conditions turn bad, two pallets close the entrance; like this the animal can survive for up to six weeks.${n(7)}`,
  `Many of them advance together inside the same timber. The more animals settle, the sooner the wood is used up; the time also depends on the kind of wood and the conditions of the sea.${n(8)}`,
  "Hollowed out, the timber loses its strength. The mast falls and the hull collapses; its pieces are scattered by the current.",
  `What is left is the ship’s cargo: a mound of amphorae. Ceramic and stone are not food for the shipworm, so they stay where they are. Where the wood was, the animal’s calcareous tubes remain.${n(9)}`,
  `But the ship does not vanish completely. The shipworm must stay in contact with the water; it cannot live under sand or mud. That is why buried timber can keep its integrity.${n(10)}`,
  `If waves, strong currents or bottom trawls remove this cover, the timber that is exposed is in turn destroyed after a time.${n(10)}`,
  `Other ships sink at the same dangerous spot; sometimes wrecks are found lying one on top of another. On the Turkish coast the best-known example is Yassıada. With their hulls gone, what tells them apart is the cargo they carried.${n(11)}`],
 L:{deep:"deep water",shoal:"hidden shoal",second:"cargo of a second ship",cu:"copper and lead sheathing",lar:"larvae",sh:"shells",bo:"body",li:"calcareous lining",si:"siphon",pa:"pallets",mound:"amphora mound",bur:"timber preserved under the sand",open:"uncovered timber"},
 dH:"It does not happen in every sea",
 dP:`<i>Teredo navalis</i> is found from cold regions to the tropics, but three conditions are needed for it to multiply rapidly:${n(12)}`,
 dL1:"<b>Temperature</b> above 11 °C (12 °C for larvae)", dL2:"<b>Salinity</b> above 8 PSU", dL3:"<b>Dissolved oxygen</b> above 4 mg per litre",
 wYes:"Lives", wNo:"Cannot live",
 w1H:"Mediterranean", w1P:`All three conditions are met. The wooden parts of sunken ships disappear after a time that depends on the kind of wood used.${n(13)}`,
 w2H:"The deep Black Sea", w2P:`Below about 100 metres the water has no oxygen; <i>Teredo navalis</i> and similar shipworms are absent.${n(13)}`,
 w3H:"Baltic Sea", w3P:`Salinity is very low; aggressive marine borers have not been able to spread here and historical shipwrecks have remained intact.${n(14)}`,
 w4H:"Fresh water", w4P:`Owners of wooden boats on the Antalya coast take their boats into cold, fresh waters such as the Manavgat River and leave them there for 5–6 weeks; the shipworms that have grown under the boat fall off. This tradition has continued for centuries.${n(13)}`,
 eH:"How long does it take?",
 eP:`It depends on the kind of wood and the conditions of the sea; in saline seas exposed timber can be destroyed within months or years.${n(14)} In the Eastern Mediterranean the wood most used for shipbuilding in antiquity was cedar; depending on their density, different kinds of wood are affected by the shipworm to different degrees.${n(15)}`,
 fH:"It leaves its trace on amphorae too",
 fP:`The shipworm can also leave calcareous remains on the surface of amphorae. The density of these traces on amphorae recovered off Rough Cilicia is explained by the animals living in the timber of the wreck having spread onto the cargo as well. This layer hardens and can break up the ceramic surface, destroying decoration, stamps and graffiti.${n(16)}`,
 gH:"Is it the only culprit?",
 gP:`No. Small crustaceans such as <i>Limnoria</i> (gribble) also bore into wood, and fungi and bacteria rot it. However, the rate of degradation by soft rot fungi and erosion bacteria is generally very slow compared with marine borers.${n(17)} In saline, oxygenated waters it is the shipworms that consume exposed timber in a short time.`,
 hH:"So how is it protected?",
 hP:`The end of the story shows the way: to preserve a wooden wreck in situ is to keep it covered. Sandbags, layers of sand, geotextile or fabric sheets are used for this.${n(18)}`,
 iH:"If you see timber on a dive",
 i1:"Do not uncover sand, mud or any covering. That cover is what protects buried timber.",
 i2:`Do not touch it or move it. Removing the cargo can destroy the remains of the ship preserved beneath it.${n(10)}`, i3:"Record the position and photograph it.", i4:"Report it to the nearest museum.",
 N:["Öniz (2024, p. 26).","Öniz (2023, p. 10); Öniz (2024, p. 27).","Öniz (2023, pp. 11–12).","Öniz (2023, p. 11).","Langley (2023); Pournou (2020), as cited in Öniz (2023, p. 10).","Turner (1971), as cited in Öniz (2023, p. 11); Langley (2023).","Öniz (2023, p. 11); Blum (1928), as cited in Öniz (2023, p. 11).","WreckProtect (2011); Öniz (2023, pp. 10, 12); Öniz (2024, p. 27).","Öniz (2023, p. 12); Eriksen and Gregory (2016), as cited in Öniz (2023, p. 10).","Öniz (2023, pp. 10–11); Öniz (2024, p. 27).","Öniz (2024, pp. 26–27).","Steinmayer and Turfa (1996), as cited in Öniz (2023, p. 11).","Öniz (2023, pp. 10–11).","WreckProtect (2011).","Öniz (2023, pp. 11–12).","Öniz (2023, p. 12); Pearson (1987), as cited in Öniz (2023).","Langley (2023); WreckProtect (2011).","WreckProtect (2011); Öniz et al. (2024)."],

es:{title:"Patrimonio subacuático para todos",
 h1:"Patrimonio subacuático para todos",
 kick:"Capítulo 1 · ¿Por qué un pecio se convierte en un túmulo de ánforas?",
 lede:"¿Por qué en un pecio del fondo marino siguen ahí las ánforas y el barco ha desaparecido? Busquemos la respuesta siguiendo desde el principio la historia de un barco.",
 S:["Un mercante cargado navega por el Mediterráneo. Su casco es de madera; su bodega va llena de ánforas.",
  "La superficie del agua oculta la profundidad que hay debajo. Hoy el fondo marino se ve con sonar y las tormentas se pueden prever. El marino de aquel día no tiene nada de eso.",
  `El agua que parece profunda puede volverse somera de repente. Una tormenta repentina arrastra el pequeño barco de madera contra costas rocosas o bajíos ocultos.${n(1)}`,
  "El barco se hunde. Se asienta en el fondo; la parte baja del casco queda enterrada en la arena y la alta, expuesta en el agua.",
  `Mientras navegaba, sus marinos lo protegían. Durante miles de años los fondos de los barcos se forraron con cobre y plomo contra la broma y se mantuvieron a flote con un mantenimiento regular. En el fondo ya nadie lo protege.${n(2)}`,
  `El mar no está vacío. Para algunos de los seres que viven en el agua oxigenada, la madera es un alimento natural; la primera de ellos es la broma. Sus larvas, que derivan en el agua, encuentran la madera y se fijan a su superficie.${n(3)}`,
  `Cada una entra en la madera y empieza a avanzar a lo largo de ella. No atraviesa el casco; se queda dentro del madero.${n(4)}`,
  `Miremos de cerca. Se la llama gusano, pero no lo es: es un molusco bivalvo, pariente del mejillón. Su nombre científico es <i>Teredo navalis</i>.${n(5)}`,
  `En el extremo de la cabeza lleva dos pequeñas valvas. Con las hileras de dientes que tienen se sujeta a la madera y avanza; además, digiere la madera.${n(6)}`,
  `Al avanzar deja un revestimiento calcáreo para que el túnel no se derrumbe. El sifón del extremo de la cola queda en la entrada, porque tiene que alcanzar el agua de mar. Si las condiciones empeoran, dos paletas cierran la entrada; así el animal puede sobrevivir hasta seis semanas.${n(7)}`,
  `Muchas avanzan juntas dentro del mismo madero. Cuantos más animales se asientan, antes se agota la madera; el tiempo depende también del tipo de madera y de las condiciones del mar.${n(8)}`,
  "Vaciada por dentro, la madera pierde su resistencia. El mástil cae y el casco se derrumba; la corriente dispersa sus restos.",
  `Lo que queda es el cargamento del barco: un túmulo de ánforas. La cerámica y la piedra no son alimento para la broma, por eso permanecen en su sitio. Donde estaba la madera quedan los tubos calcáreos del animal.${n(9)}`,
  `Pero el barco no desaparece por completo. La broma tiene que estar en contacto con el agua; no puede vivir bajo la arena o el fango. Por eso la madera enterrada puede conservar su integridad.${n(10)}`,
  `Si el oleaje, las corrientes fuertes o la pesca de arrastre retiran esa cubierta, la madera que queda expuesta acaba también destruida.${n(10)}`,
  `En el mismo punto peligroso se hunden otros barcos; a veces los pecios aparecen unos encima de otros. En la costa turca el ejemplo más conocido es Yassıada. Desaparecidos los cascos, lo que los distingue es el cargamento que llevaban.${n(11)}`],
 L:{deep:"aguas profundas",shoal:"bajío oculto",second:"cargamento de un segundo barco",cu:"forro de cobre y plomo",lar:"larvas",sh:"valvas",bo:"cuerpo",li:"revestimiento calcáreo",si:"sifón",pa:"paletas",mound:"túmulo de ánforas",bur:"madera conservada bajo la arena",open:"madera destapada"},
 dH:"No ocurre en todos los mares",
 dP:`<i>Teredo navalis</i> se encuentra desde las regiones frías hasta los trópicos, pero para multiplicarse con rapidez necesita tres condiciones:${n(12)}`,
 dL1:"<b>Temperatura</b> superior a 11 °C (12 °C para las larvas)", dL2:"<b>Salinidad</b> superior a 8 PSU", dL3:"<b>Oxígeno disuelto</b> superior a 4 mg por litro",
 wYes:"Vive", wNo:"No puede vivir",
 w1H:"Mediterráneo", w1P:`Se cumplen las tres condiciones. Las partes de madera de los barcos hundidos desaparecen al cabo de un tiempo que depende del tipo de madera empleada.${n(13)}`,
 w2H:"El mar Negro profundo", w2P:`Por debajo de unos 100 metros el agua carece de oxígeno; <i>Teredo navalis</i> y las bromas similares están ausentes.${n(13)}`,
 w3H:"Mar Báltico", w3P:`La salinidad es muy baja; los perforadores marinos agresivos no han podido extenderse aquí y los pecios históricos se han conservado intactos.${n(14)}`,
 w4H:"Agua dulce", w4P:`Los dueños de embarcaciones de madera de la costa de Antalya las llevan a aguas frías y dulces, como el río Manavgat, y las dejan allí 5–6 semanas; las bromas que han crecido bajo la embarcación se desprenden. Esta tradición se mantiene desde hace siglos.${n(13)}`,
 eH:"¿Cuánto tarda?",
 eP:`Depende del tipo de madera y de las condiciones del mar; en mares salinos la madera expuesta puede destruirse en meses o años.${n(14)} En el Mediterráneo oriental la madera más empleada en la construcción naval de la Antigüedad fue el cedro; según su densidad, las distintas maderas se ven afectadas por la broma en distinto grado.${n(15)}`,
 fH:"También deja su huella en las ánforas",
 fP:`La broma puede dejar también restos calcáreos en la superficie de las ánforas. La abundancia de estas huellas en las ánforas recuperadas frente a la Cilicia Traquea se explica porque los animales que vivían en la madera del pecio se extendieron también sobre el cargamento. Esta capa se endurece y puede fragmentar la superficie cerámica, destruyendo decoración, sellos y grafitos.${n(16)}`,
 gH:"¿Es la única responsable?",
 gP:`No. Pequeños crustáceos como <i>Limnoria</i> también perforan la madera, y los hongos y las bacterias la pudren. Sin embargo, la velocidad de degradación de los hongos de pudrición blanda y de las bacterias de erosión es en general muy lenta en comparación con la de los perforadores marinos.${n(17)} En aguas salinas y oxigenadas son las bromas las que consumen en poco tiempo la madera expuesta.`,
 hH:"¿Y cómo se protege?",
 hP:`El final de la historia señala el camino: conservar in situ un pecio de madera es mantenerlo cubierto. Para ello se emplean sacos de arena, capas de arena, geotextil o telas.${n(18)}`,
 iH:"Si ve madera durante una inmersión",
 i1:"No destape la arena, el fango ni ninguna cubierta. Esa cubierta es lo que protege la madera enterrada.",
 i2:`No la toque ni la mueva. Retirar el cargamento puede destruir los restos del barco conservados debajo.${n(10)}`, i3:"Registre la posición y fotografíela.", i4:"Comuníquelo al museo más cercano.",
 N:["Öniz (2024, p. 26).","Öniz (2023, p. 10); Öniz (2024, p. 27).","Öniz (2023, pp. 11–12).","Öniz (2023, p. 11).","Langley (2023); Pournou (2020), citado en Öniz (2023, p. 10).","Turner (1971), citado en Öniz (2023, p. 11); Langley (2023).","Öniz (2023, p. 11); Blum (1928), citado en Öniz (2023, p. 11).","WreckProtect (2011); Öniz (2023, pp. 10, 12); Öniz (2024, p. 27).","Öniz (2023, p. 12); Eriksen y Gregory (2016), citado en Öniz (2023, p. 10).","Öniz (2023, pp. 10–11); Öniz (2024, p. 27).","Öniz (2024, pp. 26–27).","Steinmayer y Turfa (1996), citado en Öniz (2023, p. 11).","Öniz (2023, pp. 10–11).","WreckProtect (2011).","Öniz (2023, pp. 11–12).","Öniz (2023, p. 12); Pearson (1987), citado en Öniz (2023).","Langley (2023); WreckProtect (2011).","WreckProtect (2011); Öniz et al. (2024)."],
