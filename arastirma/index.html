<style>
/* Heritage Rejoiner: RecOniz ana sayfasıyla aynı tokenlar ve düzen (tek sütun, 720px, kutusuz bölümler, aynı başlık ve fotoğraf kartı) */
/* Düzen: tek sütun, 720px okuma genişliği; çekim kartı en üstte, katalog bir "tip levhası" ızgarası.
   Kimlik: deniz mavisi (sea) + pişmiş toprak (clay); tek yazı ailesi: Instrument Sans (başlık 600, metin 400). */
:root{
  --bg:#F6F7F5; --ink:#152021; --muted:#5B6664; --faint:#8C9795; --line:#DCE2E0; --soft:#ECF0EE; --raised:#FFFFFF;
  --sea:#17495A; --sea-soft:#DCE8EB; --on-sea:#FFFFFF; --clay:#9C5B38; --clay-soft:#F1E3D6;
  --z-rim:#2F6DB3; --z-handle:#8A4BC4; --z-body:#2E8554; --z-base:#C9620C;
  --paper:#FFFFFF; --paper-ink:#111111; --well-a:#EDF2F3; --well-b:#DCE6E8; --chartfill:#E9C9A0;
  --bar:#CCD5D3; --map-sea:#CFE0E6; --map-land:#EFE8DC; --map-coast:#9A8F80; --map-ink:#3A2A20; --map-ink2:#1D3A4C; --map-pin:#A0461E; --map-pin-a:rgba(160,70,30,.45); --map-reg:#285A78; --map-reg-a:rgba(40,90,120,.18); --map-sel:#17495A; --map-sel-a:rgba(23,73,90,.75);
  --shadow:0 1px 2px rgba(21,32,33,.06),0 8px 24px -12px rgba(21,32,33,.18);
  --sans:"Instrument Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
    --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
    --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
    --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
    --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
    --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111617; --ink:#E6EAE8; --muted:#A1ABA9; --faint:#6E7977; --line:#283133; --soft:#182022; --raised:#1A2224;
  --sea:#8CC3D1; --sea-soft:#1B3037; --on-sea:#0C1A1E; --clay:#DB9A72; --clay-soft:#33251D;
  --z-rim:#72AAEA; --z-handle:#C49AF0; --z-body:#66C28D; --z-base:#F2A259;
  --paper:#D5DBD9; --paper-ink:#111111; --well-a:#1C2A2E; --well-b:#142024; --chartfill:#C9A47A;
  --bar:#3A4749; --map-sea:#132329; --map-land:#243033; --map-coast:#47575A; --map-ink:#E6EAE8; --map-ink2:#CFE3E8; --map-pin:#E29A6E; --map-pin-a:rgba(226,154,110,.42); --map-reg:#8CC3D1; --map-reg-a:rgba(140,195,209,.16); --map-sel:#8CC3D1; --map-sel-a:rgba(140,195,209,.8);
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:12px 56px;-webkit-font-smoothing:antialiased}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
h1,h2,h3{font-family:var(--sans);font-weight:600;margin:0;text-wrap:balance;letter-spacing:-.02em}
h2{font-size:clamp(21px,4.6vw,25px);line-height:1.2}
p{margin:0}
a{color:var(--sea);text-underline-offset:3px}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px}
section{display:flex;flex-direction:column;gap:16px;min-width:0}
.sub{color:var(--muted);font-size:15px;max-width:66ch}
.lab,.dlab,.citeLabel,.tagline,.eyebrow{font-size:11.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.center{text-align:center}

/* araçlar menüsü */
.bar{position:relative}
.menu{position:absolute;top:calc(100% + 6px);right:0;z-index:30;width:min(340px,100%);background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.35);padding:12px;display:flex;flex-direction:column;gap:6px}
.menu .lab{padding:4px 8px 6px}
.menu a,.menu .soon{display:flex;flex-direction:column;gap:2px;padding:10px 12px;border-radius:12px;text-decoration:none;color:var(--ink);position:relative}
.menu a:hover{background:var(--soft)}
.menu a[aria-current="page"]{background:var(--sea-soft)}
.menu b{font-size:15.5px;font-weight:600;padding-right:72px}
.menu span{font-size:13.5px;color:var(--muted);line-height:1.4}
.menu i{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--sea)}
.menu .soon{opacity:.55}
@media (max-width:420px){ .tools .lang button{padding:4px 6px} .tools{gap:4px} .tools .themebtn{width:32px;height:32px} }
/* başlık */
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:7px;min-width:0}
.wm{margin:0;line-height:0;color:var(--ink)}
.wm svg{display:block;height:34px;width:auto}
.mark{flex:none;width:34px;height:48px;color:var(--sea)}
.bar h1{font-size:32px;line-height:1}
h1 .on{color:var(--sea);font-style:italic}
.tagline{margin-top:5px;letter-spacing:.14em;white-space:nowrap;font-size:10.5px}

.tools{display:flex;align-items:center;gap:8px;flex:none}
.themebtn{width:38px;height:38px;border-radius:999px;border:1px solid var(--line);background:var(--raised);color:var(--ink);display:grid;place-items:center;cursor:pointer;padding:0}
.themebtn:hover{border-color:var(--faint)}
.themebtn svg{width:18px;height:18px}
.themebtn .i-sun{display:none}
:root[data-theme="dark"] .themebtn .i-sun{display:block}:root[data-theme="dark"] .themebtn .i-moon{display:none}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .themebtn .i-sun{display:block} :root:not([data-theme="light"]) .themebtn .i-moon{display:none} }
@media (max-width:420px){ .wm svg{height:29px} .tagline{letter-spacing:.1em;font-size:9.5px;white-space:normal;max-width:16.5em;line-height:1.35} .lang button{padding:4px 8px;min-height:30px} .tools{gap:6px} .themebtn{width:34px;height:34px} }
/* segment düğmeleri */
.seg{display:inline-flex;flex-wrap:nowrap;max-width:100%;overflow-x:auto;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--raised)}
.seg button{border:0;background:none;padding:6px 14px;min-height:34px;border-radius:999px;font-size:14px;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.lang button{padding:4px 11px;font-size:13px;min-height:30px;letter-spacing:.04em}

/* çekim kartı */
.capture{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:18px;border-radius:20px;background:var(--raised);box-shadow:var(--shadow);border:1px solid var(--line)}
.guide{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:4px 2px 8px}
.guide svg{flex:none;width:64px;height:84px;color:var(--sea)}
.guide .sub{font-size:14.5px}
.pick{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;background:var(--sea);color:var(--on-sea);font-weight:600;padding:12px 18px;cursor:pointer;overflow:hidden;border:0;transition:transform .12s ease,filter .12s ease}
.pick:hover{filter:brightness(1.08)}
.pick:active{transform:scale(.985)}
.pick input{position:absolute;inset:0;opacity:0;cursor:pointer}
.pick:focus-within{outline:2px solid var(--sea);outline-offset:3px}
.pick.alt{background:var(--sea-soft);color:var(--sea)}
.pick.big{min-height:54px;font-size:16px;width:100%}
.pick svg{width:20px;height:20px;flex:none}
.scanbtn{grid-column:1/-1;cursor:pointer}
.picks{display:flex;flex-wrap:wrap;gap:10px}
@media (min-width:700px){ .capture{grid-template-columns:repeat(3,1fr);padding:22px 24px} .scanbtn{grid-column:auto} }

/* hakkında */
.about{gap:14px}
.about{gap:18px}
.about p{color:var(--muted);font-size:15px;max-width:66ch}
.about .lead1{color:var(--ink);font-size:18px;line-height:1.5;font-weight:500;letter-spacing:-.01em;max-width:52ch}
.ab{display:flex;flex-direction:column;gap:10px}
.ab h3.lab{margin:0}
ol.steps.sm{gap:10px}
ol.steps.sm li{grid-template-columns:24px 1fr;gap:12px;font-size:15px;color:var(--ink);padding-top:0}
ol.steps.sm li::before{width:24px;height:24px;line-height:24px;font-size:12.5px;background:var(--sea-soft);color:var(--sea)}
ol.steps{margin:0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:14px}
ol.steps li{counter-increment:s;display:grid;grid-template-columns:28px 1fr;gap:14px;align-items:start;line-height:1.5;padding-top:2px}
ol.steps li::before{content:counter(s);font-weight:600;font-size:15px;line-height:28px;width:28px;height:28px;border-radius:50%;text-align:center;background:var(--sea);color:var(--on-sea)}
/* kaynaklar, künye */
.usenotes{display:flex;flex-direction:column;gap:10px;padding:16px 18px;border-radius:14px;background:var(--soft);border:1px solid var(--line)}
.usenotes p{font-size:15px;max-width:66ch}
.usenotes p:first-child{font-weight:600}
.rights{margin-top:14px}
.refs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.refs li{padding-left:2em;text-indent:-2em;font-size:14.5px;line-height:1.5;overflow-wrap:anywhere}
.credits p,.use p{max-width:66ch}
.cite-tool{font-size:14.5px;overflow-wrap:anywhere;padding:12px 16px 12px calc(16px + 1.4em);text-indent:-1.4em;background:var(--raised);border:1px solid var(--line);border-radius:12px}
footer{font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:20px}
footer a{color:var(--muted)}

/* Heritage Rejoiner: masa, kaplar, adaylar */
:root{--g1:#2F6DB3;--g2:#C9620C;--g3:#2E8554;--g4:#8A4BC4;--g5:#B23A48;--g6:#6B7A1E;--g7:#0E7C86;--g8:#A0527A;--hit:#E0A030}
.capture .demo{grid-column:1/-1}
@media (min-width:700px){ .capture .demo{grid-column:auto} }
.work{display:flex;flex-direction:column;gap:12px}
.status{font-size:15px;color:var(--ink);min-height:1.5em}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.link{background:none;border:0;color:var(--sea);cursor:pointer;padding:0;text-decoration:underline;text-underline-offset:3px;font-size:14px}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.th{margin:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px;border-radius:12px;background:var(--soft);border:1px solid var(--line)}
.th canvas{max-width:100%;height:56px;width:auto;border-radius:6px}
.th figcaption{font-size:12px;font-weight:600;color:var(--muted)}
#results{display:flex;flex-direction:column;gap:44px}
#results:empty{display:none}
.tzoom{overflow:auto;border-radius:16px;border:1px solid var(--line);cursor:zoom-in;-webkit-overflow-scrolling:touch}
.tzoom.big{cursor:zoom-out}
.tablecv{width:100%;height:auto;display:block}
.tzoom.big .tablecv{width:260%;max-width:none}
.jn{font-size:13.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.plates{display:grid;grid-template-columns:1fr;gap:16px}
.plates.part{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.plate{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--raised);box-shadow:var(--shadow);display:flex;flex-direction:column}
.plate canvas{width:100%;height:auto;display:block;background:var(--soft)}
.pmeta{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;border-top:3px solid var(--gc)}
.ptitle{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.pname{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.pdot{width:24px;height:24px;border-radius:50%;background:var(--gc);color:#fff;display:grid;place-items:center;font-size:12.5px}
.pct{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--gc);color:#fff;font-variant-numeric:tabular-nums}
.pct.part{background:var(--soft);color:var(--muted)}
.porder{font-size:13.5px;color:var(--muted);line-height:1.6}
.mini{border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:6px 14px;font-size:13.5px;cursor:pointer}
.mini[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.play{align-self:flex-start}
.second .plate{box-shadow:none}
.loose{display:flex;flex-wrap:wrap;gap:10px}
.loose canvas{border-radius:6px}
details.all{border:1px solid var(--line);border-radius:14px;padding:0 16px;background:var(--raised)}
details.all summary{padding:14px 0;font-weight:600;font-size:15px;cursor:pointer}
details.all[open]{padding-bottom:16px}
details.all .sub{margin-bottom:12px}
.joins{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.join{border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg)}
.join canvas{display:block;align-self:center;background:repeating-conic-gradient(var(--soft) 0 25%,var(--bg) 0 50%) 0 0/16px 16px}
.jmeta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;border-top:3px solid var(--gc)}
.jt{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lvl{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.lvl.strong{background:var(--sea);color:var(--on-sea)}.lvl.medium{background:var(--sea-soft);color:var(--sea)}.lvl.weak{background:var(--soft);color:var(--muted)}
.jacts{display:flex;gap:8px}
.family{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 18px;border-radius:16px;background:var(--sea-soft);color:var(--sea);text-decoration:none;font-weight:600}
.family span{font-weight:400;color:var(--muted);font-size:14px;display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* adımlar ve önizleme rehberi */
h2 .stepn{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--sea);color:var(--on-sea);font-size:15px;margin-right:10px;vertical-align:3px;letter-spacing:0}
[id^="st-"],.capture,.plate{scroll-margin-top:16px}
.nextstep{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);border-radius:999px;padding:9px 16px;font-weight:600;font-size:14.5px;color:var(--sea);cursor:pointer;margin-top:4px}
.nextstep:hover{border-color:var(--sea)}
.coach{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));width:min(688px,calc(100% - 24px));z-index:40;background:var(--raised);border:1px solid var(--line);border-radius:18px;box-shadow:0 14px 44px -12px rgba(0,0,0,.45);padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.coach p{font-size:15.5px;line-height:1.5}
.chead{display:flex;justify-content:space-between;align-items:center;gap:10px}
.cx{border:0;background:none;color:var(--muted);font-size:22px;line-height:1;padding:2px 6px;cursor:pointer}
.cbtns{display:grid;grid-template-columns:1fr 2fr;gap:10px}
.cbtns .pick{min-height:46px;padding:10px 14px}
.cbtns .pick:disabled{opacity:.45;cursor:default;filter:none}
.hl{outline:3px solid var(--sea);outline-offset:6px;border-radius:18px}
.capture.hl{outline-offset:4px}
body.touring{padding-bottom:240px}

</style>
<style>
/* Herkes için Sualtı Mirası, 1. bölüm (Teredo navalis): tek bir geminin hikâyesi; sahne kaydırdıkça değişir */
:root{ --wood:#C9A27A; --wood-d:#A9825A; --grain:#B58E63; --cavity:#4A3120; --tube:#F4EFE3; --tube-l:#CFC6B2; --flesh:#E6B4A0; --sand:#E3D5B8; --sand-d:#CDBB97; --water-a:#D6E8EF; --water-b:#B9D3DF; --sky:#F1F5F4; --pot:#B8683E; --pot2:#8C8472; --sail:#F7F3EA; --cu:#C7773F; }
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#0E2028; --sky:#141C1E; --pot:#C97A50; --pot2:#A39A86; --sail:#CFC9BC; --cu:#D38A52; } }
:root[data-theme="dark"]{ --wood:#8D6B48; --wood-d:#6E5236; --grain:#7A5B3C; --cavity:#1E140D; --tube:#E9E3D3; --tube-l:#9E9685; --flesh:#D9A08A; --sand:#4A4130; --sand-d:#39321F; --water-a:#17303A; --water-b:#0E2028; --sky:#141C1E; --pot:#C97A50; --pot2:#A39A86; --sail:#CFC9BC; --cu:#D38A52; }
.hero h2{font-size:clamp(28px,7vw,38px);line-height:1.1}
.hero h2 i,.step i,.txt i,.wc i{font-style:italic}
.lead1{font-size:18px;line-height:1.5;max-width:60ch}
.story{gap:0}
.stick{position:sticky;top:8px;z-index:5;border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--bg);box-shadow:0 10px 26px -18px rgba(0,0,0,.45)}
.stick svg{display:block;width:100%;height:auto}
.dots{position:absolute;left:0;right:0;top:8px;display:flex;justify-content:center;gap:5px;pointer-events:none}
.dots i{width:6px;height:6px;border-radius:999px;background:var(--ink);opacity:.18;transition:opacity .25s,transform .25s}
.dots i.on{opacity:.75;transform:scale(1.25)}
.steps2{display:flex;flex-direction:column}
.step{min-height:78vh;display:flex;align-items:flex-start}
.step:first-child{min-height:60vh}
.step:last-child{min-height:70vh}
.step p{position:sticky;top:calc(var(--stb,300px) + 22px);font-size:clamp(19px,4.9vw,22px);line-height:1.42;max-width:30em;opacity:0;transition:opacity .3s;padding-bottom:22px}
.step.on p{opacity:1}
.step.near p{opacity:.22}
.step sup,.txt sup,.wc sup,.sub sup,.limits sup,section>p sup{font-size:.62em;line-height:0;color:var(--sea);font-weight:600;margin-left:1px}
sup a{color:inherit;text-decoration:none}
.where{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (max-width:560px){ .where{grid-template-columns:1fr} }
.wc{border:1px solid var(--line);border-radius:16px;padding:14px 16px;background:var(--raised);display:flex;flex-direction:column;gap:6px}
.wc h3{font-size:16.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.wc p{font-size:14.5px;color:var(--muted)}
.wc .tag{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;border-radius:999px;padding:2px 9px;white-space:nowrap}
.wc.yes .tag{background:var(--clay-soft);color:var(--clay)}
.wc.no .tag{background:var(--sea-soft);color:var(--sea)}
.limits{display:flex;flex-wrap:wrap;gap:8px}
.limits span{border-radius:12px;background:var(--soft);border:1px solid var(--line);padding:8px 12px;font-size:14.5px}
.limits b{font-weight:600}
.txt{display:flex;flex-direction:column;gap:10px}
.txt p{max-width:66ch}
.kick{margin:2px 0 8px;font-size:19px;font-weight:600;color:var(--sea)}
.chap{display:flex;flex-wrap:wrap;gap:8px;margin:2px 0 8px}
.chap a{border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:14.5px;font-weight:600;text-decoration:none;color:var(--ink);background:var(--raised)}
.chap a[aria-current]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.hint{position:fixed;left:50%;bottom:max(14px,env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--raised);color:var(--ink);border-radius:999px;padding:9px 13px 9px 16px;font:600 14.5px var(--sans);cursor:pointer;box-shadow:0 8px 22px -14px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .3s}
.hint.show{opacity:1;pointer-events:auto}
.scrim{position:fixed;left:0;right:0;bottom:0;height:104px;z-index:5;pointer-events:none;background:linear-gradient(to bottom,transparent,var(--bg) 58%);opacity:0;transition:opacity .3s}
.scrim.show{opacity:1}
.hint.mini{padding:9px;opacity:0}
.hint.mini.show{opacity:.82}
.hint.mini span{display:none}
.hint svg{width:18px;height:18px;animation:nudge 1.4s ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(-2px)}50%{transform:translateY(3px)}}
@media (prefers-reduced-motion: reduce){ .hint svg{animation:none} }
.callout{padding:18px 20px;border-radius:18px;background:var(--sea-soft)}
.callout h2{color:var(--sea)}
.steps{margin:0;padding-left:1.3em;display:flex;flex-direction:column;gap:8px}
.notes{margin:0;padding-left:1.6em;display:flex;flex-direction:column;gap:4px;font-size:14px;color:var(--muted)}
.wig{animation:wig 1.6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 100%}
@keyframes wig{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
@media (prefers-reduced-motion: reduce){ .wig{animation:none} .step p{transition:none} }

 uP:`UPL, Antalya’da yaklaşık bir yılda yapılan 38 metrelik bir sualtı arkeolojisi araştırma gemisidir; adını, yapımını destekleyen şirketten alır ve 2022’de tanıtılmıştır. 500 metre derinliğe kadar çalışan çok ışınlı bir sonar, görüntü ve örnek alabilen robotlar ve dalış kazalarına karşı beş kişilik bir basınç odası taşır. Makineleri dışındaki bütün elektriğini güneş panellerinden karşılar.${n(3)}`,
 fH:"Fethiye’de ne bulundu?",
 fP:`2025’te Fethiye kıyılarında üç batık ile daha önce bilinmeyen bir antik demirleme yeri belgelenmiştir. Demirleme yerinin Tunç Çağı’ndan Osmanlı dönemine kadar kullanıldığı; Mısır, Filistin, Lübnan ve Suriye kıyılarından gelen gemilerin burada fırtınadan korunduğu düşünülür. Araştırma, Kültür ve Turizm Bakanlığı’nın izniyle, “Geleceğe Miras Projesi” kapsamında, Akdeniz Üniversitesi’nden Hakan Öniz’in başkanlığında yürütülmüştür.${n(1)}`,
 kH:"Bu anlatım neye dayanıyor?",
 kP:`Geminin donanımı ve Fethiye’deki sonuçlar yayımlanmış haberlerden alınmıştır. Karelaj, derinlik haritası, denizcilerle görüşme, buluntuların etiketlenmesi ve bildirilmesi adımları ile kazıların öncelik ve bütçeye bağlı olduğu bilgisi ise Hakan Öniz’in aktardığı çalışma yöntemine dayanır; ekibin tanıtımı ise anlatıcının gözlemidir. Haritadaki kareler, derinlik renkleri ve işaretler şematiktir; hiçbir buluntunun yerini göstermez.${n(2)}`,
 N:["DenizHaber (2025).","Yöntemin bu adımı Hakan Öniz’in aktardıklarına dayanır; yayımlanmış bir kaynağı yoktur.","Arkeolojik Haber (2022); Harman Time (2022).","Arkeolojik Haber (2022)."],
 refH:"Kaynaklar", notesH:"Notlar", refNote:"Kaynakça APA 7. baskı biçimindedir.",
 hint:"Kaydırarak ilerleyin",

en:{title:"Discovering Underwater Heritage: How Is a Survey Carried Out?",
 h1:"Discovering Underwater Heritage: How Is a Survey Carried Out?",
 lede:"Before anyone dives, a wreck is looked for in a square on a map, in a fisherman’s words and on a sonar screen.",
 S:[`2025. Seen from the eastern shore of Fethiye, the sea looks the same everywhere; its surface says nothing of what lies beneath.${n(1)}`,
  `So the work begins not at sea but at a table: the map of the coast is divided into squares. Each square is an area to be scanned when its turn comes.${n(2)}`,
  `A depth map is laid over the squares. Depth decides in which square a diver can work, and in which only the sonar and the robot can.${n(2)}`,
  `Which square to start with is told by those who know the sea. The team talks with captains, divers and fishermen, asking where nets snag and where jars have been seen on the bottom; the squares are ranked accordingly.${n(2)}`,
  `Once the order is set, the team puts to sea with the permission of the Ministry of Culture and Tourism. UPL is a 38-metre research vessel: a green ship that draws all its electricity, except for its engines, from solar panels.${n(3)}`,
  `On board are two captains; Hakan Öniz, who heads the survey and is in charge of the ship; his three assistants; two doctors; and a team member who is both cook and diver.`,
  `The team is joined, for short periods, by student trainees from all over the world, directed here by UNESCO and by academics in their own countries. The faces, from Asia, Africa, Scandinavia and the United States, keep changing. The Ministry’s representatives, who observe the work, change in turn as well.`,
  `Eighteen researchers can watch the sonar image at the same time; for the divers there is also a five-person pressure chamber.${n(3)}`,
  `In the first square the ship goes back and forth from one end to the other, like a farmer ploughing a field. The multibeam sonar builds a three-dimensional image of the seabed down to 500 metres.${n(4)}`,
  `Most of the image is sand and rock. Now and then a shape appears that does not belong to the bottom: an anomaly.${n(2)}`,
  `If the image holds archaeological promise, a robot is sent down to that depth. Its camera tells rock from cargo.${n(4)}`,
  `Then comes the exploration dive. The divers look, measure and photograph.${n(1)}`,
  `Every find that is photographed is tagged under water and documented with its number, its measurements and its position.${n(2)}`,
  `That season, three wrecks and a previously unknown ancient anchorage are documented off Fethiye: a place where ships came and dropped anchor from the Bronze Age to Ottoman times.${n(1)}`,
  `Every find that is documented is reported to the Ministry of Culture and Tourism and entered in the inventory; its position is not published.${n(2)} With ten new wrecks that season, the number of wrecks in the inventory rises from 411 to 421.${n(1)}`,
  `Not every wreck that is documented is excavated. Underwater excavations proceed within the limits of prioritisation and of the budget available.${n(2)}`,
  `On the map on the table, a few squares are no longer empty. From above the sea looks the same as before; but a few more of the things beneath it are now known.`],
 L:{fe:"Fethiye, 2025",grid:"survey grid",dmap:"depth map",sh:"shallow",dp:"deep",pri:"order of priority",sol:"solar panels",res:"18 researchers",ch:"pressure chamber: 5 people",son:"multibeam sonar",an:"anomaly",rov:"robot",dive:"exploration dive",w3:"3 wrecks",anc:"ancient anchorage",era1:"Bronze Age",era2:"Ottoman",min:"Ministry of Culture and Tourism",inv:"wrecks in the inventory",loc:"position not published",sq:"squares scanned",cap:"captain",ho:"Hakan Öniz",ast:"assistants",doc:"doctors",stu:"student trainees",tag:"tagging and recording",exc:"excavation: priority and budget",rep1:"Ministry",rep2:"representative",cook:"cook and diver"},
 uH:"What kind of ship is UPL?",
 uP:`UPL is a 38-metre underwater archaeology research vessel built in Antalya in about a year; it takes its name from the company that supported its construction and was presented in 2022. It carries a multibeam sonar that works down to 500 metres, robots that can take images and samples, and a five-person pressure chamber in case of diving accidents. All its electricity, except for its engines, comes from solar panels.${n(3)}`,
 fH:"What was found off Fethiye?",
 fP:`In 2025, three wrecks and a previously unknown ancient anchorage were documented off Fethiye. The anchorage is thought to have been used from the Bronze Age to Ottoman times, and ships coming from the coasts of Egypt, Palestine, Lebanon and Syria are thought to have sheltered here from storms. The survey was carried out with the permission of the Ministry of Culture and Tourism of Türkiye, within the “Heritage for the Future Project”, under the direction of Hakan Öniz of Akdeniz University.${n(1)}`,
 kH:"What is this account based on?",
 kP:`The ship’s equipment and the results from Fethiye are taken from published news reports. The steps of gridding, depth mapping, talking with seafarers, tagging and reporting the finds, and the point that excavation depends on priority and budget, rest on the working method as described by Hakan Öniz; the introduction of the team is the narrator’s own observation. The squares, depth colours and marks on the map are schematic; they do not show the position of any find.${n(2)}`,
 N:["DenizHaber (2025).","This step of the method rests on what Hakan Öniz has described; it has no published source.","Arkeolojik Haber (2022); Harman Time (2022).","Arkeolojik Haber (2022)."],
 refH:"References", notesH:"Notes", refNote:"The reference list follows APA 7th edition.",
 hint:"Scroll to continue",
 useH:"Use",
 useSimple:"This page was prepared to explain the subject in a way everyone can follow; the drawings and the animation are schematic and not to scale. The drawings of the ship, the sonar image, the robot and the map do not show their real appearance; the positions of finds are not published. The drawings of the team are schematic, based on a description of its members; they are not portraits.",
 credDev:"Content: Hakan Öniz · Narration: Muhammed Parlak (2026).",
 priv:"Page visits are counted anonymously, without cookies and without collecting personal data.",
 rights:"© 2026 Muhammed Parlak. All rights reserved. The page may be used free of charge for academic, educational and personal purposes; copying, modification or redistribution requires written permission.",
 rel1Sub:"Related page", rel1H:"Standing Up for Underwater Heritage: A Shared Responsibility", rel2Sub:"Related page", rel2H:"The Importance of Underwater Heritage and the Reasons for Protecting It",
 famSub:"The RecOniz family", famH:"Amphora recognition: Underwater Heritage Recognizer"},
es:{title:"El descubrimiento del patrimonio subacuático: ¿cómo se hace una prospección?",
 h1:"El descubrimiento del patrimonio subacuático: ¿cómo se hace una prospección?",
 lede:"Antes de que nadie bucee, un pecio se busca en la cuadrícula de un mapa, en las palabras de un pescador y en la pantalla de un sonar.",
 S:[`2025. Vista desde la costa oriental de Fethiye, el mar es igual en todas partes; su superficie no dice nada de lo que hay debajo.${n(1)}`,
  `Por eso el trabajo no empieza en el mar, sino en una mesa: el mapa de la costa se divide en cuadrículas. Cada cuadrícula es una zona que se explorará cuando le llegue el turno.${n(2)}`,
  `Sobre las cuadrículas se coloca el mapa de profundidades. La profundidad decide en qué cuadrícula puede trabajar un buceador y en cuál solo el sonar y el robot.${n(2)}`,
  `Por cuál cuadrícula empezar lo dicen quienes conocen el mar. Se habla con capitanes, buceadores y pescadores; se pregunta dónde se enganchan las redes y dónde se han visto ánforas en el fondo, y las cuadrículas se ordenan según eso.${n(2)}`,
  `Fijado el orden, el equipo se hace a la mar con el permiso del Ministerio de Cultura y Turismo. El UPL es un buque de investigación de 38 metros: un barco verde que obtiene de paneles solares toda su electricidad, salvo la de los motores.${n(3)}`,
  `A bordo van dos capitanes; Hakan Öniz, que dirige la prospección y es el responsable del barco; sus tres ayudantes; dos médicas; y una integrante del equipo que es a la vez cocinera y buceadora.`,
  `Al equipo se suman, por periodos cortos, estudiantes en prácticas de todo el mundo, enviados por la UNESCO y por académicos de sus propios países. Las caras, llegadas de Asia, África, Escandinavia y Estados Unidos, cambian constantemente. También se van turnando los representantes del Ministerio, que observan los trabajos.`,
  `Dieciocho investigadores pueden seguir a la vez la imagen del sonar; para los buceadores hay además una cámara hiperbárica para cinco personas.${n(3)}`,
  `En la primera cuadrícula el barco va y viene de un extremo a otro, como un agricultor que ara su campo. El sonar multihaz obtiene una imagen tridimensional del fondo hasta los 500 metros.${n(4)}`,
  `La mayor parte de la imagen es arena y roca. De vez en cuando aparece una forma que no encaja con el fondo: una anomalía.${n(2)}`,
  `Si la imagen tiene interés arqueológico, se baja un robot a esa profundidad. Su cámara distingue la roca del cargamento.${n(4)}`,
  `Después viene la inmersión de reconocimiento. Los buceadores miran, miden y fotografían.${n(1)}`,
  `Cada hallazgo fotografiado se etiqueta bajo el agua y se documenta con su número, sus medidas y su posición.${n(2)}`,
  `Esa campaña se documentan frente a Fethiye tres pecios y un fondeadero antiguo hasta entonces desconocido: un lugar donde los barcos llegaron a fondear desde la Edad del Bronce hasta la época otomana.${n(1)}`,
  `Cada hallazgo documentado se comunica al Ministerio de Cultura y Turismo y pasa al inventario; su posición no se publica.${n(2)} Con diez pecios nuevos esa campaña, el número de pecios del inventario pasa de 411 a 421.${n(1)}`,
  `No todos los pecios documentados se excavan. Las excavaciones subacuáticas avanzan dentro de lo que permiten las prioridades y el presupuesto.${n(2)}`,
  `En el mapa de la mesa, algunas cuadrículas ya no están vacías. Desde arriba el mar sigue pareciendo el mismo; pero ahora se conocen algunas cosas más de las que hay debajo.`],
 L:{fe:"Fethiye, 2025",grid:"cuadrícula",dmap:"mapa de profundidades",sh:"somero",dp:"profundo",pri:"orden de prioridad",sol:"paneles solares",res:"18 investigadores",ch:"cámara hiperbárica: 5 personas",son:"sonar multihaz",an:"anomalía",rov:"robot",dive:"inmersión de reconocimiento",w3:"3 pecios",anc:"fondeadero antiguo",era1:"Edad del Bronce",era2:"época otomana",min:"Ministerio de Cultura y Turismo",inv:"pecios en el inventario",loc:"posición no publicada",sq:"cuadrículas exploradas",cap:"capitán",ho:"Hakan Öniz",ast:"ayudantes",doc:"médicas",stu:"estudiantes en prácticas",tag:"etiquetado y documentación",exc:"excavación: prioridad y presupuesto",rep1:"representante",rep2:"del Ministerio",cook:"cocinera y buceadora"},
 uH:"¿Qué clase de barco es el UPL?",
 uP:`El UPL es un buque de investigación de arqueología subacuática de 38 metros, construido en Antalya en aproximadamente un año; toma su nombre de la empresa que apoyó su construcción y se presentó en 2022. Lleva un sonar multihaz que trabaja hasta los 500 metros, robots capaces de tomar imágenes y muestras, y una cámara hiperbárica para cinco personas por si hay accidentes de buceo. Toda su electricidad, salvo la de los motores, procede de paneles solares.${n(3)}`,
 fH:"¿Qué se encontró frente a Fethiye?",
 fP:`En 2025 se documentaron frente a Fethiye tres pecios y un fondeadero antiguo hasta entonces desconocido. Se cree que el fondeadero se utilizó desde la Edad del Bronce hasta la época otomana, y que los barcos que venían de las costas de Egipto, Palestina, Líbano y Siria se resguardaban aquí de las tormentas. La prospección se llevó a cabo con el permiso del Ministerio de Cultura y Turismo de Türkiye, dentro del «Proyecto Patrimonio para el Futuro», bajo la dirección de Hakan Öniz, de la Universidad de Akdeniz.${n(1)}`,
 kH:"¿En qué se basa este relato?",
 kP:`El equipamiento del barco y los resultados de Fethiye proceden de noticias publicadas. Los pasos de la cuadrícula, el mapa de profundidades, las conversaciones con la gente de mar, el etiquetado y la comunicación de los hallazgos, y el hecho de que la excavación dependa de las prioridades y del presupuesto, se basan en el método de trabajo descrito por Hakan Öniz; la presentación del equipo es una observación del propio narrador. Las cuadrículas, los colores de profundidad y las marcas del mapa son esquemáticos; no indican la posición de ningún hallazgo.${n(2)}`,
 N:["DenizHaber (2025).","Este paso del método se basa en lo que ha descrito Hakan Öniz; no tiene fuente publicada.","Arkeolojik Haber (2022); Harman Time (2022).","Arkeolojik Haber (2022)."],
 refH:"Referencias", notesH:"Notas", refNote:"La lista de referencias sigue la 7.ª edición de APA.",
 hint:"Desliza para continuar",
 useH:"Uso",
 useSimple:"Esta página se ha preparado para explicar el tema de forma que todos puedan seguirlo; los dibujos y la animación son esquemáticos y no están a escala. Los dibujos del barco, la imagen del sonar, el robot y el mapa no muestran su aspecto real; las posiciones de los hallazgos no se publican. Los dibujos del equipo son esquemáticos, basados en una descripción de sus miembros; no son retratos.",
 credDev:"Contenido: Hakan Öniz · Narración: Muhammed Parlak (2026).",
 priv:"Las visitas a la página se cuentan de forma anónima, sin cookies y sin recopilar datos personales.",
 rights:"© 2026 Muhammed Parlak. Todos los derechos reservados. La página puede utilizarse gratuitamente con fines académicos, educativos y personales; su copia, modificación o redistribución requiere autorización por escrito.",
 rel1Sub:"Página relacionada", rel1H:"Hacerse cargo del patrimonio subacuático: una responsabilidad compartida", rel2Sub:"Página relacionada", rel2H:"La importancia del patrimonio subacuático y las razones para protegerlo",
 famSub:"La familia RecOniz", famH:"Identificación de ánforas: Underwater Heritage Recognizer"}};

const T=k=>(I18N[LANG][k]!==undefined?I18N[LANG][k]:(NAV[LANG][k]!==undefined?NAV[LANG][k]:k));
const REDUCE=window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
const NS="http://www.w3.org/2000/svg";
const el=(p,nm,a)=>{ const e=document.createElementNS(NS,nm); for(const k in a) e.setAttribute(k,a[k]); p.append(e); return e; };
const rng=s=>()=>{ s=(s*1664525+1013904223)>>>0; return s/4294967296; };
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2, seg=(t,a,b)=>clamp((t-a)/(b-a),0,1), lerp=(a,b,k)=>a+(b-a)*k;
const FF="Instrument Sans,system-ui,sans-serif";
const YEARS=[1884,1963,1970,1976,1985,1986,1988,1996,2006,2009];

const SC={waves:[],sc:[]}; const SURF=128, BED=372, GR=352;
(function build(){ const s=$("#scene");
  const d=el(s,"defs",{}); const g=el(d,"linearGradient",{id:"wG",x1:0,y1:0,x2:0,y2:1}); el(g,"stop",{offset:0,style:"stop-color:var(--water-a)"}); el(g,"stop",{offset:1,style:"stop-color:var(--water-b)"});
  el(el(d,"clipPath",{id:"fr"}),"rect",{x:0,y:0,width:720,height:440});
  const root=el(s,"g",{"clip-path":"url(#fr)"});
  const INK="fill:var(--ink)", STONE="fill:var(--stone);stroke:var(--wood-d)";
  const scene=(bg)=>{ const gg=el(root,"g",{}); el(gg,"rect",{x:0,y:0,width:720,height:440,style:"fill:var("+(bg||"--sky")+")"}); SC.sc.push(gg); return gg; };
  const txt=(p,x,y,size,anchor,weight)=>el(p,"text",{x,y,"text-anchor":anchor||"middle","font-family":FF,"font-size":size,"font-weight":weight||600,style:"fill:var(--ink)"});
  const halo=t=>{ t.setAttribute("style","fill:var(--ink);stroke:var(--bg);paint-order:stroke"); t.setAttribute("stroke-width",5); t.setAttribute("stroke-linejoin","round"); return t; };
  const lab=(p,x,y,x2,y2,anchor,tx)=>{ const gg=el(p,"g",{opacity:0}); el(gg,"path",{d:`M${x} ${y} L${x2} ${y2}`,fill:"none",style:"stroke:var(--ink)","stroke-width":1.4}); gg.t=halo(txt(gg,tx==null?x:tx,y+(y<y2?-9:26),25,anchor)); return gg; };
  const ground=(p,y,v)=>el(p,"path",{d:`M0 ${y} Q180 ${y-6} 360 ${y} T720 ${y-2} V440 H0Z`,style:"fill:var("+(v||"--sand")+")"});
  /* yıl kartı */
  const yc=(p,x,y,year,w)=>{ w=w||84; const gg=el(p,"g",{opacity:0}); el(gg,"rect",{x,y,width:w,height:58,rx:7,style:"fill:var(--paper);stroke:var(--tube-l)","stroke-width":1.6}); const t=txt(gg,x+w/2,y+31,24,"middle",700); t.textContent=year; el(gg,"circle",{cx:x+w/2,cy:y+46,r:4.5,style:"fill:var(--clay)"}); gg.x=x; gg.y=y; return gg; };
  const card=(p,x,y,w,h,year)=>{ const gg=el(p,"g",{opacity:0}); el(gg,"rect",{x,y,width:w,height:h,rx:14,style:"fill:var(--raised);stroke:var(--line)","stroke-width":1.6}); const t=txt(gg,x+w/2,y+40,32,"middle",700); t.textContent=year; gg.t=txt(gg,x+w/2,y+h-16,22); return gg; };
  const sheet=(p,x,y,w,h,year,big)=>{ const gg=el(p,"g",{opacity:0}); el(gg,"rect",{x,y,width:w,height:h,rx:8,style:"fill:var(--paper);stroke:var(--tube-l)","stroke-width":1.6});
    if(year){ txt(gg,x+w/2,y+(big?50:44),big?40:32,"middle",700).textContent=year; }
    const r2=rng(+year||7), rows=big?2:4; for(let i=0;i<rows;i++) el(gg,"line",{x1:x+18,y1:y+68+i*15+(big?4:0),x2:x+w-18-r2()*30,y2:y+68+i*15+(big?4:0),style:"stroke:var(--tube-l)","stroke-width":4,"stroke-linecap":"round"});
    return gg; };
  const chip=(p,x,y,w,kind,on)=>{ const gg=el(p,"g",{}); el(gg,"rect",{x,y,width:w,height:34,rx:17,style:on?"fill:var(--sea)":"fill:none;stroke:var(--faint)","stroke-width":1.6,"stroke-dasharray":on?"":"5 4"});
    const c=on?"var(--on-sea)":"var(--faint)";
    if(kind==="land"){ el(gg,"path",{d:`M${x+15} ${y+26} h14 M${x+18} ${y+26} v-14 M${x+26} ${y+26} v-14 M${x+14} ${y+10} h16`,fill:"none",style:`stroke:${c}`,"stroke-width":2.4,"stroke-linecap":"round"}); }
